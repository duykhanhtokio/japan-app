name: Build complete approved NPC audio
on:
  push:
    branches: [recovery/jlpt-n3-n1]
    paths: [scripts/dialogue-voice/factory/release-request.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: approved-npc-audio-factory
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      tag: ${{ steps.matrix.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          python - <<'PY'
          import json,os
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('value='+json.dumps({'index':list(range(48))})+'\n')
            f.write('tag=npc-audio-'+os.environ['GITHUB_RUN_ID']+'\n')
          PY
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.matrix.outputs.tag }}
        run: gh release view "$TAG" || gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "NPC audio build (in progress)" --notes "Source-bound approved-voice build. App activation requires all 42,768 turn bindings; listening review remains pending."
  synthesize:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            src
            scripts
            assets/dialogue-voice
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm install --no-save --package-lock=false esbuild
      - run: node scripts/dialogue-voice/prepare.cjs "$RUNNER_TEMP/plan.json"
      - run: python scripts/dialogue-voice/factory/seed.py "$GITHUB_SHA"
      - name: Download and verify the approved engine
        run: |
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/engine.7z" https://github.com/VOICEVOX/voicevox_engine/releases/download/0.25.2/voicevox_engine-linux-cpu-x64-0.25.2.7z.001
          echo 'bab016a966131b89bad398e7b898f8c742617dc80a7da49bf494cd07133dbc7a  '"$RUNNER_TEMP/engine.7z" | sha256sum --check
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full ffmpeg
          7z x "$RUNNER_TEMP/engine.7z" -o"$RUNNER_TEMP/engine" -y >/dev/null
          chmod +x "$RUNNER_TEMP/engine/linux-cpu-x64/run"
      - name: Synthesize and decoder-validate assigned clips
        env:
          WORKER: ${{ matrix.index }}
        run: python scripts/dialogue-voice/factory/build.py worker --plan "$RUNNER_TEMP/plan.json" --engine "$RUNNER_TEMP/engine/linux-cpu-x64/run" --index "$WORKER" --workers 48 --seed assets/dialogue-voice --output "$RUNNER_TEMP/audio"
      - name: Preserve bounded audio packs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/audio/voice-*.mp3 "$RUNNER_TEMP"/audio/worker-*.json --clobber
  integrate:
    needs: [prepare, synthesize]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/jlpt-n3-n1
          filter: blob:none
          sparse-checkout: |
            src
            scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm install --no-save --package-lock=false esbuild
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release download "$TAG" --pattern 'worker-*.json' --dir "$RUNNER_TEMP/manifests"
      - name: Validate current-source completeness and integrate
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node scripts/dialogue-voice/prepare.cjs "$RUNNER_TEMP/current-plan.json"
          python scripts/dialogue-voice/factory/build.py finalize --plan "$RUNNER_TEMP/current-plan.json" --input "$RUNNER_TEMP/manifests" --output src/data/dialogue-content/audio-packs --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" --commit "$GITHUB_SHA"
          node scripts/check-jlpt-approved-ui-lock.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/dialogue-content/audio-packs src/data/dialogue-content/npc-audio-release.json
          git commit -m "Integrate complete 42768-turn approved NPC recordings"
          git push origin HEAD:recovery/jlpt-n3-n1
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --title 'Complete NPC voice recordings (listening QA pending)' --notes '42,768 exact-source NPC turn bindings, four approved voices. Pre-generated MP3 packs; learners do not install VOICEVOX. Decoder and source checks passed; human/native listening review remains pending.'

<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chỉnh đầu bài nghe JLPT</title>
<style>
  *{box-sizing:border-box}body{font:16px system-ui,-apple-system,sans-serif;background:#f5f4ef;color:#172b35;margin:0}header{background:#133e52;color:white;padding:18px max(20px,calc((100vw - 960px)/2))}h1{font-size:23px;margin:0 0 6px}header p{margin:0;line-height:1.5}main{max-width:960px;margin:auto;padding:20px 16px 120px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}input[type=search]{flex:1;min-width:210px;padding:12px;border:1px solid #9baeb5;border-radius:8px;font-size:16px}button{font:inherit;cursor:pointer;border:1px solid #829eab;background:white;border-radius:8px;min-height:42px;padding:7px 12px;color:#123c50}button:hover{background:#e6f0f3}button:disabled{opacity:.5;cursor:default}.group{margin-top:23px}.group h2{font-size:19px;margin:0 0 10px}.exam{display:grid;grid-template-columns:minmax(180px,1fr) auto auto;gap:10px;align-items:center;background:white;border:1px solid #d7e0e1;padding:12px 14px;margin:8px 0;border-radius:10px}.exam.active{border:2px solid #147397;background:#f0f9fc}.exam strong{display:block}.exam small{color:#54666b}.time{font-variant-numeric:tabular-nums;font-weight:700;min-width:76px;text-align:center}.player{background:white;border:2px solid #147397;border-radius:12px;padding:20px;margin:18px 0;position:sticky;top:6px;z-index:2;box-shadow:0 3px 20px #1b3d521a}.player h2{margin:0 0 6px;font-size:19px}.note{font-size:14px;color:#50616a;margin:8px 0 12px}.timer{font-size:23px;font-variant-numeric:tabular-nums;margin:12px 0}.buttons{display:flex;gap:8px;flex-wrap:wrap}.slider{width:100%;margin:8px 0;accent-color:#147397;cursor:pointer}footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #c5d3d5;padding:12px max(16px,calc((100vw - 960px)/2));display:flex;gap:15px;align-items:center;justify-content:space-between;z-index:3}#save{background:#116b7f;color:white;border-color:#116b7f;padding:10px 24px;font-weight:700}#message{font-size:14px}#warning{color:#995000}.hidden{display:none!important}@media(max-width:620px){.exam{grid-template-columns:1fr auto}.exam .time{grid-column:1}.player{position:static}footer{align-items:flex-start}}
</style>
<header><h1>Chỉnh phần đầu bài nghe JLPT</h1><p>Chọn đề, nghe đoạn đầu, đặt mốc bắt đầu. Sau khi chỉnh các đề, bấm <b>Lưu toàn bộ</b> một lần.</p></header>
<main>
 <div class="toolbar"><input id="filter" type="search" placeholder="Tìm cấp độ hoặc năm, ví dụ N2 2017"><span id="count"></span></div>
 <section class="player" id="player" hidden>
   <h2 id="selected"></h2><p class="note" id="source"></p>
   <div class="timer"><span id="now">0:00.0</span> / <span id="duration">Đang tải…</span></div>
   <input id="seek" class="slider" type="range" min="0" max="1" step="0.1" value="0" aria-label="Vị trí toàn bài nghe">
   <p>Mốc bắt đầu: <strong id="start">0:06.5</strong></p>
   <div class="buttons"><button id="back">−0,5 giây</button><button id="forward">+0,5 giây</button><button id="mark">Đặt mốc tại vị trí đang phát</button><button id="preview">Nghe từ mốc</button><button id="pause">Tạm dừng</button></div>
   <p class="note" id="warning"></p>
 </section>
 <div id="exams"></div>
</main>
<footer><span id="message">Chưa có thay đổi</span><button id="save" disabled>Lưu toàn bộ</button></footer>
<audio id="audio" preload="metadata"></audio>
<script>
const $=id=>document.getElementById(id), audio=$('audio');
let exams=[],starts={},changes={},revision='',selected=null,duration=0;
const format=ms=>{const seconds=Math.max(0,ms)/1000;return `${Math.floor(seconds/60)}:${(seconds%60).toFixed(1).padStart(4,'0')}`};
const value=id=>changes[id]??starts[id]??6500;
const title=e=>`${e.level} · ${e.period}`;
function update(){
  $('count').textContent=`${exams.length} đề`;
  $('exams').innerHTML='';
  for(const level of [...new Set(exams.map(e=>e.level))]){
    const section=document.createElement('section');section.className='group';section.dataset.level=level;
    const heading=document.createElement('h2');heading.textContent=level;section.append(heading);
    for(const e of exams.filter(item=>item.level===level)){
      const row=document.createElement('div');row.className='exam'+(e.id===selected?.id?' active':'');row.dataset.search=(title(e)+' '+e.id).toLowerCase();
      const name=document.createElement('div');const strong=document.createElement('strong');strong.textContent=e.period;const small=document.createElement('small');small.textContent=e.id;name.append(strong,small);
      const time=document.createElement('span');time.className='time';time.textContent=format(value(e.id));
      const choose=document.createElement('button');choose.textContent='Chỉnh đề này';choose.onclick=()=>select(e);
      row.append(name,time,choose);section.append(row);
    }
    $('exams').append(section);
  }
  filter();$('start').textContent=selected?format(value(selected.id)):'0:06.5';
  $('save').disabled=Object.keys(changes).length===0;
  $('message').textContent=Object.keys(changes).length?`${Object.keys(changes).length} đề đã chỉnh, chưa lưu`:'Đã lưu hết thay đổi';
}
function filter(){const q=$('filter').value.trim().toLowerCase();for(const group of document.querySelectorAll('.group')){let visible=0;for(const row of group.querySelectorAll('.exam')){const show=!q||row.dataset.search.includes(q);row.classList.toggle('hidden',!show);if(show)visible++}group.classList.toggle('hidden',!visible)}}
function select(e){
  audio.pause();selected=e;duration=0;$('player').hidden=false;$('selected').textContent=title(e);$('source').textContent=`Tệp phát trong app: ${e.asset}`;
  $('duration').textContent='Đang tải…';$('now').textContent='0:00.0';$('seek').value=0;$('warning').textContent=e.asset.endsWith('.mp3')?'MP3 có thể tua khác nhau giữa trình duyệt và iPhone. Sau khi lưu, kiểm tra đoạn đầu một lần trong app.':'';
  audio.src='/audio/'+encodeURIComponent(e.id);audio.load();update();$('player').scrollIntoView({behavior:'smooth',block:'start'});
}
function setStart(ms){if(!selected||!duration)return;const max=Math.floor((duration*1000-100)/500)*500;changes[selected.id]=Math.max(0,Math.min(max,Math.round(ms/500)*500));update()}
$('back').onclick=()=>setStart(value(selected.id)-500);
$('forward').onclick=()=>setStart(value(selected.id)+500);
$('mark').onclick=()=>setStart(audio.currentTime*1000);
$('preview').onclick=async()=>{if(!selected)return;audio.pause();audio.currentTime=value(selected.id)/1000;try{await audio.play()}catch(error){$('warning').textContent=error.message}};
$('pause').onclick=()=>audio.pause();
$('seek').oninput=()=>{if(duration)audio.currentTime=Number($('seek').value)};
audio.onloadedmetadata=()=>{duration=audio.duration;if(!Number.isFinite(duration)||duration<=0){$('duration').textContent='Không đọc được thời lượng';return}$('duration').textContent=format(duration*1000);$('seek').max=duration;$('seek').value=0};
audio.ontimeupdate=()=>{$('now').textContent=format(audio.currentTime*1000);if(duration)$('seek').value=audio.currentTime};
audio.onerror=()=>{$('warning').textContent='Không mở được âm thanh. Kiểm tra tệp gốc và Git LFS trên máy.'};
$('filter').oninput=filter;
$('save').onclick=async()=>{audio.pause();$('save').disabled=true;try{const allStarts=Object.fromEntries(exams.map(e=>[e.id,value(e.id)]));const response=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({starts:allStarts,revision})});const result=await response.json();if(!response.ok)throw Error(result.error);Object.assign(starts,allStarts);changes={};revision=result.revision;update();$('message').textContent=`Đã lưu đủ ${result.saved} đề (bao gồm đề giữ mốc 6,5 giây). ${result.sync} Khởi động lại app để nhận mốc mới.`}catch(error){$('message').textContent=error.message;$('save').disabled=false}};
window.onbeforeunload=()=>Object.keys(changes).length?'Các mốc chưa được lưu.':undefined;
fetch('/api/exams').then(r=>r.json()).then(data=>{exams=data.exams;starts=data.starts;revision=data.revision;update()}).catch(error=>$('message').textContent=error.message);
</script></html>

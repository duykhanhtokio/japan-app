<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" role="img" aria-labelledby="title desc">
<title id="title">作物の器官と芽の位置</title><desc id="desc">葉、茎、根、花、果実、頂芽、側芽の位置を七本の引出線で示す独自の模式図。側芽は葉柄と茎の間にあります。</desc>
<defs><style>text{font-family:'Noto Serif CJK JP',serif;fill:#18352e} .leader{fill:none;stroke:#344d46;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.outline{stroke:#2d5735;stroke-width:4;stroke-linejoin:round}.label{font-size:50px;font-weight:normal}.dot{fill:#18352e;stroke:#fffdf5;stroke-width:2}</style></defs>
<rect width="1000" height="1250" fill="#fffdf5"/>
<text x="500" y="78" text-anchor="middle" font-size="38">作物の器官と芽の位置</text>
<!-- A new single-axis plant, with distinct branches for the flower and fruit. -->
<path d="M280 900 H800 V1195 H280Z" fill="#eee1c9"/>
<path d="M280 900 H800" fill="none" stroke="#9d8567" stroke-width="4"/>
<!-- Roots branch only below the ground line. -->
<g fill="none" stroke="#926b43" stroke-linecap="round">
<path d="M500 893 C500 950 501 1045 482 1159" stroke-width="15"/>
<path d="M500 947 C464 981 437 1006 390 1030 M495 1000 C534 1032 568 1062 611 1082 M491 1054 C454 1073 429 1092 410 1127" stroke-width="10"/>
<path d="M448 988 L414 983 M430 1001 L408 1038 M388 1030 L356 1034 M540 1038 L565 1027 M571 1063 L578 1100 M448 1081 L428 1068 M482 1127 L518 1169" stroke-width="5"/>
</g>
<!-- Main stem and leaf petioles. -->
<path d="M491 900 C494 760 492 623 491 500 C491 400 494 324 500 262 L512 262 C505 350 506 430 505 501 C508 654 510 775 509 900Z" fill="#83a95b" class="outline"/>
<path d="M497 541 Q455 510 420 491 M503 775 Q556 751 590 755" fill="none" stroke="#527f42" stroke-width="12" stroke-linecap="round"/>
<!-- Leaf blades attach to their own petioles; no unattached leaves. -->
<path d="M422 492 C363 514 286 473 267 383 C335 368 415 401 422 492Z" fill="#77a85b" class="outline"/>
<path d="M420 490 Q350 439 274 387 M361 446 L350 402 M361 446 L311 455" fill="none" stroke="#426e39" stroke-width="3"/>
<path d="M590 755 C636 707 706 730 751 779 C699 817 633 809 590 755Z" fill="#8ab96a" class="outline"/>
<path d="M594 756 Q666 775 743 778 M663 771 L679 740 M663 771 L681 799" fill="none" stroke="#426e39" stroke-width="3"/>
<!-- Terminal bud is above the uninterrupted main stem. -->
<path d="M504 268 C480 255 479 230 491 206 C498 218 505 236 504 268Z" fill="#a7c981" class="outline"/>
<path d="M504 268 C525 253 527 233 518 211 C507 225 503 244 504 268Z" fill="#7da652" class="outline"/>
<!-- Axillary bud sits in the upper axil of the left leaf's petiole at the main stem. -->
<path d="M493 537 C465 516 466 495 477 478 C489 495 493 515 493 537Z" fill="#b3ce81" class="outline"/>
<path d="M490 531 Q480 508 477 485" fill="none" stroke="#527f42" stroke-width="2"/>
<circle cx="480" cy="507" r="36" fill="none" stroke="#c49b47" stroke-width="2" stroke-dasharray="5 5"/>
<!-- Flower branch, receptacle and five visibly separate petals. -->
<path d="M505 448 Q576 401 646 357" fill="none" stroke="#527f42" stroke-width="10" stroke-linecap="round"/>
<g fill="#f7d870" stroke="#987b31" stroke-width="3">
<path d="M676 351 C651 317 665 294 682 302 C701 308 696 334 688 351Z"/>
<path d="M686 351 C710 316 739 324 735 344 C731 361 706 366 687 365Z"/>
<path d="M690 363 C730 369 734 395 716 403 C698 410 684 385 681 369Z"/>
<path d="M677 368 C674 404 647 414 637 394 C630 379 652 362 671 357Z"/>
<path d="M672 355 C641 366 622 347 634 332 C644 319 665 336 677 349Z"/>
</g><circle cx="681" cy="357" r="14" fill="#c99734" stroke="#8b6d25" stroke-width="3"/>
<!-- Fruit on a separate branch; fruit remains distinct from the flower. -->
<path d="M507 645 Q573 635 654 668 Q682 681 688 700" fill="none" stroke="#527f42" stroke-width="10" stroke-linecap="round"/>
<path d="M689 695 C645 673 618 711 630 753 C642 797 698 808 727 774 C758 735 729 688 689 695Z" fill="#d8814e" stroke="#8d4c31" stroke-width="4"/>
<path d="M689 700 L671 682 L686 686 L698 674 L704 691 L724 692 L710 705" fill="#73974e" stroke="#426e39" stroke-width="3"/>
<path d="M648 721 Q639 741 650 758" fill="none" stroke="#f4b47c" stroke-width="6" stroke-linecap="round"/>
<!-- Seven deterministic labels and non-crossing leaders. -->
<g class="leader">
<path d="M241 178 H442 L500 236"/>
<path d="M774 323 H741 L710 342"/>
<path d="M190 448 H264 L335 435"/>
<path d="M241 300 H400 L460 480 L481 509"/>
<path d="M190 698 H388 L500 724"/>
<path d="M776 742 H735 L699 748"/>
<path d="M190 1071 H361 L445 1082"/>
</g>
<g class="dot"><circle cx="500" cy="236" r="5"/><circle cx="710" cy="342" r="5"/><circle cx="335" cy="435" r="5"/><circle cx="481" cy="509" r="5"/><circle cx="500" cy="724" r="5"/><circle cx="699" cy="748" r="5"/><circle cx="445" cy="1082" r="5"/></g>
<g class="label"><text x="110" y="192">頂芽</text><text x="803" y="338">花</text><text x="110" y="462">葉</text><text x="110" y="314">側芽</text><text x="110" y="712">茎</text><text x="795" y="757">果実</text><text x="110" y="1085">根</text></g>
</svg>
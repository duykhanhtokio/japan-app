<svg font-family="Noto Sans CJK JP" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="580" height="330" accessibilityLabel="植物の対象と分類の階級を分ける。左は科・属・種の包含関係です。植物の器官や外観の図だけで分類を判定せず、本文のホウレンソウ・タマネギの元ラベルと確認した分類を分けます。科・属・種の三階級を、属名と種小名の二名法そのものとはしません。" style="background-color:#fffaf0;border-radius:10px"><rect width="580" height="330" fill="#fffaf0"/><ellipse cx="150" cy="152" rx="116" ry="98" fill="#dce4c4" stroke="#3b8d55" stroke-width="3"></ellipse><ellipse cx="150" cy="171" rx="74" ry="59" fill="#b2cea4" stroke="#3b8d55"></ellipse><ellipse cx="150" cy="185" rx="36" ry="29" fill="#729f6d"></ellipse><text x="150" y="94" font-size="17" fill="#183e32" text-anchor="middle">科</text><text x="150" y="144" font-size="17" fill="#183e32" text-anchor="middle">属</text><text x="150" y="192" font-size="17" fill="#183e32" text-anchor="middle">種</text><line x1="305" y1="193" x2="305" y2="95" stroke="#3b8d55" stroke-width="5"></line><ellipse cx="305" cy="125" rx="24" ry="51" fill="#3b8d55"></ellipse><path d="M410 113 Q370 175 390 215 Q427 237 460 214 Q478 172 438 112Z" fill="#dfc595" stroke="#183e32"></path><path d="M418 113 L410 45 M433 113 L453 42 M427 113 L430 33" stroke="#3b8d55" stroke-width="7"></path><text x="387" y="265" font-size="16" fill="#183e32" text-anchor="middle">ホウレンソウ・タマネギ</text><text x="290" y="311" font-size="16" fill="#183e32" text-anchor="middle">階級の並びと、属名＋種小名の二名法を区別する</text></svg>

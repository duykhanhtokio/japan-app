<svg font-family="Noto Sans CJK JP" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="580" height="330" accessibilityLabel="施肥を生育段階と役割で分ける。元肥と追肥を植物の段階と関連付けて読む模式図です。肥料を根へ直接触れさせる方法、施用量、具体的距離や全作物共通の時期を指示する図ではありません。果樹の元肥・季節ごとの追肥は本文の目的と対応させます。" style="background-color:#fffaf0;border-radius:10px"><rect width="580" height="330" fill="#fffaf0"/><rect x="25" y="198" width="530" height="90" fill="#d5bd98"></rect><g><line x1="412" y1="198" x2="412" y2="103" stroke="#3b8d55" stroke-width="7"></line><ellipse cx="389" cy="133" rx="30" ry="12" rotation="25" origin="389, 133" fill="#3b8d55"></ellipse><ellipse cx="434" cy="108" rx="29" ry="12" rotation="-25" origin="434, 108" fill="#3b8d55"></ellipse><path d="M412,198 l-25,45 M412,206 l28,35 M412,198 v55" fill="none" stroke="#855a38" stroke-width="4"></path></g><ellipse cx="142" cy="190" rx="12" ry="19" fill="#b69a58"></ellipse><path d="M142 209 v34" stroke="#89633e" stroke-width="3"></path><circle cx="70" cy="245" r="5" fill="#d9ac4b"></circle><circle cx="95" cy="245" r="5" fill="#d9ac4b"></circle><circle cx="185" cy="245" r="5" fill="#d9ac4b"></circle><circle cx="210" cy="245" r="5" fill="#d9ac4b"></circle><circle cx="345" cy="230" r="5" fill="#d9ac4b"></circle><circle cx="360" cy="230" r="5" fill="#d9ac4b"></circle><circle cx="480" cy="230" r="5" fill="#d9ac4b"></circle><circle cx="500" cy="230" r="5" fill="#d9ac4b"></circle><text x="142" y="103" font-size="17" fill="#183e32" text-anchor="middle">植付け前：元肥</text><text x="412" y="68" font-size="17" fill="#183e32" text-anchor="middle">生育に合わせて：追肥</text><g><line x1="230" y1="140" x2="315" y2="140" stroke="#183e32" stroke-width="4"></line><circle cx="315" cy="140" r="5" fill="#183e32"></circle></g><text x="290" y="313" font-size="15" fill="#183e32" text-anchor="middle">図は時点の区別。量・距離・時期は作物別に確認します。</text></svg>

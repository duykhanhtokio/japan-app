<svg font-family="Noto Sans CJK JP" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="580" height="330" accessibilityLabel="2019年の重量ベース品目別自給率。本文の米97％、小麦16％、大豆6％、野菜79％、果実38％を同じ指標で図示します。農業産出額の割合や、資料のカロリーベースの説明とは混同しません。現在値の表示ではありません。" style="background-color:#fffaf0;border-radius:10px"><rect width="580" height="330" fill="#fffaf0"/><text x="290" y="39" font-size="19" fill="#183e32" text-anchor="middle">2019年・品目別の重量ベース自給率</text><g><text x="65" y="91" font-size="17" fill="#183e32" text-anchor="middle">米</text><rect x="110" y="69" width="380" height="25" fill="#dce0d6"></rect><rect x="110" y="69" width="368.59999999999997" height="25" fill="#3b8d55"></rect><text x="531" y="90" font-size="17" fill="#183e32" text-anchor="middle">97％</text></g><g><text x="65" y="134" font-size="17" fill="#183e32" text-anchor="middle">小麦</text><rect x="110" y="112" width="380" height="25" fill="#dce0d6"></rect><rect x="110" y="112" width="60.8" height="25" fill="#3b8d55"></rect><text x="531" y="133" font-size="17" fill="#183e32" text-anchor="middle">16％</text></g><g><text x="65" y="177" font-size="17" fill="#183e32" text-anchor="middle">大豆</text><rect x="110" y="155" width="380" height="25" fill="#dce0d6"></rect><rect x="110" y="155" width="22.799999999999997" height="25" fill="#3b8d55"></rect><text x="531" y="176" font-size="17" fill="#183e32" text-anchor="middle">6％</text></g><g><text x="65" y="220" font-size="17" fill="#183e32" text-anchor="middle">野菜</text><rect x="110" y="198" width="380" height="25" fill="#dce0d6"></rect><rect x="110" y="198" width="300.2" height="25" fill="#3b8d55"></rect><text x="531" y="219" font-size="17" fill="#183e32" text-anchor="middle">79％</text></g><g><text x="65" y="263" font-size="17" fill="#183e32" text-anchor="middle">果実</text><rect x="110" y="241" width="380" height="25" fill="#dce0d6"></rect><rect x="110" y="241" width="144.4" height="25" fill="#3b8d55"></rect><text x="531" y="262" font-size="17" fill="#183e32" text-anchor="middle">38％</tex
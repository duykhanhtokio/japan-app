<svg font-family="Noto Sans CJK JP" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="580" height="330" accessibilityLabel="肥料全体の質量と成分割合。教材で仮定した25kg・12−6−6の窒素は3kgです。色の部分は窒素12％を表します。実在商品の施肥指示ではありません。" style="background-color:#fffaf0;border-radius:10px"><rect width="580" height="330" fill="#fffaf0"/><path d="M80 50 L240 50 L255 235 Q160 260 65 235 Z" fill="#e3cd95" stroke="#183e32" stroke-width="3"></path><text x="160" y="103" font-size="21" fill="#183e32" text-anchor="middle">肥料 25kg</text><text x="160" y="148" font-size="23" fill="#183e32" text-anchor="middle">12−6−6</text><text x="160" y="194" font-size="16" fill="#183e32" text-anchor="middle">計算用の仮定例</text><g><line x1="275" y1="150" x2="350" y2="150" stroke="#3884ba" stroke-width="4"></line><circle cx="350" cy="150" r="5" fill="#3884ba"></circle></g><rect x="373" y="62" width="110" height="180" fill="#e3cd95" stroke="#183e32"></rect><rect x="373" y="220.4" width="110" height="21.6" fill="#3b8d55"></rect><text x="428" y="103" font-size="17" fill="#183e32" text-anchor="middle">全体25kg</text><text x="428" y="161" font-size="17" fill="#183e32" text-anchor="middle">窒素12％ →3kg</text><text x="290" y="287" font-size="18" fill="#183e32" text-anchor="middle">25×12÷100＝3kg（窒素）</text></svg>

<svg font-family="Noto Sans CJK JP" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="580" height="330" accessibilityLabel="年度と一人当たり年間量を組にする。本文が示す1962年度の約118kgと2021年度の約50.8kgを比較します。棒の高さはkgに比例させています。国全体の消費量や将来の予測ではありません。" style="background-color:#fffaf0;border-radius:10px"><rect width="580" height="330" fill="#fffaf0"/><text x="290" y="40" font-size="18" fill="#183e32" text-anchor="middle">一人当たり年間の米消費量（資料の概数）</text><line x1="105" y1="265" x2="525" y2="265" stroke="#183e32" stroke-width="2"></line><line x1="105" y1="60" x2="105" y2="265" stroke="#183e32" stroke-width="2"></line><g><text x="63" y="271" font-size="14" fill="#183e32" text-anchor="middle">0kg</text><line x1="105" y1="265" x2="525" y2="265" stroke="#d1d8c9"></line></g><g><text x="63" y="207" font-size="14" fill="#183e32" text-anchor="middle">40kg</text><line x1="105" y1="201" x2="525" y2="201" stroke="#d1d8c9"></line></g><g><text x="63" y="143" font-size="14" fill="#183e32" text-anchor="middle">80kg</text><line x1="105" y1="137" x2="525" y2="137" stroke="#d1d8c9"></line></g><g><text x="63" y="79" font-size="14" fill="#183e32" text-anchor="middle">120kg</text><line x1="105" y1="73" x2="525" y2="73" stroke="#d1d8c9"></line></g><rect x="170" y="76.19999999999999" width="95" height="188.8" fill="#3b8d55"></rect><rect x="360" y="183.72" width="95" height="81.28" fill="#d9ac4b"></rect><text x="217" y="65" font-size="17" fill="#183e32" text-anchor="middle">約118kg</text><text x="407" y="170" font-size="17" fill="#183e32" text-anchor="middle">約50.8kg</text><text x="217" y="298" font-size="17" fill="#183e32" text-anchor="middle">1962年度</text><text x="407" y="298" font-size="17" fill="#183e32" text-anchor="middle">2021年度</text></svg>

<svg font-family="Noto Sans CJK JP" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="580" height="330" accessibilityLabel="鱗茎の中で葉・短い茎・根を分ける。鱗茎を一つの大きな根と見なさず、肥厚した葉、短い茎、根の位置を区別します。球根類には別の器官に由来する型もあり、この断面を全てに当てはめません。" style="background-color:#fffaf0;border-radius:10px"><rect width="580" height="330" fill="#fffaf0"/><rect x="50" y="205" width="480" height="72" fill="#d8c29b"></rect><path d="M290 60 Q175 150 205 208 Q290 250 375 208 Q405 150 290 60Z" fill="#e9d2a0" stroke="#183e32" stroke-width="3"></path><path d="M290 80 Q230 162 245 210 M290 90 Q350 165 335 210 M290 105 V217" stroke="#b78954" fill="none" stroke-width="3"></path><path d="M242 230 Q240 262 215 280 M270 234 v52 M305 234 l15 50 M335 228 l35 55" stroke="#865b39" fill="none" stroke-width="3"></path><line x1="284" y1="65" x2="284" y2="22" stroke="#3b8d55" stroke-width="8"></line><text x="105" y="139" font-size="17" fill="#183e32" text-anchor="middle">肥厚した葉</text><g><line x1="160" y1="144" x2="235" y2="170" stroke="#183e32" stroke-width="4"></line><circle cx="235" cy="170" r="5" fill="#183e32"></circle></g><text x="470" y="212" font-size="17" fill="#183e32" text-anchor="middle">短い茎</text><g><line x1="420" y1="217" x2="321" y2="227" stroke="#183e32" stroke-width="4"></line><circle cx="321" cy="227" r="5" fill="#183e32"></circle></g><text x="465" y="277" font-size="17" fill="#183e32" text-anchor="middle">根</text><text x="290" y="309" font-size="15" fill="#183e32" text-anchor="middle">鱗茎の模式断面（全ての球根類がこの構造ではない）</text></svg>

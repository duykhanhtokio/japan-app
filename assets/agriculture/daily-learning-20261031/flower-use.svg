<svg font-family="Noto Sans CJK JP" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="580" height="330" accessibilityLabel="鉢・切り花・花壇の利用形態を分ける。同じ花きでも、鉢での利用、茎を切る利用、地面に植える利用を分けて見ます。図は特定品種を識別する写真ではなく、地域共通の植付け時期を示すものでもありません。" style="background-color:#fffaf0;border-radius:10px"><rect width="580" height="330" fill="#fffaf0"/><path d="M45 157 H140 L125 255 H60Z" fill="#c89264" stroke="#183e32"></path><line x1="93" y1="157" x2="93" y2="80" stroke="#3b8d55" stroke-width="5"></line><circle cx="93" cy="70" r="25" fill="#c88b9f"></circle><text x="93" y="293" font-size="18" fill="#183e32" text-anchor="middle">鉢もの</text><path d="M245 154 H308 L299 255 H254Z" fill="#b5d8df" stroke="#183e32"></path><line x1="276" y1="232" x2="276" y2="66" stroke="#3b8d55" stroke-width="5"></line><circle cx="276" cy="68" r="25" fill="#d9ac4b"></circle><text x="276" y="293" font-size="18" fill="#183e32" text-anchor="middle">切り花</text><rect x="370" y="232" width="175" height="24" fill="#a1845e"></rect><g><line x1="398" y1="232" x2="398" y2="150" stroke="#3b8d55" stroke-width="5"></line><circle cx="398" cy="150" r="19" fill="#b67eaa"></circle></g><g><line x1="453" y1="232" x2="453" y2="180" stroke="#3b8d55" stroke-width="5"></line><circle cx="453" cy="180" r="19" fill="#d9ac4b"></circle></g><g><line x1="510" y1="232" x2="510" y2="150" stroke="#3b8d55" stroke-width="5"></line><circle cx="510" cy="150" r="19" fill="#b67eaa"></circle></g><text x="457" y="293" font-size="16" fill="#183e32" text-anchor="middle">花壇・地表の利用</text><text x="290" y="35" font-size="20" fill="#183e32" text-anchor="middle">植物名だけでなく利用形態を見る</text></svg>

<svg font-family="Noto Sans CJK JP" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="580" height="330" accessibilityLabel="冷却した場所だけでなく経路をつなぐ。出荷時の冷却、輸送、引渡し後の管理を経路として見ます。各段階の具体的温度や品質保持剤の処方は品目・製品別で、この図では指定しません。" style="background-color:#fffaf0;border-radius:10px"><rect width="580" height="330" fill="#fffaf0"/><rect x="33" y="100" width="125" height="95" fill="#afd4df" stroke="#183e32"></rect><line x1="33" y1="142" x2="158" y2="142" stroke="#183e32"></line><text x="95" y="233" font-size="17" fill="#183e32" text-anchor="middle">出荷・予冷</text><rect x="225" y="130" width="120" height="70" fill="#afd4df" stroke="#183e32"></rect><path d="M345 150 h50 l27 30 v20 h-77 Z" fill="#dbb55e" stroke="#183e32"></path><circle cx="255" cy="205" r="15" fill="#183e32"></circle><circle cx="388" cy="205" r="15" fill="#183e32"></circle><text x="322" y="249" font-size="17" fill="#183e32" text-anchor="middle">低温輸送</text><rect x="462" y="94" width="80" height="108" fill="#afd4df" stroke="#183e32"></rect><text x="500" y="235" font-size="17" fill="#183e32" text-anchor="middle">小売</text><path d="M50 65 H540" stroke="#3884ba" stroke-width="9"></path><text x="290" y="42" font-size="19" fill="#183e32" text-anchor="middle">経路全体の温度管理（品目別条件）</text><circle cx="95" cy="75" r="13" fill="white" stroke="#3884ba"></circle><text x="96" y="81" font-size="18" fill="#183e32" text-anchor="middle">↓</text></svg>

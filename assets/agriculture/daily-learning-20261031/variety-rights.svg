<svg font-family="Noto Sans CJK JP" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="580" height="330" accessibilityLabel="種子の分類と権利・検疫の確認を分ける。固定種かF1かという生物学的分類だけで、増殖や海外持出しが許可されたとは判断しません。本文にある品種、利用目的、相手国、許諾と検疫条件を別々に確認します。図は法的許可書ではありません。" style="background-color:#fffaf0;border-radius:10px"><rect width="580" height="330" fill="#fffaf0"/><path d="M55 85 H210 L224 250 H40Z" fill="#dfc796" stroke="#183e32" stroke-width="3"></path><ellipse cx="128" cy="170" rx="23" ry="35" fill="#d9ac4b" stroke="#183e32"></ellipse><text x="130" y="122" font-size="19" fill="#183e32" text-anchor="middle">種子・品種</text><rect x="303" y="43" width="218" height="242" rx="5" fill="#fffdf4" stroke="#183e32" stroke-width="3"></rect><g><rect x="319" y="77" width="18" height="18" fill="none" stroke="#183e32"></rect><text x="428" y="92" font-size="16" fill="#183e32" text-anchor="middle">品種の登録・権利</text></g><g><rect x="319" y="125" width="18" height="18" fill="none" stroke="#183e32"></rect><text x="428" y="140" font-size="16" fill="#183e32" text-anchor="middle">利用目的・許諾</text></g><g><rect x="319" y="173" width="18" height="18" fill="none" stroke="#183e32"></rect><text x="428" y="188" font-size="16" fill="#183e32" text-anchor="middle">相手国・輸出制限</text></g><g><rect x="319" y="221" width="18" height="18" fill="none" stroke="#183e32"></rect><text x="428" y="236" font-size="16" fill="#183e32" text-anchor="middle">植物検疫条件</text></g><path d="M225 160 H286" stroke="#3884ba" stroke-width="4"></path><text x="286" y="313" font-size="17" fill="#183e32" text-anchor="middle">固定種・F1の分類だけで許可を判断しない</text></svg>

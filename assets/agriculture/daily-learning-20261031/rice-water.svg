circle cx="552" cy="160" r="5" fill="#3884ba"></circle></g><text x="65" y="103" font-size="17" fill="#183e32" text-anchor="middle">水口</text><text x="530" y="103" font-size="17" fill="#183e32" text-anchor="middle">水尻</text><text x="290" y="36" font-size="19" fill="#183e32" text-anchor="middle">水位・排水・生育を別々に観察</text><text x="290" y="299" font-size="16" fill="#183e32" text-anchor="middle">図は構造模式図。深さや排水時期を指定しません。</text></svg>

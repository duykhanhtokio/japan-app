<svg font-family="Noto Sans CJK JP" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="580" height="330" accessibilityLabel="天候と作物の被害を分けて記録。晴れ・低温・風雨という天候だけで被害名を決めず、作物に確認した被害を合わせて記録します。冷害では夏の低温という条件を省きません。描いた植物は被害の診断写真ではありません。" style="background-color:#fffaf0;border-radius:10px"><rect width="580" height="330" fill="#fffaf0"/><g><rect x="40" y="210" width="140" height="65" fill="#d8c29b"></rect><g><line x1="110" y1="210" x2="110" y2="115" stroke="#3b8d55" stroke-width="7"></line><ellipse cx="87" cy="145" rx="30" ry="12" rotation="25" origin="87, 145" fill="#3b8d55"></ellipse><ellipse cx="132" cy="120" rx="29" ry="12" rotation="-25" origin="132, 120" fill="#3b8d55"></ellipse><path d="M110,210 l-25,45 M110,218 l28,35 M110,210 v55" fill="none" stroke="#855a38" stroke-width="4"></path></g><circle cx="72" cy="60" r="23" fill="#d9ac4b"></circle><path d="M55 239 l28 11 l-10 17 M130 230 l-20 25 l18 17" stroke="#8d6849" stroke-width="3" fill="none"></path><text x="110" y="306" font-size="17" fill="#183e32" text-anchor="middle">干害</text></g><g><rect x="220" y="210" width="140" height="65" fill="#d8c29b"></rect><g><line x1="290" y1="210" x2="290" y2="115" stroke="#3b8d55" stroke-width="7"></line><ellipse cx="267" cy="145" rx="30" ry="12" rotation="25" origin="267, 145" fill="#3b8d55"></ellipse><ellipse cx="312" cy="120" rx="29" ry="12" rotation="-25" origin="312, 120" fill="#3b8d55"></ellipse><path d="M290,210 l-25,45 M290,218 l28,35 M290,210 v55" fill="none" stroke="#855a38" stroke-width="4"></path></g><rect x="228" y="35" width="16" height="83" rx="8" fill="white" stroke="#3884ba"></rect><circle cx="236" cy="119" r="13" fill="#3884ba"></circle><line x1="236" y1="113" x2="236" y2="87" stroke="#3884ba" stroke-width="6"></line><text x="290" y="306" font-size="17" fill="#183e32" text-anchor="middle">冷害（夏の低温）</text></g><g><rect x="400" y="210" width="140" height="65" fill="#b2d5e4"></rect><g><line x1="470" y1="210" x2="470" y2="115" stroke="#3b8d55" stroke-width="7"></line><ellipse cx="447" cy="145" rx="30" ry="12" rotation="25" origin="447, 145" fill="#3b8d55"></ellipse><ellipse cx="492" cy="120" rx="29" ry="12" rotation="-25" origin="492, 120" fill="#3b8d55"></ellipse><path d="M470,210 l-25,45 M470,218 l28,35 M470,210 v55" fill="none" stroke="#855a38" stroke-width="4"></path></g><path d="M410 60 h105 m-78 20 h88 m-98 20 h90" stroke="#3884ba" stroke-width="4"></path><line x1="420" y1="125" x2="405" y2="160" stroke="#3884ba" stroke-width="3"></line><line x1="448" y1="125" x2="433" y2="160" stroke="#3884ba" stroke-width="3"></line><line x1="476" y1="125" x2="461" y2="160" stroke="#3884ba" stroke-width="3"></line><line x1="504" y1="125" x2="489" y2="160" stroke="#3884ba" stroke-width="3"></line><text x="470" y="306" font-size="17" fill="#183e32" text-anchor="middle">風水害</text></g><text x="290" y="25" font-size="19" fill="#183e32" text-anchor="middle">天候と、確認した作物被害を組にする</text></svg>

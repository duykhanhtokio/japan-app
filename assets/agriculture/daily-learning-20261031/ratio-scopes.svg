<svg font-family="Noto Sans CJK JP" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="580" height="330" accessibilityLabel="全体・対象・内訳を分けて記録。入れ子の円は、割合の分母と対象の関係だけを示す模式図です。円の面積から本文の割合や品種面積を読まず、出典の年がない記述や指標の違いを別々に記録します。" style="background-color:#fffaf0;border-radius:10px"><rect width="580" height="330" fill="#fffaf0"/><circle cx="195" cy="157" r="115" fill="#d9d7ae" stroke="#183e32" stroke-width="3"></circle><circle cx="225" cy="180" r="67" fill="#bd86b0" stroke="#183e32" stroke-width="2"></circle><circle cx="240" cy="194" r="32" fill="#7da082" stroke="#183e32"></circle><text x="180" y="91" font-size="17" fill="#183e32" text-anchor="middle">分母となる全体</text><text x="220" y="156" font-size="15" fill="#183e32" text-anchor="middle">対象のまとまり</text><text x="242" y="201" font-size="15" fill="#183e32" text-anchor="middle">内訳</text><path d="M350 80 h150 v125 H350Z M350 110 h150" fill="#f0e2bc" stroke="#183e32" stroke-width="2"></path><text x="425" y="101" font-size="16" fill="#183e32" text-anchor="middle">対象年・指標</text><text x="425" y="156" font-size="18" fill="#183e32" text-anchor="middle">別に記録</text><text x="290" y="300" font-size="15" fill="#183e32" text-anchor="middle">円の大きさは割合ではなく、全体と内訳の関係の模式図</text></svg>

<svg font-family="Noto Sans CJK JP" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="580" height="330" accessibilityLabel="明暗の長さと電照を区別。長さを指定しない明暗帯で、夜間の光を考えます。下段は秋ギクで開花を遅らせる目的の例であり、全作物の促進・抑制を一律に決める図ではありません。" style="background-color:#fffaf0;border-radius:10px"><rect width="580" height="330" fill="#fffaf0"/><text x="290" y="45" font-size="18" fill="#183e32" text-anchor="middle">昼と夜・夜間の電照（時間は指定しない）</text><rect x="65" y="90" width="200" height="50" fill="#edcf73"></rect><rect x="265" y="90" width="250" height="50" fill="#344e70"></rect><rect x="65" y="184" width="200" height="50" fill="#edcf73"></rect><rect x="265" y="184" width="250" height="50" fill="#344e70"></rect><rect x="370" y="184" width="35" height="50" fill="#edcf73"></rect><text x="155" y="81" font-size="17" fill="#183e32" text-anchor="middle">昼</text><text x="390" y="81" font-size="17" fill="#183e32" text-anchor="middle">夜</text><text x="290" y="168" font-size="17" fill="#183e32" text-anchor="middle">秋ギクの電照：開花を遅らせる目的</text><line x1="387" y1="231" x2="387" y2="258" stroke="#d9ac4b" stroke-width="4"></line><circle cx="387" cy="270" r="12" fill="#d9ac4b"></circle><text x="290" y="306" font-size="16" fill="#183e32" text-anchor="middle">植物・品種別の条件は本文で区別します</text></svg>

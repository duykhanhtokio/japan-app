<svg font-family="Noto Sans CJK JP" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="580" height="330" accessibilityLabel="冬の日本海側・太平洋側の違い。海・山地・風の位置を模式断面で見る地域差の図です。日本海側の雪と太平洋側の乾燥晴天という傾向を区別し、個別圃場の予報には使いません。" style="background-color:#fffaf0;border-radius:10px"><rect width="580" height="330" fill="#fffaf0"/><rect x="20" y="199" width="190" height="80" fill="#9cc5df"></rect><polygon points="160,240 310,72 430,240" fill="#9aab94" stroke="#183e32"></polygon><polygon points="283,104 310,72 337,111" fill="#f9f8ec"></polygon><path d="M65 91 q20 -34 45 -12 q25 -30 55 1 q35 0 28 30 H65Z" fill="#c7d4db"></path><text x="80" y="159" fill="#3884ba" font-size="29">＊</text><text x="115" y="159" fill="#3884ba" font-size="29">＊</text><text x="150" y="159" fill="#3884ba" font-size="29">＊</text><circle cx="478" cy="95" r="34" fill="#d9ac4b"></circle><g><line x1="58" y1="183" x2="200" y2="183" stroke="#3884ba" stroke-width="4"></line><circle cx="200" cy="183" r="5" fill="#3884ba"></circle></g><text x="108" y="306" font-size="17" fill="#183e32" text-anchor="middle">日本海側：雪</text><text x="455" y="306" font-size="17" fill="#183e32" text-anchor="middle">太平洋側：晴天・乾燥</text><text x="290" y="40" font-size="20" fill="#183e32" text-anchor="middle">冬の地域差の模式断面</text></svg>

<svg font-family="Noto Sans CJK JP" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="580" height="330" accessibilityLabel="作物と周囲の物質の移動。葉と根の位置を基準に、光、二酸化炭素、水、酸素と水蒸気を区別します。呼吸では酸素を取り込み二酸化炭素を出すため、図の光合成の向きを全ての時間帯の純収支とみなさず、本文と対比してください。" style="background-color:#fffaf0;border-radius:10px"><rect width="580" height="330" fill="#fffaf0"/><rect x="20" y="188" width="540" height="90" fill="#d8c29b"></rect><g><line x1="288" y1="190" x2="288" y2="95" stroke="#3b8d55" stroke-width="7"></line><ellipse cx="265" cy="125" rx="30" ry="12" rotation="25" origin="265, 125" fill="#3b8d55"></ellipse><ellipse cx="310" cy="100" rx="29" ry="12" rotation="-25" origin="310, 100" fill="#3b8d55"></ellipse><path d="M288,190 l-25,45 M288,198 l28,35 M288,190 v55" fill="none" stroke="#855a38" stroke-width="4"></path></g><circle cx="80" cy="55" r="28" fill="#d9ac4b"></circle><g><line x1="105" y1="70" x2="234" y2="110" stroke="#d9ac4b" stroke-width="4"></line><circle cx="234" cy="110" r="5" fill="#d9ac4b"></circle></g><text x="82" y="110" font-size="17" fill="#183e32" text-anchor="middle">光</text><g><line x1="505" y1="100" x2="330" y2="125" stroke="#3884ba" stroke-width="4"></line><circle cx="330" cy="125" r="5" fill="#3884ba"></circle></g><text x="470" y="78" font-size="17" fill="#183e32" text-anchor="middle">CO₂</text><g><line x1="325" y1="150" x2="505" y2="160" stroke="#3884ba" stroke-width="4"></line><circle cx="505" cy="160" r="5" fill="#3884ba"></circle></g><text x="465" y="192" font-size="17" fill="#183e32" text-anchor="middle">O₂</text><g><line x1="155" y1="251" x2="263" y2="220" stroke="#3884ba" stroke-width="4"></line><circle cx="263" cy="220" r="5" fill="#3884ba"></circle></g><text x="110" y="242" font-size="17" fill="#183e32" text-anchor="middle">水・養分</text><g><line x1="290" y1="85" x2="290" y2="26" stroke="#3884ba" stroke-width="4"></line><circle cx="290" cy="26" r="5" fill="#3884ba"></circle></g><text x="352" y="34" font-size="17" fill="#183e32" text-anchor="middle">水蒸気</text
<svg font-family="Noto Sans CJK JP" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="580" height="330" accessibilityLabel="種苗費と必要労力を別々に見る。本文の一・二年草と球根類を比較します。種苗費が安いことと労力が少ないことは一致しません。棒は高低分類の模式表現で、具体的な円や作業時間の数値ではありません。" style="background-color:#fffaf0;border-radius:10px"><rect width="580" height="330" fill="#fffaf0"/><text x="290" y="35" font-size="18" fill="#183e32" text-anchor="middle">資料の相対的分類：費用と労力は別の欄</text><g><text x="185" y="70" font-size="17" fill="#183e32" text-anchor="middle">種苗費</text><line x1="100" y1="250" x2="280" y2="250" stroke="#183e32"></line></g><g><text x="405" y="70" font-size="17" fill="#183e32" text-anchor="middle">労力</text><line x1="320" y1="250" x2="500" y2="250" stroke="#183e32"></line></g><g><rect x="117" y="205" width="58" height="45" fill="#3b8d55"></rect><rect x="200" y="105" width="58" height="145" fill="#d9ac4b"></rect><text x="146" y="275" font-size="13" fill="#183e32" text-anchor="middle">一・二年草</text><text x="229" y="275" font-size="14" fill="#183e32" text-anchor="middle">球根類</text><text x="145" y="192" font-size="16" fill="#183e32" text-anchor="middle">安い</text><text x="229" y="94" font-size="16" fill="#183e32" text-anchor="middle">高い</text></g><g><rect x="337" y="105" width="58" height="145" fill="#3b8d55"></rect><rect x="420" y="205" width="58" height="45" fill="#d9ac4b"></rect><text x="366" y="275" font-size="13" fill="#183e32" text-anchor="middle">一・二年草</text><text x="449" y="275" font-size="14" fill="#183e32" text-anchor="middle">球根類</text><text x="365" y="94" font-size="16" fill="#183e32" text-anchor="middle">多い</text><text x="449" y="192" font-size="16" fill="#183e32" text-anchor="middle">少ない</text></g><text x="290" y="314" font-size="13" fill="#183e32" text-anchor="middle">棒の長さは分類の模式表現。金額・時間の比例尺度ではありません。</text></svg>

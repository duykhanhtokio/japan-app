<svg font-family="Noto Sans CJK JP" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="580" height="330" accessibilityLabel="2017年の各樹種内の品種割合。本文の各樹種から一つずつ品種を選んだ比較です。年と栽培面積の指標を保ち、同じ17％でも別樹種では実面積が同じとは言えません。未掲載部分を一品種と扱いません。" style="background-color:#fffaf0;border-radius:10px"><rect width="580" height="330" fill="#fffaf0"/><text x="290" y="35" font-size="19" fill="#183e32" text-anchor="middle">2017年・各樹種内の栽培面積割合</text><g><text x="75" y="76" font-size="14" fill="#183e32" text-anchor="middle">温州ミカン</text><rect x="140" y="56" width="350" height="22" fill="#dce0d6"></rect><rect x="140" y="56" width="59.5" height="22" fill="#3b8d55"></rect><text x="365" y="73" font-size="14" fill="#183e32" text-anchor="middle">宮川早生 17％</text></g><g><text x="75" y="113" font-size="14" fill="#183e32" text-anchor="middle">リンゴ</text><rect x="140" y="93" width="350" height="22" fill="#dce0d6"></rect><rect x="140" y="93" width="164.5" height="22" fill="#3b8d55"></rect><text x="365" y="110" font-size="14" fill="#183e32" text-anchor="middle">ふじ 47％</text></g><g><text x="75" y="150" font-size="14" fill="#183e32" text-anchor="middle">ブドウ</text><rect x="140" y="130" width="350" height="22" fill="#dce0d6"></rect><rect x="140" y="130" width="77" height="22" fill="#3b8d55"></rect><text x="365" y="147" font-size="14" fill="#183e32" text-anchor="middle">巨峰 22％</text></g><g><text x="75" y="187" font-size="14" fill="#183e32" text-anchor="middle">カキ</text><rect x="140" y="167" width="350" height="22" fill="#dce0d6"></rect><rect x="140" y="167" width="59.5" height="22" fill="#3b8d55"></rect><text x="365" y="184" font-size="14" fill="#183e32" text-anchor="middle">富有 17％</text></g><g><text x="75" y="224" font-size="14" fill="#183e32" text-anchor="middle">ニホンナシ</text><rect x="140" y="204" width="350" height="22" fill="#dce0d6"></rect><rect x="140" y="204" width="105" height="22" fill="#3b8d55"></rect><text x="365" y="221" font-size="14" fill="#183e32" text-anchor="middle">幸水 30％</text></g><g><text x="75" y="261" font-size="14" fill="#183e32" text-anchor="middle">モモ</text><rect x="140" y="241" width="350" height="22" fill="#dce0d6"></rect><rect x="140" y="241" width="52.5" height="22" fill="#3b8d55"></rect><text x="365" y="258" font-size="14" fill="#183e32" text-anchor="middle">あかつき 15％</text></g><text x="290" y="319" font-size="14" fill="#183e32" text-anchor="middle">灰色は未掲載部分を含む。他樹種とは分母が異なります。</text></svg>

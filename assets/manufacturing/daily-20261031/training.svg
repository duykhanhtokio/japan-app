<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><rect width="960" height="560" fill="#fffaf0"/><text x="55" y="65" font-family="Noto Sans CJK JP" font-size="29" fill="#24465a">作業範囲と確認する相手を照合する</text><circle cx="210" cy="240" r="24" fill="#e8c8a2" stroke="#24465a" stroke-width="4"/><path d="M175 370 L185 285 Q210 265 235 285 L245 370" fill="#d8e3eb" stroke="#24465a" stroke-width="4"/><circle cx="460" cy="240" r="24" fill="#e8c8a2" stroke="#24465a" stroke-width="4"/><path d="M425 370 L435 285 Q460 265 485 285 L495 370" fill="#d8e3eb" stroke="#24465a" stroke-width="4"/><rect x="620" y="170" width="210" height="240" rx="5" fill="#fff" stroke="#24465a" stroke-width="4"/><text x="635" y="208" font-family="Noto Sans CJK JP" font-size="20" fill="#24465a">教育・作業範囲</text><line x1="640" y1="250" x2="805" y2="250" stroke="#9da8ac" stroke-width="2" stroke-dasharray=""/><line x1="640" y1="280" x2="805" y2="280" stroke="#9da8ac" stroke-width="2" stroke-dasharray=""/><line x1="640" y1="310" x2="805" y2="310" stroke="#9da8ac" stroke-width="2" stroke-dasharray=""/><line x1="640" y1="340" x2="805" y2="340" stroke="#9da8ac" stroke-width="2" stroke-dasharray=""/><line x1="640" y1="370" x2="805" y2="370" stroke="#9da8ac" stroke-width="2" stroke-dasharray=""/><text x="150" y="430" font-family="Noto Sans CJK JP" font-size="23" fill="#24465a">担当者</text><text x="405" y="430" font-family="Noto Sans CJK JP" font-size="23" fill="#24465a">確認者</text><text x="100" y="485" font-family="Noto Sans CJK JP" font-size="21" fill="#24465a">知っていることと、許可された作業範囲は同じではない。</text><text x="55" y="535" font-family="Noto Sans CJK JP" font-size="18" fill="#665f55">学習用の模式図・実機の操作条件や寸法を示さない</text></svg>
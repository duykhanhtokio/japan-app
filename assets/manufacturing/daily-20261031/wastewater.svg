<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><rect width="960" height="560" fill="#fffaf0"/><text x="55" y="65" font-family="Noto Sans CJK JP" font-size="29" fill="#24465a">異なる系統を識別し、無断で混ぜない</text><rect x="135" y="180" width="180" height="220" rx="5" fill="#d7e6ec" stroke="#24465a" stroke-width="4"/><rect x="390" y="180" width="180" height="220" rx="5" fill="#e6dac0" stroke="#24465a" stroke-width="4"/><rect x="645" y="180" width="180" height="220" rx="5" fill="#d8e6d6" stroke="#24465a" stroke-width="4"/><line x1="135" y1="280" x2="315" y2="280" stroke="#447ca2" stroke-width="4" stroke-dasharray=""/><line x1="390" y1="280" x2="570" y2="280" stroke="#d8a449" stroke-width="4" stroke-dasharray=""/><line x1="645" y1="280" x2="825" y2="280" stroke="#549774" stroke-width="4" stroke-dasharray=""/><text x="160" y="445" font-family="Noto Sans CJK JP" font-size="23" fill="#24465a">系統A</text><text x="410" y="445" font-family="Noto Sans CJK JP" font-size="23" fill="#24465a">系統B</text><text x="665" y="445" font-family="Noto Sans CJK JP" font-size="23" fill="#24465a">系統C</text><text x="190" y="490" font-family="Noto Sans CJK JP" font-size="23" fill="#24465a">区分・表示・管理記録を対応させる。</text><text x="55" y="535" font-family="Noto Sans CJK JP" font-size="18" fill="#665f55">学習用の模式図・実機の操作条件や寸法を示さない</text></svg>
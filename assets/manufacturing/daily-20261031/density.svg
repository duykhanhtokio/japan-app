<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><rect width="960" height="560" fill="#fffaf0"/><text x="55" y="65" font-family="Noto Sans CJK JP" font-size="29" fill="#24465a">同じ体積でも質量は材料で異なる</text><rect x="165" y="225" width="180" height="140" rx="5" fill="#bccdd5" stroke="#24465a" stroke-width="4"/><rect x="575" y="225" width="180" height="140" rx="5" fill="#d6b17c" stroke="#24465a" stroke-width="4"/><rect x="135" y="390" width="240" height="45" rx="5" fill="#fff" stroke="#24465a" stroke-width="4"/><rect x="545" y="390" width="240" height="45" rx="5" fill="#fff" stroke="#24465a" stroke-width="4"/><text x="180" y="200" font-family="Noto Sans CJK JP" font-size="22" fill="#24465a">同じ体積</text><text x="590" y="200" font-family="Noto Sans CJK JP" font-size="22" fill="#24465a">同じ体積</text><text x="150" y="475" font-family="Noto Sans CJK JP" font-size="23" fill="#24465a">質量・密度・比重の基準を分ける。</text><text x="55" y="535" font-family="Noto Sans CJK JP" font-size="18" fill="#665f55">学習用の模式図・実機の操作条件や寸法を示さない</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><rect width="960" height="560" fill="#fffaf0"/><text x="55" y="65" font-family="Noto Sans CJK JP" font-size="29" fill="#24465a">本来の電路と、外れた故障経路を区別する</text><rect x="175" y="190" width="240" height="230" rx="5" fill="#ccd9de" stroke="#24465a" stroke-width="4"/><line x1="100" y1="250" x2="290" y2="250" stroke="#b65047" stroke-width="6" stroke-dasharray=""/><path d="M290 250 L290 290 L400 340" fill="none" stroke="#b65047" stroke-width="6"/><line x1="400" y1="340" x2="660" y2="340" stroke="#549774" stroke-width="6" stroke-dasharray=""/><line x1="660" y1="340" x2="660" y2="430" stroke="#549774" stroke-width="6" stroke-dasharray=""/><line x1="625" y1="430" x2="695" y2="430" stroke="#549774" stroke-width="4" stroke-dasharray=""/><line x1="638" y1="445" x2="682" y2="445" stroke="#549774" stroke-width="4" stroke-dasharray=""/><line x1="650" y1="460" x2="670" y2="460" stroke="#549774" stroke-width="4" stroke-dasharray=""/><text x="160" y="490" font-family="Noto Sans CJK JP" font-size="23" fill="#24465a">外箱への故障と保護の経路</text><text x="505" y="200" font-family="Noto Sans CJK JP" font-size="21" fill="#24465a">保護は故障を修理しない</text><text x="55" y="535" font-family="Noto Sans CJK JP" font-size="18" fill="#665f55">学習用の模式図・実機の操作条件や寸法を示さない</text></svg>
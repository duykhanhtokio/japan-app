<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><rect width="960" height="560" fill="#fffaf0"/><text x="55" y="65" font-family="Noto Sans CJK JP" font-size="29" fill="#24465a">基材と成長する酸化皮膜の領域を読む</text><rect x="140" y="300" width="680" height="100" rx="5" fill="#aebfc8" stroke="#24465a" stroke-width="4"/><rect x="140" y="280" width="680" height="20" rx="5" fill="#9aaec2" stroke="#24465a" stroke-width="4"/><rect x="140" y="200" width="680" height="80" rx="5" fill="#d8c796" stroke="#24465a" stroke-width="4"/><rect x="170" y="200" width="25" height="65" rx="5" fill="#fff" stroke="#24465a" stroke-width="2"/><rect x="245" y="200" width="25" height="65" rx="5" fill="#fff" stroke="#24465a" stroke-width="2"/><rect x="320" y="200" width="25" height="65" rx="5" fill="#fff" stroke="#24465a" stroke-width="2"/><rect x="395" y="200" width="25" height="65" rx="5" fill="#fff" stroke="#24465a" stroke-width="2"/><rect x="470" y="200" width="25" height="65" rx="5" fill="#fff" stroke="#24465a" stroke-width="2"/><rect x="545" y="200" width="25" height="65" rx="5" fill="#fff" stroke="#24465a" stroke-width="2"/><rect x="620" y="200" width="25" height="65" rx="5" fill="#fff" stroke="#24465a" stroke-width="2"/><rect x="695" y="200" width="25" height="65" rx="5" fill="#fff" stroke="#24465a" stroke-width="2"/><rect x="770" y="200" width="25" height="65" rx="5" fill="#fff" stroke="#24465a" stroke-width="2"/><text x="160" y="170" font-family="Noto Sans CJK JP" font-size="23" fill="#24465a">多孔質の領域</text><text x="160" y="455" font-family="Noto Sans CJK JP" font-size="21" fill="#24465a">基材と皮膜を同じ金属の塊として扱わない。</text><text x="55" y="535" font-family="Noto Sans CJK JP" font-size="18" fill="#665f55">学習用の模式図・実機の操作条件や寸法を示さない</text></svg>
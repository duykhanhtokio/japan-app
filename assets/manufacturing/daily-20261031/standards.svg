t><line x1="355" y1="320" x2="550" y2="320" stroke="#447ca2" stroke-width="3" stroke-dasharray="10 8"/><text x="160" y="475" font-family="Noto Sans CJK JP" font-size="23" fill="#24465a">同じ名称でも対象・版・適用条件を省かない。</text><text x="55" y="535" font-family="Noto Sans CJK JP" font-size="18" fill="#665f55">学習用の模式図・実機の操作条件や寸法を示さない</text></svg>
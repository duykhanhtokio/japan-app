<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><rect width="960" height="560" fill="#fffaf0"/><text x="55" y="65" font-family="Noto Sans CJK JP" font-size="29" fill="#24465a">直列の条件と並列の条件を比較する</text><line x1="130" y1="235" x2="360" y2="235" stroke="#24465a" stroke-width="4" stroke-dasharray=""/><line x1="200" y1="235" x2="240" y2="200" stroke="#24465a" stroke-width="4" stroke-dasharray=""/><circle cx="200" cy="235" r="6" fill="#447ca2" stroke="#24465a" stroke-width="4"/><circle cx="250" cy="235" r="6" fill="#447ca2" stroke="#24465a" stroke-width="4"/><line x1="290" y1="235" x2="330" y2="200" stroke="#24465a" stroke-width="4" stroke-dasharray=""/><circle cx="290" cy="235" r="6" fill="#447ca2" stroke="#24465a" stroke-width="4"/><circle cx="340" cy="235" r="6" fill="#447ca2" stroke="#24465a" stroke-width="4"/><text x="120" y="400" font-family="Noto Sans CJK JP" font-size="23" fill="#24465a">両方の条件が必要</text><line x1="540" y1="235" x2="850" y2="235" stroke="#24465a" stroke-width="4" stroke-dasharray=""/><path d="M565 235 L565 330 L820 330 L820 235" fill="none" stroke="#24465a" stroke-width="4"/><line x1="630" y1="235" x2="675" y2="200" stroke="#24465a" stroke-width="4" stroke-dasharray=""/><line x1="630" y1="330" x2="675" y2="295" stroke="#24465a" stroke-width="4" stroke-dasharray=""/><text x="545" y="400" font-family="Noto Sans CJK JP" font-size="23" fill="#24465a">どちらかの経路が成立</text><text x="55" y="535" font-family="Noto Sans CJK JP" font-size="18" fill="#665f55">学習用の模式図・実機の操作条件や寸法を示さない</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><rect width="960" height="560" fill="#fffaf0"/><text x="55" y="65" font-family="Noto Sans CJK JP" font-size="29" fill="#24465a">圧力・流量・方向を別々の情報として読む</text><rect x="160" y="330" width="200" height="90" rx="5" fill="#d3e3e9" stroke="#24465a" stroke-width="4"/><circle cx="255" cy="270" r="40" fill="#c2d4df" stroke="#24465a" stroke-width="4"/><path d="M255 230 L255 180 L620 180 L620 300" fill="none" stroke="#447ca2" stroke-width="9"/><rect x="550" y="300" width="230" height="80" rx="5" fill="#b9cbd4" stroke="#24465a" stroke-width="4"/><line x1="660" y1="300" x2="660" y2="380" stroke="#24465a" stroke-width="12" stroke-dasharray=""/><line x1="660" y1="340" x2="850" y2="340" stroke="#24465a" stroke-width="12" stroke-dasharray=""/><path d="M620 380 L620 450 L230 450 L230 420" fill="none" stroke="#447ca2" stroke-width="8"/><text x="165" y="495" font-family="Noto Sans CJK JP" font-size="23" fill="#24465a">流れる向き・流量・力の条件を混ぜない。</text><text x="55" y="535" font-family="Noto Sans CJK JP" font-size="18" fill="#665f55">学習用の模式図・実機の操作条件や寸法を示さない</text></svg>
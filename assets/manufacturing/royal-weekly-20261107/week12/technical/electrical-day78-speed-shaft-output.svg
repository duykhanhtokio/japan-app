<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="38" fill="#25435a">同期速度と軸出力：違う量・違う条件を分ける</text><text x="80" y="172" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="37" fill="#25435a">回転磁界の同期速度：Ns = 120 f / p</text><text x="80" y="264" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="39" fill="#25435a">50 Hz・4極 → 120 × 50 / 4 = 1500 min⁻¹</text><rect x="100" y="335" width="540" height="135" fill="#d6e4e8" stroke="#25435a" stroke-width="4"/><text x="140" y="402" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="32" fill="#25435a">回転磁界：1500 min⁻¹</text><rect x="800" y="335" width="540" height="135" fill="#d0e1da" stroke="#25435a" stroke-width="4"/><text x="830" y="386" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="26" fill="#25435a">負荷を持つ通常の誘導機：</text><text x="830" y="437" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="27" fill="#25435a">実回転子はすべりで低くなる</text><polyline points="80,550 1360,550" fill="none" stroke="#607383" stroke-width="2"/><text x="80" y="632" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="32" fill="#25435a">別の軸出力の紙上例：実回転数600 min⁻¹・2 N·m</text><text x="80" y="736" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="36" fill="#25435a">P = 2πNT / 60 = 2π × 600 × 2 / 60</text><text x="80" y="823" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="43" fill="#25435a">= 40π W ≈ 126 W</text><text x="80" y="892" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="27" fill="#25435a">入力電力・軸出力・定格を区別。端子を自己流で組み替えない。</text><text x="55" y="949" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="38" fill="#25435a">積重ねの数え方とPPM：条件と母数を残す</text><text x="80" y="167" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="32" fill="#25435a">教材の数え方の例：n=2 は、下の貨物の上へ2個</text><rect x="150" y="430" width="300" height="90" fill="#c9a96e" stroke="#25435a" stroke-width="4"/><rect x="150" y="330" width="300" height="90" fill="#c4d8dc" stroke="#25435a" stroke-width="4"/><rect x="150" y="230" width="300" height="90" fill="#c4d8dc" stroke="#25435a" stroke-width="4"/><text x="500" y="272" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="32" fill="#25435a">上へ積める数：2</text><text x="500" y="467" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="32" fill="#25435a">下の貨物</text><text x="80" y="590" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="30" fill="#25435a">実際の適用はラベル・包装仕様・荷姿で確認する。</text><polyline points="80,630 1360,630" fill="none" stroke="#607383" stroke-width="2"/><text x="80" y="710" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="35" fill="#25435a">出荷10000中 2件 → 2 / 10000 × 1000000</text><text x="80" y="797" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="42" fill="#25435a">= 200 PPM（百万当たり）</text><text x="80" y="878" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="28" fill="#25435a">対象・期間・数え方と顧客目標をそろえる。固定の合格値ではない。</text><text x="55" y="949" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
<text x="964" y="223" font-family="Noto Sans CJK JP" font-size="28" fill="#a53239">100%</text>
<text x="65" y="874" font-family="Noto Sans CJK JP" font-size="29" fill="#19354e">比率：18/30=60% ・ 9/30=30% ・ 3/30=10%</text>
<text x="65" y="922" font-family="Noto Sans CJK JP" font-size="27" fill="#19354e">件数の順位と、安全性・重大さの判断は分けて確認する。</text>
<text x="65" y="971" font-family="Noto Sans CJK JP" font-size="21" fill="#19354e">独立した学習用の集計例。実機の作業指示ではありません。</text>

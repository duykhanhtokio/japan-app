<text x="610" y="496" font-family="Noto Sans CJK JP" font-size="28" fill="#19354e">9件</text>
<text x="560" y="794" font-family="Noto Sans CJK JP" font-size="29" fill="#19354e">傷</text>
<rect x="865" y="665" width="170" height="75" fill="#1d8095"/>
<text x="910" y="646" font-family="Noto Sans CJK JP" font-size="28" fill="#19354e">3件</text>
<text x="860" y="794" font-family="Noto Sans CJK JP" font-size="29" fill="#19354e">部品不足</text>
<path d="M350 440 L650 290" stroke="#b83d42" stroke-width="5"/>
<path d="M650 290 L950 240" stroke="#b83d42" stroke-width="5"/>
<circle cx="350" cy="440" r="9" fill="#b83d42"/>
<text x="364" y="423" font-family="Noto Sans CJK JP" font-size="28" fill="#a53239">60%</text>
<circle cx="650" cy="290" r="9" fill="#b83d42"/>
<text x="664" y="273" font-family="Noto Sans CJK JP" font-size="28" fill="#a53239">90%</text>

<text x="1150" y="544" font-family="Noto Sans CJK JP" font-size="24" fill="#19354e">40%</text>
<text x="1150" y="444" font-family="Noto Sans CJK JP" font-size="24" fill="#19354e">60%</text>
<text x="1150" y="344" font-family="Noto Sans CJK JP" font-size="24" fill="#19354e">80%</text>
<text x="1150" y="244" font-family="Noto Sans CJK JP" font-size="24" fill="#19354e">100%</text>
<path d="M155 240 L155 740" stroke="#19354e" stroke-width="3"/>
<path d="M155 740 L1130 740" stroke="#19354e" stroke-width="3"/>
<path d="M1130 240 L1130 740" stroke="#19354e" stroke-width="3"/>
<text x="85" y="215" font-family="Noto Sans CJK JP" font-size="25" fill="#19354e">件数</text>
<text x="1090" y="215" font-family="Noto Sans CJK JP" font-size="25" fill="#19354e">累積比率</text>
<rect x="265" y="290" width="170" height="450" fill="#1d8095"/>
<text x="310" y="271" font-family="Noto Sans CJK JP" font-size="28" fill="#19354e">18件</text>
<text x="260" y="794" font-family="Noto Sans CJK JP" font-size="29" fill="#19354e">表示ミス</text>

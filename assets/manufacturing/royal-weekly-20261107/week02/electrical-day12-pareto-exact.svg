<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><rect width="1400" height="1000" fill="#fffaf0"/>
<text x="65" y="83" font-family="Noto Sans CJK JP" font-size="43" fill="#19354e">パレート図：件数と累積比率</text>
<text x="65" y="137" font-family="Noto Sans CJK JP" font-size="27" fill="#19354e">同じ期間・対象・数え方の独立した学習例：合計30件</text>

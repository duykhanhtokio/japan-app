<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150"><rect width="1600" height="1150" fill="#fffaf0"/>
<text x="60" y="77" font-family="DejaVu Sans, Noto Sans CJK JP" font-size="42" fill="#19354e">硫酸の分析：測定対象と式の電荷を分ける</text>
<text x="80" y="173" font-family="DejaVu Sans, Noto Sans CJK JP" font-size="33" fill="#19354e">同じ試料でも、測りたい量が違う</text>
<rect x="80" y="240" width="570" height="170" fill="#dfedf0"/>
<rect x="930" y="240" width="570" height="170" fill="#ece2bf"/>
<text x="120" y="321" font-family="DejaVu Sans, Noto Sans CJK JP" font-size="36" fill="#19354e">酸性度：中和滴定</text>
<text x="970" y="317" font-family="DejaVu Sans, Noto Sans CJK JP" font-size="32" fill="#19354e">硫酸イオン：沈殿分離</text>
<path d="M650 320 L930 320" fill="none" stroke="#687b86" stroke-width="3"/>
<circle cx="270" cy="650" r="105" fill="#e2edf3" stroke="#19354e" stroke-width="4"/>
<text x="190" y="663" font-family="DejaVu Sans, Noto Sans CJK JP" font-size="43" fill="#19354e">Ba²⁺</text>
<text x="425" y="670" font-family="DejaVu Sans, Noto Sans CJK JP" font-size="50" fill="#19354e">＋</text>
<circle cx="650" cy="650" r="115" fill="#e2edf3" stroke="#19354e" stroke-width="4"/>
<text x="545" y="663" font-family="DejaVu Sans, Noto Sans CJK JP" font-size="43" fill="#19354e">SO₄²⁻</text>
<text x="820" y="675" font-family="DejaVu Sans, Noto Sans CJK JP" font-size="55" fill="#19354e">→</text>
<rect x="1030" y="535" width="370" height="235" fill="#e4dac2"/>
<text x="1125" y="663" font-family="DejaVu Sans, Noto Sans CJK JP" font-size="43" fill="#19354e">BaSO₄</text>
<text x="120" y="847" font-family="DejaVu Sans, Noto Sans CJK JP" font-size="32" fill="#19354e">左辺の電荷：(+2) + (−2) = 0</text>
<text x="930" y="846" font-family="DejaVu Sans, Noto Sans CJK JP" font-size="31" fill="#19354e">右辺：電気的に中性</text>
<text x="80" y="952" font-family="DejaVu Sans, Noto Sans CJK JP" font-size="27" fill="#19354e">上付きの電荷と下付きの原子数を区別する。紙上の式であり混合手順ではない。</text>
<text x="60" y="1111" font-family="DejaVu Sans, Noto Sans CJK JP" font-size="23" fill="#19354e">独立した学習用模式図。現場の正式表示・実機仕様・操作手順ではありません。</text>
</svg>
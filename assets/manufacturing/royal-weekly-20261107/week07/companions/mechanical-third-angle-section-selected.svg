<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP" font-size="38" fill="#25435a">第三角法と断面：対応する寸法と切られた材料を読む</text><text x="70" y="160" font-family="Noto Sans CJK JP" font-size="30" fill="#25435a">直方体の独自例：幅30・高さ20・奥行12</text><rect x="100" y="215" width="300" height="120" fill="#d9e6e7" stroke="#25435a" stroke-width="4"/><text x="125" y="194" font-family="Noto Sans CJK JP" font-size="29" fill="#25435a">上面：30 × 12</text><rect x="100" y="445" width="300" height="200" fill="#c4d6de" stroke="#25435a" stroke-width="4"/><text x="125" y="699" font-family="Noto Sans CJK JP" font-size="29" fill="#25435a">正面：30 × 20</text><rect x="510" y="445" width="120" height="200" fill="#afc8d4" stroke="#25435a" stroke-width="4"/><text x="465" y="698" font-family="Noto Sans CJK JP" font-size="28" fill="#25435a">右側面：12 × 20</text><polyline points="100,335 100,445" fill="none" stroke="#607383" stroke-width="2"/><polyline points="400,335 400,445" fill="none" stroke="#607383" stroke-width="2"/><polyline points="400,445 510,445" fill="none" stroke="#607383" stroke-width="2"/><polyline points="400,645 510,645" fill="none" stroke="#607383" stroke-width="2"/><text x="80" y="812" font-family="Noto Sans CJK JP" font-size="27" fill="#25435a">上から見た図は上、右から見た図は右。</text><text x="80" y="862" font-family="Noto Sans CJK JP" font-size="27" fill="#25435a">対応する幅・高さ・奥行をそろえる。</text><text x="815" y="183" font-family="Noto Sans CJK JP" font-size="28" fill="#25435a">別の中空部品の断面例</text><text x="815" y="234" font-family="Noto Sans CJK JP" font-size="24" fill="#25435a">切られた材料だけをハッチング</text><defs><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0,14 L14,0" stroke="#607383" stroke-width="2"/></pattern></defs><circle cx="1045" cy="485" r="185" fill="#dce6e7"/><circle cx="1045" cy="485" r="185" fill="url(#hatch)" stroke="#25435a" stroke-width="4"/><circle cx="1045" cy="485" r="75" fill="#fbf8ef" stroke="#25435a" stroke-width="4"/><text x="1000" y="490" font-family="Noto Sans CJK JP" font-size="30" fill="#25435a">空間</text><text x="835" y="767" font-family="Noto Sans CJK JP" font-size="27" fill="#25435a">穴の空間はハッチングしない。</text><text x="835" y="827" font-family="Noto Sans CJK JP" font-size="27" fill="#25435a">仮想の断面であり、</text><text x="835" y="871" font-family="Noto Sans CJK JP" font-size="26" fill="#25435a">実際に切る作業指示ではない。</text><text x="55" y="949" font-family="Noto Sans CJK JP" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="38" fill="#25435a">研磨の停滞と端部の皮膜はがれを区別する</text><text x="80" y="184" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="34" fill="#25435a">同じ場所の研磨が続く場合の模式例</text><polyline points="100,310 240,310 310,365 440,365 510,310 650,310 650,570 100,570 100,310" fill="none" stroke="#25435a" stroke-width="4"/><polygon points="100,310 240,310 310,365 440,365 510,310 650,310 650,570 100,570" fill="#b8cbd5" stroke="#25435a" stroke-width="4"/><text x="125" y="272" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="27" fill="#25435a">基材表面のくぼみの例</text><text x="120" y="647" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="27" fill="#25435a">局所のくぼみ・ムラ・焼けなどを記録</text><text x="790" y="181" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="31" fill="#25435a">角・端部へ圧力が集中する場合</text><rect x="820" y="310" width="500" height="260" fill="#b8cbd5" stroke="#25435a" stroke-width="4"/><rect x="820" y="285" width="420" height="25" fill="#c8a257" stroke="#25435a" stroke-width="4"/><polyline points="1240,285 1280,265 1340,350 1310,380 1270,315 1240,285" fill="none" stroke="#25435a" stroke-width="4"/><polygon points="1240,285 1280,265 1340,350 1310,380 1270,315" fill="#c8a257" stroke="#25435a" stroke-width="4"/><polyline points="1170,200 1280,280" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="1280,280 1261.3028888741633,276.62094161812564 1271.02459670604,263.2535933492951 1280,280" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="1280,280 1261.3028888741633,276.62094161812564 1271.02459670604,263.2535933492951" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><text x="820" y="647" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="27" fill="#25435a">端部の丸まり・皮膜はがれを確認</text><text x="80" y="772" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="32" fill="#25435a">保持・送り・押し付け・工具摩耗・前工程を照合する。</text><text x="80" y="842" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="32" fill="#25435a">強く押す／回転数を上げるだけで対策済みにしない。</text><text x="80" y="897" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="27" fill="#25435a">現物の条件と責任者の評価・承認を優先する。</text><text x="55" y="949" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
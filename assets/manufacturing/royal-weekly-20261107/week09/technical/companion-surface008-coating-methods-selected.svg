<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="38" fill="#25435a">塗装方式と加熱硬化：同じ工程名として扱わない</text><text x="80" y="166" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="31" fill="#25435a">静電塗装：帯電に関わる力</text><ellipse cx="149.0" cy="269.0" rx="9.0" ry="9.0" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><ellipse cx="214.0" cy="299.0" rx="9.0" ry="9.0" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><ellipse cx="174.0" cy="339.0" rx="9.0" ry="9.0" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><ellipse cx="249.0" cy="359.0" rx="9.0" ry="9.0" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><polyline points="290,310 490,310" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="490,310 472.89150505529915,318.26434514811336 472.89150505529915,301.73565485188664 490,310" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="490,310 472.89150505529915,318.26434514811336 472.89150505529915,301.73565485188664" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><rect x="540" y="230" width="50" height="170" fill="#bbcfd9" stroke="#25435a" stroke-width="4"/><text x="80" y="470" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="25" fill="#25435a">全ての基材を＋電源につなぐ指示ではない。</text><text x="760" y="164" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="29" fill="#25435a">電着塗装：方式で品物の電極が異なる</text><rect x="800" y="240" width="210" height="140" fill="#bfd6dd" stroke="#25435a" stroke-width="4"/><rect x="1100" y="240" width="210" height="140" fill="#d8d0ba" stroke="#25435a" stroke-width="4"/><text x="845" y="309" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="29" fill="#25435a">陽極側</text><text x="1145" y="309" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="29" fill="#25435a">陰極側</text><text x="770" y="470" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="25" fill="#25435a">
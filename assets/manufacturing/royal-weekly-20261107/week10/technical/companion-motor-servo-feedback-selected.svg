<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="38" fill="#25435a">誘導機の種類とサーボの帰還を区別する</text><text x="80" y="164" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="34" fill="#25435a">三相誘導機の回転子：かご形 ／ 巻線形</text><text x="80" y="234" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="29" fill="#25435a">始動法・巻線端子・定格・負荷・保護を合わせて照合</text><text x="80" y="299" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="29" fill="#25435a">始動電流低減だけで、全負荷に適すると判断しない。</text><polyline points="80,345 1360,345" fill="none" stroke="#607383" stroke-width="2"/><text x="80" y="432" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="32" fill="#25435a">サーボの紙上概念：指令との差を検出値で補正</text><text x="100" y="575" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="30" fill="#25435a">指令</text><polyline points="200,565 350,565" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="350,565 332.89150505529915,573.2643451481134 332.89150505529915,556.7356548518866 350,565" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="350,565 332.89150505529915,573.2643451481134 332.89150505529915,556.7356548518866" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><ellipse cx="405.0" cy="565.0" rx="45.0" ry="45.0" fill="#f8f1dd" stroke="#25435a" stroke-width="4"/><text x="380" y="560" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="25" fill="#25435a">比較</text><polyline points="450,565 560,565" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="560,565 542.8915050552991,573.2643451481134 542.8915050552991,556.7356548518866 560,565" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="560,565 542.8915050552991,573.2643451481134 542.8915050552991,556.7356548518866" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><rect x="570" y="510" width="210" height="110" fill="#d7e4e8" stroke="#25435a" stroke-width="4"/><text x="610" y="575" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="30" fill="#25435a">制御</text><polyline points="780,565 910,565" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="910,565 892.8915050552991,573.2643451481134 892.8915050552991,556.7356548518866 910,565" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="910,565 892.8915050552991,573.2643451481134 892.8915050552991,556.7356548518866" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><rect x="920" y="510" width="390" height="110" fill="#c9ded7" stroke="#25435a" stroke-width="4"/><text x="960" y="575" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="30" fill="#25435a">モータ・負荷</text><polyline points="1120,620 1120,760 405,760" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="405,760 405,620" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="405,620 413.26434514811336,637.1084949447009 396.73565485188664,637.1084949447009 405,620" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="405,620 413.26434514811336,637.1084949447009 396.73565485188664,637.1084949447009" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><rect x="710" y="715" width="260" height="90" fill="#d5caa9" stroke="#25435a" stroke-width="4"/><text x="760" y="763" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="28" fill="#25435a">エンコーダ</text><text x="80" y="878" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="28" fill="#25435a">位置・速度・トルクの要求を分ける。ずれを速度だけで直さない。</text><text x="55" y="949" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="38" fill="#25435a">電流則・電圧則・合成抵抗を別々に検算する</text><text x="80" y="163" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="33" fill="#25435a">節点：流入 8 mA = 流出 3 mA + 5 mA</text><ellipse cx="395.0" cy="260.0" rx="10.0" ry="10.0" fill="#25435a" stroke="#25435a" stroke-width="1"/><polyline points="110,260 375,260" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="375,260 357.89150505529915,268.26434514811336 357.89150505529915,251.73565485188664 375,260" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="375,260 357.89150505529915,268.26434514811336 357.89150505529915,251.73565485188664" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><polyline points="415,250 630,180" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="630,180 616.2905468706052,193.15488102921978 611.1734949720928,177.438221626646 630,180" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="630,180 616.2905468706052,193.15488102921978 611.1734949720928,177.438221626646" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><polyline points="415,270 630,350" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="630,350 611.0834889381907,351.7792159083282 616.8476004600464,336.2881661933414 630,350" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="630,350 611.0834889381907,351.7792159083282 616.8476004600464,336.2881661933414" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><text x="160" y="229" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="29" fill="#25435a">8 mA</text><text x="620" y="234" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="29" fill="#25435a">3 mA</text><text x="535" y="389" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="29" fill="#25435a">5 mA</text><text x="760" y="162" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="32" fill="#25435a">閉路：12 − 4 − 8 = 0 V</text><rect x="840" y="235" width="120" height="45" fill="#c2d6dc" stroke="#25435a" stroke-width="4"/><rect x="1120" y="235" width="140" height="45" fill="#d2c8aa" stroke="#25435a" stroke-width="4"/><polyline points="790,315 790,255 840,255" fill="none" stroke="#25435a" stroke-width="4"/><polyline points="790,385 790,410" fill="none" stroke="#25435a" stroke-width="4"/><ellipse cx="790.0" cy="350.0" rx="35.0" ry="35.0" fill="#fbf8ef" stroke="#25435a" stroke-width="4"/><text x="780" y="339" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="21" fill="#25435a">＋</text><text x="780" y="371" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="21" fill="#25435a">−</text><text x="740" y="464" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="24" fill="#25435a">＋12 V</text><polyline points="1220,410 1080,410" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="1080,410 1097.1084949447009,401.73565485188664 1097.1084949447009,418.26434514811336 1080,410" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="1080,410 1097.1084949447009,401.73565485188664 1097.1084949447009,418.26434514811336" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><polyline points="960,255 1120,255" fill="none" stroke="#25435a" stroke-width="4"/><polyline points="1260,255 1320,255 1320,410 790,410" fill="none" stroke="#25435a" stroke-width="4"/><text x="840" y="328" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="28" fill="#25435a">−4 V</text><text x="1120" y="328" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="28" fill="#25435a">−8 V</text><text x="890" y="465" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="25" fill="#25435a">一周：上昇＋12 Vと低下を検算</text><polyline points="70,530 1370,530" fill="none" stroke="#607383" stroke-width="2"/><text x="80" y="611" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="36" fill="#25435a">120 Ω ∥ 240 Ω = 80 Ω</text><polyline points="
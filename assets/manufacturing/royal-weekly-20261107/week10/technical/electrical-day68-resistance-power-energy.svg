<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="38" fill="#25435a">抵抗・電力・電力量：条件と単位をそろえる</text><text x="80" y="179" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="39" fill="#25435a">同じ材料・温度：R = ρℓ / S</text><rect x="120" y="270" width="400" height="40" fill="#b6cbd5" stroke="#25435a" stroke-width="4"/><rect x="120" y="385" width="800" height="40" fill="#b6cbd5" stroke="#25435a" stroke-width="4"/><text x="1000" y="319" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="29" fill="#25435a">長さ2倍 → R2倍</text><text x="80" y="512" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="32" fill="#25435a">ρ：Ω·m、ℓ：m、S：m²（直径を面積にしない）</text><polyline points="80,550 1360,550" fill="none" stroke="#607383" stroke-width="2"/><text x="80" y="640" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="40" fill="#25435a">12 V ÷ 60 Ω = 0.2 A</text><text x="80" y="730" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="40" fill="#25435a">P = 12 V × 0.2 A = 2.4 W</text><text x="80" y="817" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="37" fill="#25435a">30分 = 0.5 h → 2.4 W × 0.5 h = 1.2 Wh</text><text x="80" y="891" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="26" fill="#25435a">WとWhは別の量。算出値だけで定格・放熱の適合を決めない。</text><text x="55" y="949" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
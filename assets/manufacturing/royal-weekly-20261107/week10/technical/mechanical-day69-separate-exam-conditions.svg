<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="38" fill="#25435a">参照資料の試験区分：時間と条件を別々に確認する</text><text x="80" y="166" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="31" fill="#25435a">参照資料時点の概要：最新の実施者案内を確認</text><rect x="100" y="250" width="540" height="495" fill="#edf0e9" stroke="#25435a" stroke-width="4"/><text x="140" y="319" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="39" fill="#25435a">学科：40分</text><text x="140" y="429" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="39" fill="#25435a">30問</text><text x="140" y="507" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="27" fill="#25435a">真偽問題</text><text x="140" y="609" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="39" fill="#25435a">65%以上</text><text x="130" y="696" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="26" fill="#25435a">独自の等点練習：20問以上</text><rect x="800" y="250" width="540" height="495" fill="#edf0e9" stroke="#25435a" stroke-width="4"/><text x="840" y="319" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="39" fill="#25435a">実技：40分</text><text x="840" y="429" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="39" fill="#25435a">10問</text><text x="840" y="507" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="27" fill="#25435a">多肢選択の判断・計画等</text><text x="840" y="609" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="39" fill="#25435a">60%以上</text><text x="830" y="696" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="26" fill="#25435a">独自の等点練習：6問以上</text><text x="80" y="838" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="28" fill="#25435a">二つの合算平均では判定しない。実機作業や公式配点の再現ではない。</text><text x="80" y="897" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="27" fill="#25435a">本アプリの模試は独自作成。合格が資格・就業許可を意味しない。</text><text x="55" y="949" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
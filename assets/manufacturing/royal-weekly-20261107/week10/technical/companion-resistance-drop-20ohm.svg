<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="38" fill="#25435a">電圧降下法：対応するVとIで抵抗を求める</text><text x="80" y="174" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="34" fill="#25435a">独立した紙上例（実配線の手順ではない）</text><rect x="120" y="300" width="500" height="200" fill="#d6e4e8" stroke="#25435a" stroke-width="4"/><text x="170" y="375" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="40" fill="#25435a">電圧 V = 0.30 V</text><rect x="820" y="300" width="500" height="200" fill="#cee1d9" stroke="#25435a" stroke-width="4"/><text x="860" y="375" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="40" fill="#25435a">電流 I = 15 mA</text><text x="80" y="642" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="42" fill="#25435a">15 mA = 0.015 A</text><text x="80" y="754" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="44" fill="#25435a">R = V / I = 0.30 / 0.015 = 20 Ω</text><text x="80" y="851" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="31" fill="#25435a">ブリッジ法と区別。名称だけから回路を組まない。</text><text x="80" y="902" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="27" fill="#25435a">計器・配線・接点の影響を一律の補正値で扱わない。</text><text x="55" y="949" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
<text x="853" y="327" font-size="25" style="fill:#17374f" font-weight="400" text-anchor="start">二種金属の熱膨張差で曲がる</text>
<text x="853" y="818" font-size="25" style="fill:#17374f" font-weight="400" text-anchor="start">動作後は原因と安全を確認して復帰</text>
<path d="M82 863H1454" stroke="#c7ab75" stroke-width="2"/>
<text x="103" y="918" font-size="34" style="fill:#17374f" font-weight="700" text-anchor="start">負荷の開閉</text>
<text x="853" y="918" font-size="34" style="fill:#17374f" font-weight="700" text-anchor="start">過負荷の検出</text>
<text x="82" y="988" font-size="29" style="fill:#17374f" font-weight="600" text-anchor="start">サーマル単独を、主回路の遮断器として扱わない。</text>
<text x="82" y="1035" font-size="28" style="fill:#17374f" font-weight="400" text-anchor="start">原因を確認せず、リセットを繰り返して運転し続けない。</text>
<text x="82" y="1093" font-size="24" style="fill:#496378" font-weight="400" text-anchor="start">機能を学ぶ立体模式図。実物の端子配列・配線図・作業手順ではありません。</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="38" fill="#25435a">抵抗回路：軸・分子・無負荷の前提を確かめる</text><text x="80" y="164" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="34" fill="#25435a">真空・点電荷の力の大きさ：|q₁q₂| / (4πε₀r²)</text><text x="80" y="228" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="28" fill="#25435a">媒質や物体の条件が違えば、そのまま当てはめない。</text><text x="80" y="317" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="32" fill="#25435a">横V・縦I：傾き I/V = 1/R</text><polyline points="120,355 120,530 620,530" fill="none" stroke="#607383" stroke-width="2"/><polyline points="120,530 430,350" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="120,530 600,430" fill="none" stroke="#af8941" stroke-width="5"/><text x="90" y="350" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="25" fill="#25435a">I</text><text x="635" y="530" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="25" fill="#25435a">V</text><text x="430" y="355" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="25" fill="#25435a">小さいR</text><text x="520" y="465" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="25" fill="#25435a">大きいR</text><text x="800" y="316" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="31" fill="#25435a">負荷を加えない分圧</text><polyline points="880,350 880,560" fill="none" stroke="#25435a" stroke-width="4"/><rect x="850" y="380" width="60" height="55" fill="#c2d6dd" stroke="#25435a" stroke-width="4"/><rect x="850" y="495" width="60" height="55" fill="#d8caa5" stroke="#25435a" stroke-width="4"/><text x="935" y="417" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="27" fill="#25435a">R1 → V1</text><text x="935" y="527" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="27" fill="#25435a">R2</text><text x="790" y="628" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="28" fill="#25435a">V1 = V0 R1 / (R1+R2)</text><polyline points="780,350 780,560" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="780,560 771.7356548518866,542.8915050552991 788.2643451481134,542.8915050552991 780,560" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="780,560 771.7356548518866,542.8915050552991 788.2643451481134,542.8915050552991" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><polyline points="780,560 780,350" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="780,350 788.2643451481134,367.10849494470085 771.7356548518866,367.10849494470085 780,350" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="780,350 788.2643451481134,367.10849494470085 771.7356548518866,367.10849494470085" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><text x="725" y="469" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="24" fill="#25435a">V0</text><polyline points="80,660 1360,660" fill="none" stroke="#607383" stroke-width="2"/><text x="80" y="736" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="31" fill="#25435a">並列の分流：枝R1の分子は相手側R2</text><text x="80" y="828" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="38" fill="#25435a">I1 = I0 R2 / (R1+R2)</text><text x="80" y="890" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="25" fill="#25435a">I1 = V/R1 と同じ両端電圧から追う。計器や負荷の追加で回路は変わる。</text><text x="55" y="949" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
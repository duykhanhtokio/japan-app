<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="38" fill="#25435a">配線板の工程と単位：異なる膜と桁を区別する</text><text x="80" y="165" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="30" fill="#25435a">銅張り板の回路形成中：感光膜</text><text x="790" y="165" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="30" fill="#25435a">完成板：ソルダレジストの役割</text><rect x="120" y="350" width="470" height="170" fill="#c6d1cf" stroke="#25435a" stroke-width="4"/><rect x="120" y="320" width="470" height="30" fill="#c59c58" stroke="#25435a" stroke-width="4"/><rect x="830" y="350" width="470" height="170" fill="#c6d1cf" stroke="#25435a" stroke-width="4"/><rect x="830" y="320" width="470" height="30" fill="#c59c58" stroke="#25435a" stroke-width="4"/><rect x="120" y="285" width="170" height="35" fill="#91b7ce" stroke="#25435a" stroke-width="4"/><rect x="420" y="285" width="170" height="35" fill="#91b7ce" stroke="#25435a" stroke-width="4"/><text x="105" y="592" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="27" fill="#25435a">露光・現像・エッチング等の工程</text><rect x="830" y="295" width="170" height="25" fill="#72a895" stroke="#25435a" stroke-width="4"/><rect x="1100" y="295" width="200" height="25" fill="#72a895" stroke="#25435a" stroke-width="4"/><text x="820" y="590" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="25" fill="#25435a">完成板の保護等：感光膜と同一にしない</text><rect x="80" y="610" width="20" height="20" fill="#c6d1cf" stroke="#c6d1cf" stroke-width="1"/><text x="110" y="628" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="23" fill="#25435a">基材</text><rect x="300" y="610" width="20" height="20" fill="#c59c58" stroke="#c59c58" stroke-width="1"/><text x="330" y="628" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="23" fill="#25435a">銅</text><rect x="470" y="610" width="20" height="20" fill="#91b7ce" stroke="#91b7ce" stroke-width="1"/><text x="500" y="628" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="23" fill="#25435a">感光膜（左）</text><rect x="800" y="610" width="20" height="20" fill="#72a895" stroke="#72a895" stroke-width="1"/><text x="830" y="628" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="23" fill="#25435a">ソルダレジスト（右）</text><text x="80" y="678" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="28" fill="#25435a">層の模式比較。完全な製造順序・厚さ・薬液条件を指定しない。</text><polyline points="80,710 1360,710" fill="none" stroke="#607383" stroke-width="2"/><text x="80" y="791" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="41" fill="#25435a">1 mm = 10⁶ nm = 1,000,000 nm</text><text x="80" y="865" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="25" fill="#25435a">配線板のサブミリ・半導体のnmは桁の比較。全製品の線幅指定ではない。</text><text x="55" y="949" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
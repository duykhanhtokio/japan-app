<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP" font-size="38" fill="#25435a">陽極・陰極：電子が式のどちら側にあるかを読む</text><rect x="70" y="175" width="1300" height="180" fill="#e0eae8" stroke="#25435a" stroke-width="4"/><text x="110" y="216" font-family="Noto Sans CJK JP" font-size="31" fill="#25435a">陽極：酸化（電子を失う）</text><text x="325" y="306" font-family="DejaVu Sans" font-size="46" fill="#25435a">Al → Al³⁺ + 3e⁻</text><rect x="70" y="390" width="1300" height="180" fill="#e9e1cd" stroke="#25435a" stroke-width="4"/><text x="110" y="431" font-family="Noto Sans CJK JP" font-size="31" fill="#25435a">陰極：還元（電子を受け取る）</text><text x="325" y="521" font-family="DejaVu Sans" font-size="46" fill="#25435a">2H⁺ + 2e⁻ → H₂</text><rect x="130" y="690" width="470" height="110" fill="#b8cad1" stroke="#25435a" stroke-width="4"/><polyline points="200,745 530,745" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="530,745 512.8915050552991,753.2643451481134 512.8915050552991,736.7356548518866 530,745" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="530,745 512.8915050552991,753.2643451481134 512.8915050552991,736.7356548518866" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><text x="300" y="716" font-family="DejaVu Sans" font-size="46" fill="#25435a">e⁻</text><text x="145" y="863" font-family="Noto Sans CJK JP" font-size="28" fill="#25435a">金属・外部回路の電子</text><rect x="830" y="680" width="470" height="125" fill="#d9ebef" stroke="#25435a" stroke-width="4"/><ellipse cx="902.5" cy="737.5" rx="27.5" ry="27.5" fill="#b3d8dc" stroke="#25435a" stroke-width="4"/><text x="970" y="736" font-family="DejaVu Sans" font-size="46" fill="#25435a">H⁺</text><polyline points="1110,740 1250,740" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="1250,740 1232.8915050552991,748.2643451481134 1232.8915050552991,731.7356548518866 1250,740" fil
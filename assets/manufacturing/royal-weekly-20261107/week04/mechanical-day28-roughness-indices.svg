<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1152" viewBox="0 0 1536 1152"><defs><linearGradient id="steel" x2="0" y2="1"><stop stop-color="#c2d0d6"/><stop offset=".5" stop-color="#f3f7f8"/><stop offset="1" stop-color="#a8bac3"/></linearGradient></defs><rect width="1536" height="1152" fill="#fffdf7"/><text x="60" y="65" font-family="Noto Sans CJK JP,sans-serif" font-size="35" fill="#18364b" text-anchor="start">表面粗さ：指標・単位・測定条件をそろえて比較する</text><text x="60" y="130" font-family="Noto Sans CJK JP,sans-serif" font-size="31" fill="#18364b" text-anchor="start">Ra＝算術平均粗さ　／　Rz＝最大高さ粗さ</text><text x="60" y="195" font-family="Noto Sans CJK JP,sans-serif" font-size="24" fill="#566b77" text-anchor="start">表面の凹凸と触針の概念図（縦横の縮尺は異なり、実測波形ではありません）</text><path d="M100 450L160 425L220 465L280 395L340 440L400 375L460 420L520 485L580 440L640 405L700 465L760 420L820 390L880 450L940 475L1000 425L1060 450L1120 410L1180 460L1240 440L1300 465L1410 435L1410 585H100Z" stroke="#18364b" stroke-width="3" fill="url(#steel)" stroke-linejoin="round" /><path d="M100 440L1410 440" stroke="#566b77" stroke-width="2" fill="none" stroke-linejoin="round" stroke-dasharray="10 7"/><path d="M570 265H660V340L580 440L565 425L625 325H570Z" stroke="#18364b" stroke-width="3" fill="#637f90" stroke-linejoin="round" /><circle cx="580" cy="440" r="6" fill="#0d7a83" stroke="#18364b" stroke-width="3"/><text x="685" y="300" font-family="Noto Sans CJK JP,sans-serif" font-size="28" fill="#18364b" text-anchor="start">触針</text><text x="685" y="345" font-family="Noto Sans CJK JP,sans-serif" font-size="25" fill="#18364b" text-anchor="start">指定された位置・方向・方法で測定</text><rect x="60" y="655" width="680" height="235" rx="10" fill="#eff5f5" stroke="#a3b6bf" stroke-width="2"/><rect x="790" y="655" width="685" height="235" rx="10" fill="#eff5f5" stroke="#a3b6bf" stroke-width="2"/><text x="90" y="710" font-family="Noto Sans CJK JP,sans-serif" font-size="28" fill="#18364b" text-anchor="start">図面の要求（架空の例）</text><text x="90" y="780" font-family="Noto Sans CJK JP,sans-serif" font-size="39" fill="#0d7a83" text-anchor="start">Ra 0.8 μm 以下</text><text x="90" y="845" font-family="Noto Sans CJK JP,sans-serif" font-size="26" fill="#18364b" text-anchor="start">指標：Ra　単位：μm</text><text x="820" y="710" font-family="Noto Sans CJK JP,sans-serif" font-size="28" fill="#18364b" text-anchor="start">測定記録にある情報</text><text x="820" y="780" font-family="Noto Sans CJK JP,sans-serif" font-size="39" fill="#18364b" text-anchor="start">Rz 3.2 μm</text><text x="820" y="845" font-family="Noto Sans CJK JP,sans-serif" font-size="26" fill="#18364b" text-anchor="start">指標：Rz　単位：μm</text><text x="60" y="965" font-family="Noto Sans CJK JP,sans-serif" font-size="30" fill="#18364b" text-anchor="start">指標が異なるため、この二つの数値だけでは合否を判定できない。</text><text x="60" y="1025" font-family="Noto Sans CJK JP,sans-serif" font-size="26" fill="#18364b" text-anchor="start">要求されたRaと測定条件を確認する。外径の寸法合格も、粗さ合格の代わりにはならない。</text><text x="60" y="1090" font-family="Noto Sans CJK JP,sans-serif" font-size="24" fill="#566b77" text-anchor="start">記録：指標名・値・単位・測定箇所。光沢だけで粗さや機能の適合を判断しません。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP" font-size="38" fill="#25435a">改善の比較：件数が減っても、不良率は同じ場合がある</text><text x="90" y="216" font-family="Noto Sans CJK JP" font-size="36" fill="#25435a">処置前：200個中10個</text><rect x="90" y="300" width="1200" height="120" fill="#dfe8e7" stroke="#25435a" stroke-width="4"/><rect x="90" y="300" width="60" height="120" fill="#087e8b" stroke="#087e8b" stroke-width="4"/><text x="1120" y="277" font-family="Noto Sans CJK JP" font-size="42" fill="#25435a">5%</text><text x="90" y="526" font-family="Noto Sans CJK JP" font-size="36" fill="#25435a">処置後：80個中4個</text><rect x="90" y="610" width="1200" height="120" fill="#dfe8e7" stroke="#25435a" stroke-width="4"/><rect x="90" y="610" width="60" height="120" fill="#087e8b" stroke="#087e8b" stroke-width="4"/><text x="1120" y="587" font-family="Noto Sans CJK JP" font-size="42" fill="#25435a">5%</text><text x="90" y="826" font-family="Noto Sans CJK JP" font-size="36" fill="#25435a">10÷200×100 = 5%       4÷80×100 = 5%</text><text x="90" y="892" font-family="Noto Sans CJK JP" font-size="27" fill="#25435a">独立した紙上例。実工程の許容不良率を示す図ではない。</text><text x="55" y="949" font-family="Noto Sans CJK JP" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
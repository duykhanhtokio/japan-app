<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP" font-size="38" fill="#25435a">オームの法則：mVとmAをVとAへそろえる</text><polyline points="250,280 650,280 650,620 250,620 250,480" fill="none" stroke="#25435a" stroke-width="5"/><polyline points="250,280 250,400" fill="none" stroke="#25435a" stroke-width="5"/><polyline points="210,400 290,400" fill="none" stroke="#25435a" stroke-width="6"/><polyline points="225,480 275,480" fill="none" stroke="#25435a" stroke-width="6"/><rect x="395" y="250" width="135" height="60" fill="#dcc184" stroke="#25435a" stroke-width="4"/><text x="405" y="225" font-family="Noto Sans CJK JP" font-size="35" fill="#25435a">4 Ω</text><text x="70" y="451" font-family="Noto Sans CJK JP" font-size="31" fill="#25435a">120 mV</text><polyline points="300,280 375,280" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="375,280 357.89150505529915,288.26434514811336 357.89150505529915,271.73565485188664 375,280" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="375,280 357.89150505529915,288.26434514811336 357.89150505529915,271.73565485188664" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><text x="310" y="371" font-family="Noto Sans CJK JP" font-size="31" fill="#25435a">30 mA</text><text x="810" y="294" font-family="Noto Sans CJK JP" font-size="34" fill="#25435a">120 mV = 0.120 V</text><text x="810" y="399" font-family="Noto Sans CJK JP" font-size="34" fill="#25435a">30 mA = 0.030 A</text><text x="810" y="518" font-family="Noto Sans CJK JP" font-size="33" fill="#25435a">R = 0.120 / 0.030</text><text x="975" y="602" font-family="Noto Sans CJK JP" font-size="42" fill="#25435a">= 4 Ω</text><text x="135" y="821" font-family="Noto Sans CJK JP" font-size="36" fill="#25435a">4 Ω × 0.030 A = 0.120 V</text><text x="135" y="886" font-family="Noto Sans CJK JP" font-size="26" fill="#25435a">一定の理想抵抗を仮定した紙上例。実設備の設定・配線指示ではない。</text><text x="55" y="949" font-family="Noto Sans CJK JP" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP" font-size="38" fill="#25435a">pHの記録と、電子の受渡しの説明は別に考える</text><text x="75" y="192" font-family="Noto Sans CJK JP" font-size="32" fill="#25435a">pH：酸性・アルカリ性の指標</text><rect x="150" y="300" width="400" height="265" fill="#e1edf0" stroke="#25435a" stroke-width="4"/><polyline points="150,350 550,350" fill="none" stroke="#087e8b" stroke-width="3"/><rect x="330" y="250" width="35" height="220" fill="#b2c4cd" stroke="#25435a" stroke-width="4"/><polyline points="347,250 347,215 490,215" fill="none" stroke="#25435a" stroke-width="4"/><rect x="490" y="190" width="140" height="80" fill="#d3dfdf" stroke="#25435a" stroke-width="4"/><text x="535" y="239" font-family="Noto Sans CJK JP" font-size="34" fill="#25435a">pH</text><text x="80" y="692" font-family="Noto Sans CJK JP" font-size="27" fill="#25435a">常温・希薄な水溶液の入門例：</text><text x="110" y="743" font-family="Noto Sans CJK JP" font-size="28" fill="#25435a">中性をおよそpH7として比較</text><text x="800" y="192" font-family="Noto Sans CJK JP" font-size="32" fill="#25435a">酸化・還元：電子の受渡し</text><ellipse cx="900.0" cy="420.0" rx="80.0" ry="80.0" fill="#d8e4e5" stroke="#25435a" stroke-width="4"/><ellipse cx="1240.0" cy="420.0" rx="80.0" ry="80.0" fill="#d8e4e5" stroke="#25435a" stroke-width="4"/><polyline points="990,420 1145,420" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="1145,420 1127.8915050552991,428.26434514811336 1127.8915050552991,411.73565485188664 1145,420" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="1145,420 1127.8915050552991,428.26434514811336 1127.8915050552991,411.73565485188664" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><text x="1030" y="393" font-family="DejaVu Sans" font-size="38" fill="#25435a">e⁻</text><text x="820" y="577" font-family="Noto Sans CJK JP" font-size="27" fill="#25435a">失う：酸化</text><text x="1150" y="575" font-family="Noto Sans CJK JP" font-size="25" fill="#25435a">受け取る：還元</text><text x="85" y="851" font-family="Noto Sans CJK JP" font-size="26" fill="#25435a">pH値だけで成分・無害さを決めず、液の識別・温度・測定方法・記録を確認する。</text><text x="55" y="949" font-family="Noto Sans CJK JP" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
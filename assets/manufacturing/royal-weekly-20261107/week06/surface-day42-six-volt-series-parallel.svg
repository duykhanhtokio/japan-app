<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP" font-size="38" fill="#25435a">直列と並列：共通になる量と合成抵抗を分ける</text><text x="90" y="182" font-family="Noto Sans CJK JP" font-size="32" fill="#25435a">直列：電流が共通</text><polyline points="140,300 530,300 530,650 140,650 140,480" fill="none" stroke="#25435a" stroke-width="5"/><polyline points="140,300 140,410" fill="none" stroke="#25435a" stroke-width="5"/><polyline points="110,410 170,410" fill="none" stroke="#25435a" stroke-width="6"/><polyline points="120,480 160,480" fill="none" stroke="#25435a" stroke-width="6"/><rect x="235" y="270" width="110" height="60" fill="#d9be80" stroke="#25435a" stroke-width="4"/><rect x="235" y="620" width="110" height="60" fill="#d9be80" stroke="#25435a" stroke-width="4"/><text x="255" y="246" font-family="Noto Sans CJK JP" font-size="31" fill="#25435a">6 Ω</text><text x="255" y="721" font-family="Noto Sans CJK JP" font-size="31" fill="#25435a">3 Ω</text><text x="100" y="825" font-family="Noto Sans CJK JP" font-size="35" fill="#25435a">6 + 3 = 9 Ω</text><text x="815" y="182" font-family="Noto Sans CJK JP" font-size="32" fill="#25435a">並列：両端電圧が共通</text><polyline points="790,310 1300,310 1300,650 790,650 790,490" fill="none" stroke="#25435a" stroke-width="5"/><polyline points="790,310 790,410" fill="none" stroke="#25435a" stroke-width="5"/><polyline points="760,410 820,410" fill="none" stroke="#25435a" stroke-width="6"/><polyline points="770,490 810,490" fill="none" stroke="#25435a" stroke-width="6"/><text x="690" y="461" font-family="Noto Sans CJK JP" font-size="31" fill="#25435a">6 V</text><polyline points="1030,310 1030,650" fill="none" stroke="#25435a" stroke-width="5"/><rect x="1000" y="425" width="60" height="100" fill="#d9be80" stroke="#25435a" stroke-width="4"/><rect x="1270" y="425" width="60" height="100" fill="#d9be80" stroke="#25435a" stroke-width="4"/><text x="930" y="562" font-family="Noto Sans CJK JP" font-size="27" fill="#25435a">6 Ω / 1 A</text><text x="1220" y="562" font-family="Noto Sans CJK JP" font-size="27" fill="#25435a">3 Ω / 2 A</text><polyline points="830,310 925,310" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="925,310 907.8915050552991,318.26434514811336 907.8915050552991,301.73565485188664 925,310" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="925,310 907.8915050552991,318.26434514811336 907.8915050552991,301.73565485188664" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><text x="835" y="279" font-family="Noto Sans CJK JP" font-size="29" fill="#25435a">3 A</text><text x="820" y="822" font-family="Noto Sans CJK JP" font-size="32" fill="#25435a">6×3÷(6+3) = 2 Ω</text><text x="95" y="896" font-family="Noto Sans CJK JP" font-size="26" fill="#25435a">並列側は独立した6Vの紙上例。分岐点で1A+2A=3A、同じ節点の電圧を確認。</text><text x="55" y="949" font-family="Noto Sans CJK JP" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
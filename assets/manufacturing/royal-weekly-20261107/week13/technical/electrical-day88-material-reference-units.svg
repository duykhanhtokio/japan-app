<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="38" fill="#25435a">材料の比較値：基準・温度・単位を残して読む</text><text x="80" y="161" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="31" fill="#25435a">教材の比較：軟銅を基準にしたアルミ線の代表例</text><text x="80" y="249" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="34" fill="#25435a">導電率：軟銅 100% ／ アルミ 約60%</text><rect x="120" y="290" width="600" height="40" fill="#b9ced5" stroke="#25435a" stroke-width="4"/><rect x="120" y="390" width="360" height="40" fill="#c5dfd8" stroke="#25435a" stroke-width="4"/><text x="780" y="319" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="29" fill="#25435a">100%</text><text x="780" y="419" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="29" fill="#25435a">約60%</text><text x="80" y="530" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="30" fill="#25435a">密度は約1/3。軽さと導電性を同じ利点にしない。</text><polyline points="80,570 1360,570" fill="none" stroke="#607383" stroke-width="2"/><text x="80" y="648" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="33" fill="#25435a">20°Cの教材抵抗率：単位 Ω·mm²/m</text><text x="120" y="731" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="31" fill="#25435a">軟銅</text><text x="570" y="731" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="31" fill="#25435a">1/58 Ω·mm²/m</text><text x="120" y="796" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="31" fill="#25435a">硬銅</text><text x="570" y="796" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="31" fill="#25435a">1/55 Ω·mm²/m</text><text x="120" y="861" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="31" fill="#25435a">アルミ</text><text x="570" y="861" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="31" fill="#25435a">1/35 Ω·mm²/m</text><text x="55" y="949" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
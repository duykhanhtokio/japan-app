<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP" font-size="38" fill="#25435a">漏電の経路・接地・漏電遮断器の役割を分ける</text><text x="80" y="173" font-family="Noto Sans CJK JP" font-size="28" fill="#25435a">教材の故障経路例。実設備の配線・接地工事の指示ではない。</text><rect x="100" y="265" width="560" height="395" fill="#d4e2e5" stroke="#25435a" stroke-width="4"/><text x="125" y="315" font-family="Noto Sans CJK JP" font-size="30" fill="#25435a">金属ケース</text><rect x="180" y="385" width="260" height="105" fill="#9fb9c5" stroke="#25435a" stroke-width="4"/><polyline points="240,440 380,440" fill="none" stroke="#25435a" stroke-width="8"/><polyline points="380,440 460,400" fill="none" stroke="#b14e3d" stroke-width="7"/><polyline points="440,405 655,405" fill="none" stroke="#b14e3d" stroke-width="5"/><polyline points="655,405 637.8915050552991,413.26434514811336 637.8915050552991,396.73565485188664 655,405" fill="none" stroke="#b14e3d" stroke-width="1"/><polygon points="655,405 637.8915050552991,413.26434514811336 637.8915050552991,396.73565485188664" fill="#b14e3d" stroke="#b14e3d" stroke-width="1"/><text x="150" y="567" font-family="Noto Sans CJK JP" font-size="27" fill="#25435a">絶縁の損傷 → ケースへの漏れ</text><polyline points="660,615 750,615 750,760" fill="none" stroke="#087e8b" stroke-width="8"/><polyline points="700,760 800,760" fill="none" stroke="#087e8b" stroke-width="6"/><polyline points="715,780 785,780" fill="none" stroke="#087e8b" stroke-width="6"/><polyline points="732,800 768,800" fill="none" stroke="#087e8b" stroke-width="6"/><text x="425" y="862" font-family="Noto Sans CJK JP" font-size="27" fill="#25435a">接地：故障時の経路</text><rect x="960" y="315" width="310" height="260" fill="#e7dfc9" stroke="#25435a" stroke-width="4"/><text x="1000" y="402" font-family="Noto Sans CJK JP" font-size="32" fill="#25435a">漏電遮断器</text><polyline points="1000,475 1080,475 1160,425" fill="none" stroke="#25435a" stroke-width="5"/><polyline points="1170,475 1230,475" fill="none" stroke="#25435a" stroke-width="5"/><text x="885" y="667" font-family="Noto Sans CJK JP" font-size="27" fill="#25435a">接地とは異なる保護の役割</text><text x="900" y="742" font-family="Noto Sans CJK JP" font-size="27" fill="#25435a">必要な保護を一組で確認</text><text x="900" y="828" font-family="Noto Sans CJK JP" font-size="28" fill="#25435a">手で触って確認しない</text><text x="55" y="949" font-family="Noto Sans CJK JP" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
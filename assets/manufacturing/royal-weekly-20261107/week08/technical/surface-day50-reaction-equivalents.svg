<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="38" fill="#25435a">反応当量：指定した反応式で係数を確認する</text><text x="80" y="179" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="34" fill="#25435a">完全中和の条件：</text><text x="80" y="265" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="45" fill="#25435a">H₂SO₄ + 2 NaOH → Na₂SO₄ + 2 H₂O</text><rect x="110" y="345" width="510" height="220" fill="#d6e4ea" stroke="#25435a" stroke-width="4"/><rect x="820" y="345" width="510" height="220" fill="#cce0da" stroke="#25435a" stroke-width="4"/><text x="155" y="413" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="38" fill="#25435a">硫酸 1 mol</text><text x="865" y="413" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="38" fill="#25435a">NaOH 2 mol</text><polyline points="650,440 790,440" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="790,440 772.8915050552991,448.26434514811336 772.8915050552991,431.73565485188664 790,440" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="790,440 772.8915050552991,448.26434514811336 772.8915050552991,431.73565485188664" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><text x="155" y="504" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="29" fill="#25435a">H⁺ 2 mol 分に対応</text><text x="865" y="504" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="29" fill="#25435a">OH⁻ 2 mol 分に対応</text><text x="80" y="689" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="39" fill="#25435a">H₂SO₄：0.30 mol/L × 2 = 0.60 当量/L</text><text x="80" y="774" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="39" fill="#25435a">NaOH：0.40 mol/L × 1 = 0.40 当量/L</text><text x="80" y="866" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="31" fill="#25435a">反応・定義なしに「N」を mol/L へ置き換えない。</text><text x="55" y="949" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
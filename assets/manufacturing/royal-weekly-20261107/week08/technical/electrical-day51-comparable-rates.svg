<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="38" fill="#25435a">PDCAの比較：同じ検査方法・同じ母数で率を読む</text><text x="100" y="189" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="39" fill="#25435a">対策前：6 / 200 = 3%</text><text x="790" y="189" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="39" fill="#25435a">対策後：2 / 200 = 1%</text><polyline points="180,310 180,690 1250,690" fill="none" stroke="#607383" stroke-width="3"/><rect x="280" y="390" width="220" height="300" fill="#b5cbd2" stroke="#25435a" stroke-width="4"/><rect x="850" y="590" width="220" height="100" fill="#b3d5d0" stroke="#25435a" stroke-width="4"/><text x="330" y="752" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="42" fill="#25435a">3%</text><text x="910" y="752" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="42" fill="#25435a">1%</text><polyline points="550,520 800,520" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="800,520 782.8915050552991,528.2643451481134 782.8915050552991,511.73565485188664 800,520" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="800,520 782.8915050552991,528.2643451481134 782.8915050552991,511.73565485188664" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><text x="100" y="832" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="32" fill="#25435a">率は低下。ただし、対策だけの効果とはまだ断定しない。</text><text x="100" y="879" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="29" fill="#25435a">材料・生産条件・比較期間なども確認する。</text><text x="55" y="949" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
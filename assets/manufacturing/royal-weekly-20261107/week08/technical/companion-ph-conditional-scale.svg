e8b" stroke-width="1"/><polygon points="180,320 197.10849494470085,311.73565485188664 197.10849494470085,328.26434514811336" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><polyline points="790,320 1260,320" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="1260,320 1242.8915050552991,328.26434514811336 1242.8915050552991,311.73565485188664 1260,320" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="1260,320 1242.8915050552991,328.26434514811336 1242.8915050552991,311.73565485188664" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><text x="180" y="264" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="34" fill="#25435a">酸性側</text><text x="1110" y="264" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="34" fill="#25435a">アルカリ性側</text><polyline points="720,365 720,540" fill="none" stroke="#087e8b" stroke-width="5"/><text x="620" y="606" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="36" fill="#25435a">7付近：中性</text><text x="90" y="728" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="33" fill="#25435a">この目盛りは入門例。温度・液の条件を省かない。</text><text x="90" y="806" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="31" fill="#25435a">液の識別・温度・方法・日時を測定値へ対応させる。</text><text x="90" y="866" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="31" fill="#25435a">中性に近い数値だけで「無害」と判断しない。</text><text x="55" y="949" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
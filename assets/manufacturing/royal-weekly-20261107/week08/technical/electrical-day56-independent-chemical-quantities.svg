<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="38" fill="#25435a">pH・酸化還元・比重：別の量として考える</text><text x="80" y="176" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="36" fill="#25435a">pH：水溶液の酸性・アルカリ性の指標</text><text x="100" y="250" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="30" fill="#25435a">約25℃の通常の希薄水溶液の学習例：中性は7付近</text><text x="100" y="310" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="30" fill="#25435a">全温度・全液体に同じ範囲や値を当てはめない。</text><polyline points="80,350 1360,350" fill="none" stroke="#607383" stroke-width="2"/><text x="80" y="425" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="35" fill="#25435a">酸化：電子を失う　　　　還元：電子を受け取る</text><rect x="130" y="480" width="360" height="110" fill="#d3e2e7" stroke="#25435a" stroke-width="4"/><text x="160" y="537" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="32" fill="#25435a">電子を失う側</text><rect x="930" y="480" width="360" height="110" fill="#cbe0d9" stroke="#25435a" stroke-width="4"/><text x="960" y="537" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="32" fill="#25435a">受け取る側</text><polyline points="520,535 890,535" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="890,535 872.8915050552991,543.2643451481134 872.8915050552991,526.7356548518866 890,535" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="890,535 872.8915050552991,543.2643451481134 872.8915050552991,526.7356548518866" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><text x="680" y="515" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="40" fill="#25435a">e⁻</text><polyline points="80,650 1360,650" fill="none" stroke="#607383" stroke-width="2"/><text x="80" y="735" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="35" fill="#25435a">比重：基準水の密度との比（単位なし）</text><text x="100" y="813" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="33" fill="#25435a">比重2.5：同体積なら基準水の質量の2.5倍</text><text x="100" y="869" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="29" fill="#25435a">密度 kg/m³ とは別。体積が違えば質量比較も変わる。</text><text x="55" y="949" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
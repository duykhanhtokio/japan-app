<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="38" fill="#25435a">比重：同じ体積・同じ基準条件で比べる</text><text x="80" y="169" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="34" fill="#25435a">固体・液体の基準例：4℃の水（比重 1）</text><rect x="150" y="280" width="300" height="300" fill="#b7d7e2" stroke="#25435a" stroke-width="4"/><rect x="900" y="280" width="300" height="300" fill="#a6bdc9" stroke="#25435a" stroke-width="4"/><text x="170" y="644" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="34" fill="#25435a">基準の水：30 g</text><text x="900" y="644" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="34" fill="#25435a">試料：84 g</text><text x="180" y="742" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="32" fill="#25435a">同じ体積</text><text x="930" y="742" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="32" fill="#25435a">同じ体積</text><text x="360" y="222" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="32" fill="#25435a">体積をそろえる</text><polyline points="490,430 860,430" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="860,430 842.8915050552991,438.26434514811336 842.8915050552991,421.73565485188664 860,430" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="860,430 842.8915050552991,438.26434514811336 842.8915050552991,421.73565485188664" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><text x="300" y="842" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="42" fill="#25435a">84 ÷ 30 = 2.8  （比重は単位なし）</text><text x="55" y="949" font-family="Noto Sans CJK JP,DejaVu Sans" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
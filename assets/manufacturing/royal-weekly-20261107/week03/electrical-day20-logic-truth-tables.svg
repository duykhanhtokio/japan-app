"464" font-family="Noto Sans CJK JP,sans-serif" font-size="29" fill="#17324d" text-anchor="middle">Y</text><rect x="985" y="485" width="300" height="65" rx="10" fill="#fffdf6" stroke="#c6d3d9" stroke-width="2"/><text x="1035" y="529" font-family="Noto Sans CJK JP,sans-serif" font-size="29" fill="#17324d" text-anchor="middle">0</text><text x="1205" y="529" font-family="Noto Sans CJK JP,sans-serif" font-size="29" fill="#17324d" text-anchor="middle">1</text><rect x="985" y="550" width="300" height="65" rx="10" fill="#fffdf6" stroke="#c6d3d9" stroke-width="2"/><text x="1035" y="594" font-family="Noto Sans CJK JP,sans-serif" font-size="29" fill="#17324d" text-anchor="middle">1</text><text x="1205" y="594" font-family="Noto Sans CJK JP,sans-serif" font-size="29" fill="#17324d" text-anchor="middle">0</text><text x="60" y="820" font-family="Noto Sans CJK JP,sans-serif" font-size="27" fill="#17324d" text-anchor="start">AND：すべて1なら1　　OR：少なくとも一つが1なら1　　NOT：0と1を反転</text><text x="60" y="870" font-family="Noto Sans CJK JP,sans-serif" font-size="27" fill="#17324d" text-anchor="start">OR は入力が両方1でも出力1。「どちらか一方だけ」とは異なる。</text><text x="60" y="955" font-family="Noto Sans CJK JP,sans-serif" font-size="23" fill="#536575" text-anchor="start">論理の理解用。実機の安全回路・インターロックの認定には使いません。</text></svg>
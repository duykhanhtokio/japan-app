<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1152" viewBox="0 0 1536 1152"><defs><linearGradient id="steel" x2="0" y2="1"><stop stop-color="#c2d0d6"/><stop offset=".5" stop-color="#f3f7f8"/><stop offset="1" stop-color="#a8bac3"/></linearGradient></defs><rect width="1536" height="1152" fill="#fffdf7"/><text x="60" y="65" font-family="Noto Sans CJK JP,sans-serif" font-size="35" fill="#18364b" text-anchor="start">測定条件：視差・温度・保持状態をそろえる</text><text x="60" y="122" font-family="Noto Sans CJK JP,sans-serif" font-size="27" fill="#18364b" text-anchor="start">同じものを測っても、条件が違う値を無条件に平均しない。</text><text x="60" y="185" font-family="Noto Sans CJK JP,sans-serif" font-size="28" fill="#18364b" text-anchor="start">視差：目盛りと指標に高低差がある場合の概念</text><rect x="80" y="490" width="720" height="80" rx="0" fill="url(#steel)" stroke="#18364b" stroke-width="2"/><path d="M110 490L110 545" stroke="#18364b" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M155 490L155 525" stroke="#18364b" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M200 490L200 525" stroke="#18364b" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M245 490L245 525" stroke="#18364b" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M290 490L290 525" stroke="#18364b" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M335 490L335 545" stroke="#18364b" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M380 490L380 525" stroke="#18364b" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M425 490L425 525" stroke="#18364b" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M470 490L470 525" stroke="#18364b" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M515 490L515 525" stroke="#18364b" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M560 490L560 545" stroke="#18364b" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M605 490L605 525" stroke="#18364b" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M650 490L650 525" stroke="#18364b" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M695 490L695 525" stroke="#18364b" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M740 490L740 525" stroke="#18364b" stroke-width="2" fill="none" stroke-linejoin="round" /><rect x="405" y="365" width="15" height="25" rx="0" fill="#0d7a83" stroke="#0d7a83" stroke-width="2"/><text x="445" y="395" font-family="Noto Sans CJK JP,sans-serif" font-size="25" fill="#18364b" text-anchor="start">指標</text><circle cx="412" cy="240" r="24" fill="#e2edf0" stroke="#18364b" stroke-width="3"/><circle cx="140" cy="240" r="24" fill="#e2edf0" stroke="#18364b" stroke-width="3"/><path d="M412 263L412 490" stroke="#0d7a83" stroke-width="4" fill="none" stroke-linejoin="round" /><path d="M159 253L412 378" stroke="#b68c45" stroke-width="4" fill="none" stroke-linejoin="round" /><path d="M412 378L640 490" stroke="#b68c45" stroke-width="4" fill="none" stroke-linejoin="round" /><text x="330" y="209" font-family="Noto Sans CJK JP,sans-serif" font-size="25" fill="#0d7a83" text-anchor="start">正面</text><text x="90" y="209" font-family="Noto Sans CJK JP,sans-serif" font-size="25" fill="#b68c45" text-anchor="start">斜め</text><path d="M412 620L412 555" stroke="#0d7a83" stroke-width="4" fill="none" stroke-linejoin="round" /><path d="M419.19138307906303 568.1637384283556L412 555L404.80861692093697 568.1637384283556" stroke="#0d7a83" stroke-width="4" fill="none" stroke-linejoin="round" /><path d="M640 620L640 555" stroke="#b68c45" stroke-width="4" fill="none" stroke-linejoin="round" /><path d="M647.191383079063 568.1637384283556L640 555L632.808616920937 568.1637384283556" stroke="#b68c45" stroke-width="4" fill="none" stroke-linejoin="round" /><text x="295" y="660" font-family="Noto Sans CJK JP,sans-serif" font-size="25" fill="#18364b" text-anchor="start">同じ指標でも見かけの位置が変わる</text><rect x="900" y="175" width="575" height="510" rx="10" fill="#f1f5f5" stroke="#a3b6bf" stroke-width="2"/><text x="925" y="220" font-family="Noto Sans CJK JP,sans-serif" font-size="28" fill="#18364b" text-anchor="start">温度と測定器の状態</text><path d="M960 430H1040L1190 580L1340 430H1430V625H960Z" stroke="#18364b" stroke-width="3" fill="#c4d1d7" stroke-linejoin="round" /><circle cx="1190" cy="460" r="85" fill="url(#steel)" stroke="#18364b" stroke-width="3"/><text x="950" y="660" font-family="Noto Sans CJK JP,sans-serif" font-size="24" fill="#18364b" text-anchor="start">Vブロックと円筒断面（模式図）</text><text x="925" y="280" font-family="Noto Sans CJK JP,sans-serif" font-size="25" fill="#18364b" text-anchor="start">加工直後の熱い対象と</text><text x="925" y="320" font-family="Noto Sans CJK JP,sans-serif" font-size="25" fill="#18364b" text-anchor="start">温度条件をそろえた対象を</text><text x="925" y="360" font-family="Noto Sans CJK JP,sans-serif" font-size="25" fill="#18364b" text-anchor="start">同条件として扱わない。</text><rect x="60" y="750" width="1415" height="245" rx="10" fill="#f0f5f5" stroke="#a3b6bf" stroke-width="2"/><text x="90" y="800" font-family="Noto Sans CJK JP,sans-serif" font-size="28" fill="#18364b" text-anchor="start">測る前：基準・測定箇所・温度・保持方法・記録を確認する。</text><text x="90" y="855" font-family="Noto Sans CJK JP,sans-serif" font-size="26" fill="#18364b" text-anchor="start">校正、日常点検、使用期限を確認。ゼロ点だけで全範囲の正しさを保証しない。</text><text x="90" y="913" font-family="Noto Sans CJK JP,sans-serif" font-size="26" fill="#18364b" text-anchor="start">測定器のずれを見つけたら、無断で調整せず報告する。</text><text x="90" y="964" font-family="Noto Sans CJK JP,sans-serif" font-size="25" fill="#18364b" text-anchor="start">治具の強すぎる固定や不適切な置き方は、変形・傾きの原因となる。</text><text x="60" y="1090" font-family="Noto Sans CJK JP,sans-serif" font-size="23" fill="#566b77" text-anchor="start">概念図。具体的な基準温度・固定力・測定器の校正値を指定するものではありません。</text></svg>
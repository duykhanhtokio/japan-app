<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1152" viewBox="0 0 1536 1152"><defs><linearGradient id="steel" x2="0" y2="1"><stop stop-color="#c2d0d6"/><stop offset=".5" stop-color="#f3f7f8"/><stop offset="1" stop-color="#a8bac3"/></linearGradient></defs><rect width="1536" height="1152" fill="#fffdf7"/><text x="60" y="65" font-family="Noto Sans CJK JP,sans-serif" font-size="35" fill="#18364b" text-anchor="start">非破壊検査：欠陥の位置・材料と方法を対応させる</text><text x="60" y="120" font-family="Noto Sans CJK JP,sans-serif" font-size="27" fill="#18364b" text-anchor="start">表面に見えないことだけで、内部の欠陥がないとは判断しない。</text><rect x="60" y="175" width="675" height="380" rx="12" fill="#f8faf9" stroke="#b2c1c6" stroke-width="2"/><text x="85" y="223" font-family="Noto Sans CJK JP,sans-serif" font-size="27" fill="#18364b" text-anchor="start">超音波探傷：反射を利用</text><rect x="135" y="330" width="475" height="140" rx="0" fill="url(#steel)" stroke="#18364b" stroke-width="2"/><path d="M335 405H400" stroke="#0d7a83" stroke-width="7" fill="none" stroke-linejoin="round" /><rect x="280" y="275" width="160" height="55" rx="3" fill="#496c80" stroke="#18364b" stroke-width="2"/><path d="M305 328L360 405" stroke="#0d7a83" stroke-width="4" fill="none" stroke-linejoin="round" /><path d="M346.4968633376086 398.4681319458534L360 405L358.2006015690153 390.10831892342003" stroke="#0d7a83" stroke-width="4" fill="none" stroke-linejoin="round" /><path d="M360 405L415 328" stroke="#0d7a83" stroke-width="4" fill="none" stroke-linejoin="round" /><path d="M413.2006015690153 342.89168107657997L415 328L401.4968633376086 334.5318680541466" stroke="#0d7a83" stroke-width="4" fill="none" stroke-linejoin="round" /><text x="85" y="519" font-family="Noto Sans CJK JP,sans-serif" font-size="24" fill="#18364b" text-anchor="start">内部の反射を調べる。条件・範囲を記録。</text><rect x="800" y="175" width="675" height="380" rx="12" fill="#f8faf9" stroke="#b2c1c6" stroke-width="2"/><text x="825" y="223" font-family="Noto Sans CJK JP,sans-serif" font-size="27" fill="#18364b" text-anchor="start">放射線透過：透過の違い</text><circle cx="945" cy="290" r="28" fill="#d9e7ec" stroke="#18364b" stroke-width="3"/><rect x="890" y="350" width="475" height="105" rx="0" fill="url(#steel)" stroke="#18364b" stroke-width="2"/><path d="M1100 380l40 20l-25 25l-30-15Z" stroke="#18364b" stroke-width="3" fill="#fffdf7" stroke-linejoin="round" /><path d="M945 322L945 490" stroke="#0d7a83" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M937.808616920937 476.8362615716444L945 490L952.191383079063 476.8362615716444" stroke="#0d7a83" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M945 322L1010 490" stroke="#0d7a83" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M998.5431303499274 480.31805092859685L1010 490L1011.9569061300085 475.12819720416064" stroke="#0d7a83" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M945 322L1075 490" stroke="#0d7a83" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M1061.2565580049172 483.9901911737729L1075 490L1072.6314663510043 475.1881787631104" stroke="#0d7a83" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M945 322L1140 490" stroke="#0d7a83" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M1125.3331567252567 486.8561634339365L1140 490L1134.7209180101702 475.959654799662" stroke="#0d7a83" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M945 322L1205 490" stroke="#0d7a83" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M1190.0406824321221 488.89599913796314L1205 490L1197.8464309164688 476.81567410266473" stroke="#0d7a83" stroke-width="2" fill="none" stroke-linejoin="round" /><rect x="900" y="490" width="450" height="15" rx="0" fill="#6b8797" stroke="#18364b" stroke-width="2"/><text x="825" y="538" font-family="Noto Sans CJK JP,sans-serif" font-size="24" fill="#18364b" text-anchor="start">透過の違いを利用して内部を調べる。</text><rect x="60" y="590" width="675" height="380" rx="12" fill="#f8faf9" stroke="#b2c1c6" stroke-width="2"/><text x="85" y="638" font-family="Noto Sans CJK JP,sans-serif" font-size="27" fill="#18364b" text-anchor="start">浸透探傷：表面に開いた欠陥</text><rect x="135" y="755" width="475" height="130" rx="0" fill="url(#steel)" stroke="#18364b" stroke-width="2"/><path d="M365 755l-15 50l20 28l-5 43" stroke="#0d7a83" stroke-width="7" fill="none" stroke-linejoin="round" /><rect x="160" y="741" width="37" height="13" rx="2" fill="#1f9098" stroke="#1f9098" stroke-width="2"/><rect x="218" y="741" width="37" height="13" rx="2" fill="#1f9098" stroke="#1f9098" stroke-width="2"/><rect x="276" y="741" width="37" height="13" rx="2" fill="#1f9098" stroke="#1f9098" stroke-width="2"/><rect x="334" y="741" width="37" height="13" rx="2" fill="#1f9098" stroke="#1f9098" stroke-width="2"/><rect x="392" y="741" width="37" height="13" rx="2" fill="#1f9098" stroke="#1f9098" stroke-width="2"/><rect x="450" y="741" width="37" height="13" rx="2" fill="#1f9098" stroke="#1f9098" stroke-width="2"/><rect x="508" y="741" width="37" height="13" rx="2" fill="#1f9098" stroke="#1f9098" stroke-width="2"/><path d="M350 690L360 740" stroke="#0d7a83" stroke-width="4" fill="none" stroke-linejoin="round" /><path d="M350.366647216641 728.5022387330686L360 740L364.4701097742808 725.6815462215405" stroke="#0d7a83" stroke-width="4" fill="none" stroke-linejoin="round" /><text x="85" y="934" font-family="Noto Sans CJK JP,sans-serif" font-size="23" fill="#18364b" text-anchor="start">表面への開口が必要。内部だけの欠陥とは分ける。</text><rect x="800" y="590" width="675" height="380" rx="12" fill="#f8faf9" stroke="#b2c1c6" stroke-width="2"/><text x="825" y="638" font-family="Noto Sans CJK JP,sans-serif" font-size="27" fill="#18364b" text-anchor="start">磁粉探傷：磁化できる対象</text><rect x="875" y="755" width="475" height="130" rx="0" fill="url(#steel)" stroke="#18364b" stroke-width="2"/><path d="M1100 755l15 35l-5 36" stroke="#18364b" stroke-width="5" fill="none" stroke-linejoin="round" /><path d="M940 760Q1105 685 1280 760" stroke="#0d7a83" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M940 746Q1105 670 1280 746" stroke="#0d7a83" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M940 732Q1105 655 1280 732" stroke="#0d7a83" stroke-width="2" fill="none" stroke-linejoin="round" /><path d="M940 718Q1105 640 1280 718" stroke="#0d7a83" stroke-width="2" fill="none" stroke-linejoin="round" /><circle cx="1085" cy="739" r="2.5" fill="#18364b" stroke="#18364b" stroke-width="3"/><circle cx="1097" cy="739" r="2.5" fill="#18364b" stroke="#18364b" stroke-width="3"/><circle cx="1109" cy="739" r="2.5" fill="#18364b" stroke="#18364b" stroke-width="3"/><circle cx="1085" cy="732" r="2.5" fill="#18364b" stroke="#18364b" stroke-width="3"/><circle cx="1097" cy="732" r="2.5" fill="#18364b" stroke="#18364b" stroke-width="3"/><circle cx="1109" cy="732" r="2.5" fill="#18364b" stroke="#18364b" stroke-width="3"/><circle cx="1085" cy="725" r="2.5" fill="#18364b" stroke="#18364b" stroke-width="3"/><circle cx="1097" cy="725" r="2.5" fill="#18364b" stroke="#18364b" stroke-width="3"/><circle cx="1109" cy="725" r="2.5" fill="#18364b" stroke="#18364b" stroke-width="3"/><text x="895" y="910" font-family="Noto Sans CJK JP,sans-serif" font-size="24" fill="#18364b" text-anchor="start">表面・表面近く</text><text x="825" y="947" font-family="Noto Sans CJK JP,sans-serif" font-size="24" fill="#18364b" text-anchor="start">非磁性材料にも使えるとは決めつけない。</text><text x="60" y="1030" font-family="Noto Sans CJK JP,sans-serif" font-size="27" fill="#18364b" text-anchor="start">どの方法でも全欠陥を必ず検出できるわけではない。方法・範囲・条件を確認する。</text><text x="60" y="1090" font-family="Noto Sans CJK JP,sans-serif" font-size="23" fill="#566b77" text-anchor="start">独立した概念図。装置配置・放射線作業・検査実施の操作手順は示していません。</text></svg>
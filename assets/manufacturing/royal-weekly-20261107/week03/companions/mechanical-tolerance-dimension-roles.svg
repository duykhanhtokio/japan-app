<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP" font-size="38" fill="#25435a">図面：穴・軸の記号と寸法線を区別する</text><rect x="100" y="220" width="520" height="250" fill="#d8e4e7" stroke="#25435a" stroke-width="4"/><ellipse cx="360.0" cy="345.0" rx="100.0" ry="75.0" fill="#fbf8ef" stroke="#25435a" stroke-width="4"/><text x="225" y="537" font-family="Noto Sans CJK JP" font-size="32" fill="#25435a">穴：大文字</text><rect x="850" y="270" width="390" height="130" fill="#b8c9cf" stroke="#25435a" stroke-width="4"/><ellipse cx="855.0" cy="335.0" rx="45.0" ry="65.0" fill="#d5e0e4" stroke="#25435a" stroke-width="4"/><text x="880" y="537" font-family="Noto Sans CJK JP" font-size="32" fill="#25435a">軸：小文字</text><text x="100" y="638" font-family="Noto Sans CJK JP" font-size="28" fill="#25435a">続く数字：公差等級。上限・下限の寸法値そのものではない。</text><rect x="420" y="760" width="630" height="95" fill="#dbe5e6" stroke="#25435a" stroke-width="4"/><polyline points="420,690 420,885" fill="none" stroke="#607383" stroke-width="2"/><polyline points="1050,690 1050,885" fill="none" stroke="#607383" stroke-width="2"/><polyline points="735,725 425,725" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="425,725 442.10849494470085,716.7356548518866 442.10849494470085,733.2643451481134 425,725" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="425,725 442.10849494470085,716.7356548518866 442.10849494470085,733.2643451481134" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><polyline points="735,725 1045,725" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="1045,725 1027.8915050552991,733.2643451481134 1027.8915050552991,716.7356548518866 1045,725" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="1045,725 1027.8915050552991,733.2643451481134 1027.8915050552991,716.7356548518866" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><text x="605" y="694" font-family="Noto Sans CJK JP" font-size="29" fill="#25435a">寸法線</text><text x="1100" y="746" font-family="Noto Sans CJK JP" font-size="26" fill="#25435a">寸法補助線</text><polyline points="1090,760 1050,760" fill="none" stroke="#607383" stroke-width="2"/><text x="55" y="949" font-family="Noto Sans CJK JP" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
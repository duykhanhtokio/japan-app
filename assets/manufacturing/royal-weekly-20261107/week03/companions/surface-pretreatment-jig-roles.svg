<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP" font-size="38" fill="#25435a">前処理の対象を分け、治具の保護と通電接点を区別する</text><text x="80" y="183" font-family="Noto Sans CJK JP" font-size="28" fill="#25435a">脱脂：油分</text><rect x="100" y="270" width="330" height="115" fill="#c0ced3" stroke="#25435a" stroke-width="4"/><rect x="100" y="252" width="330" height="18" fill="#d8b768" stroke="#d8b768" stroke-width="4"/><text x="540" y="183" font-family="Noto Sans CJK JP" font-size="28" fill="#25435a">エッチング：酸化物</text><rect x="560" y="270" width="330" height="115" fill="#c0ced3" stroke="#25435a" stroke-width="4"/><rect x="560" y="252" width="330" height="18" fill="#a87a63" stroke="#a87a63" stroke-width="4"/><text x="1000" y="183" font-family="Noto Sans CJK JP" font-size="28" fill="#25435a">デスマット：残さ</text><rect x="1020" y="270" width="330" height="115" fill="#c0ced3" stroke="#25435a" stroke-width="4"/><rect x="1020" y="252" width="330" height="18" fill="#727c80" stroke="#727c80" stroke-width="4"/><text x="80" y="479" font-family="Noto Sans CJK JP" font-size="29" fill="#25435a">水洗・分岐などを省く教材図は、完全な作業手順書ではない。</text><polyline points="160,600 160,790 420,790 420,620" fill="none" stroke="#25435a" stroke-width="16"/><polyline points="160,600 160,745 390,745" fill="none" stroke="#c1984f" stroke-width="24"/><ellipse cx="420.0" cy="795.0" rx="20.0" ry="20.0" fill="#a8bfc7" stroke="#25435a" stroke-width="4"/><polyline points="665,650 175,680" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="175,680 191.57148508693476,670.7055994268861 192.58155439686448,687.2033981557383 175,680" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="175,680 191.57148508693476,670.7055994268861 192.58155439686448,687.2033981557383" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><text x="700" y="655" font-family="Noto Sans CJK JP" font-size="30" fill="#25435a">保護用コーティング</text><polyline points="665,805 445,795" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="445,795 462.4661128023033,787.5210359288725 461.7155836379029,804.0326775456823 445,795" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="445,795 462.4661128023033,787.5210359288725 461.7155836379029,804.0326775456823" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><text x="700" y="810" font-family="Noto Sans CJK JP" font-size="30" fill="#25435a">通電接点</text><text x="700" y="872" font-family="Noto Sans CJK JP" font-size="27" fill="#25435a">材質・損傷・承認条件を確認</text><text x="55" y="949" font-family="Noto Sans CJK JP" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
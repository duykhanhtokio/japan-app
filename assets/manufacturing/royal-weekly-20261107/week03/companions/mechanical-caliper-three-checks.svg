<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#fbf8ef"/><text x="55" y="78" font-family="Noto Sans CJK JP" font-size="38" fill="#25435a">ノギス：表示の細かさ・すき間・ゼロ点を分ける</text><rect x="100" y="210" width="1170" height="50" fill="#c4cfd3" stroke="#25435a" stroke-width="4"/><polyline points="160,150 220,150 220,420 190,420 160,330 160,150" fill="none" stroke="#25435a" stroke-width="4"/><polygon points="160,150 220,150 220,420 190,420 160,330" fill="#b2c1c8" stroke="#25435a" stroke-width="4"/><polyline points="232,150 302,150 302,330 262,420 232,420 232,150" fill="none" stroke="#25435a" stroke-width="4"/><polygon points="232,150 302,150 302,330 262,420 232,420" fill="#b2c1c8" stroke="#25435a" stroke-width="4"/><rect x="200" y="180" width="175" height="120" fill="#dbe2df" stroke="#25435a" stroke-width="4"/><rect x="225" y="198" width="126" height="59" fill="#f8fbf7" stroke="#25435a" stroke-width="4"/><text x="260" y="232" font-family="Noto Sans CJK JP" font-size="30" fill="#25435a">—</text><ellipse cx="332.5" cy="284.5" rx="12.5" ry="12.5" fill="#af8941" stroke="#af8941" stroke-width="4"/><polyline points="220,420 232,420" fill="none" stroke="#607383" stroke-width="2"/><polyline points="228,500 228,425" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="228,425 236.26434514811336,442.10849494470085 219.73565485188664,442.10849494470085 228,425" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="228,425 236.26434514811336,442.10849494470085 219.73565485188664,442.10849494470085" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><text x="90" y="548" font-family="Noto Sans CJK JP" font-size="28" fill="#25435a">閉じて、すき間を確認（間隔は強調）</text><polyline points="875,365 333,285" fill="none" stroke="#087e8b" stroke-width="5"/><polyline points="333,285 351.13187638225565,279.322407300748 348.7183662458902,295.6739384746241 333,285" fill="none" stroke="#087e8b" stroke-width="1"/><polygon points="333,285 351.13187638225565,279.322407300748 348.7183662458902,295.6739384746241" fill="#087e8b" stroke="#087e8b" stroke-width="1"/><text x="850" y="408" font-family="Noto Sans CJK JP" font-size="28" fill="#25435a">表示を0にする操作</text><polyline points="70,625 1370,625" fill="none" stroke="#c7c8bf" stroke-width="2"/><text x="90" y="705" font-family="Noto Sans CJK JP" font-size="30" fill="#25435a">副尺の最小読取値（資料の例）</text><text x="150" y="779" font-family="Noto Sans CJK JP" font-size="34" fill="#25435a">0.1 mm     0.05 mm     0.02 mm</text><text x="850" y="705" font-family="Noto Sans CJK JP" font-size="30" fill="#25435a">デジタルの最小表示量</text><text x="955" y="781" font-family="Noto Sans CJK JP" font-size="36" fill="#25435a">0.01 mm</text><text x="90" y="868" font-family="Noto Sans CJK JP" font-size="28" fill="#25435a">表示の細かさ ≠ 保証精度・ゼロ点やすき間の正常</text><text x="55" y="949" font-family="Noto Sans CJK JP" font-size="24" fill="#607383">教材の模式図：現物の仕様・承認手順を確認する。</text></svg>
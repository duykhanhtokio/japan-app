<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><rect width="1400" height="1000" fill="#fffdf6"/><text x="60" y="66" font-family="Noto Sans CJK JP,sans-serif" font-size="36" fill="#17324d" text-anchor="start">引張試験：応力とひずみを分けて読む</text><text x="60" y="130" font-family="Noto Sans CJK JP,sans-serif" font-size="26" fill="#536575" text-anchor="start">学習例：荷重中の一時点　／　試験片は模式図・実寸比ではない</text><path d="M180 230 H340 L440 260 H970 L1070 230 H1220 V350 H1070 L970 320 H440 L340 350 H180 Z" stroke="#17324d" stroke-width="3" fill="#e5edef" stroke-linejoin="round"/><path d="M470 253 L470 327" stroke="#087f8c" stroke-width="4" fill="none" stroke-linejoin="round"/><path d="M940 253 L940 327" stroke="#087f8c" stroke-width="4" fill="none" stroke-linejoin="round"/><text x="60" y="300" font-family="Noto Sans CJK JP,sans-serif" font-size="24" fill="#17324d" text-anchor="start">元の状態</text><path d="M470 395 L940 395" stroke="#536575" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M470 382 L470 408" stroke="#536575" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M940 382 L940 408" stroke="#536575" stroke-width="2" fill="none" stroke-linejoin="round"/><text x="705" y="434" font-family="Noto Sans CJK JP,sans-serif" font-size="27" fill="#17324d" text-anchor="middle">元の標点間距離 L＝50 mm</text><path d="M180 450 H340 L440 480 H970 L1070 450 H1220 V570 H1070 L970 540 H440 L340 570 H180 Z" stroke="#17324d" stroke-width="3" fill="#d6e3e8" stroke-linejoin="round"/><path d="M470 473 L470 547" stroke="#087f8c" stroke-width="4" fill="none" stroke-linejoin="round"/><path d="M940 473 L940 547" stroke="#087f8c" stroke-width="4" fill="none" stroke-linejoin="round"/><text x="60" y="520" font-family="Noto Sans CJK JP,sans-serif" font-size="24" fill="#17324d" text-anchor="start">荷重中</text><path d="M470 615 L940 615" stroke="#536575" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M470 602 L470 628" stroke="#536575" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M940 602 L940 628" stroke="#536575" stroke-width="2" fill="none" stroke-linejoin="round"/><text x="705" y="654" font-family="Noto Sans CJK JP,sans-serif" font-size="27" fill="#17324d" text-anchor="middle">標点間 51 mm</text><path d="M250 510 L150 510" stroke="#087f8c" stroke-width="5" fill="none" stroke-linejoin="round"/><path d="M164.91890355213633 501.84976584372856 L150 510 L164.91890355213633 518.1502341562715" stroke="#087f8c" stroke-width="5" fill="none" stroke-linejoin="round"/><path d="M1140 510 L1250 510" stroke="#087f8c" stroke-width="5" fill="none" stroke-linejoin="round"/><path d="M1235.0810964478637 518.1502341562715 L1250 510 L1235.0810964478637 501.84976584372856" stroke="#087f8c" stroke-width="5" fill="none" stroke-linejoin="round"/><text x="690" y="590" font-family="Noto Sans CJK JP,sans-serif" font-size="24" fill="#17324d" text-anchor="middle">力 F＝10000 N　／　元の断面積 A＝25 mm²</text><rect x="60" y="700" width="625" height="150" rx="10" fill="#eef4f6" stroke="#17324d" stroke-width="2"/><rect x="715" y="700" width="625" height="150" rx="10" fill="#eef4f6" stroke="#17324d" stroke-width="2"/><text x="85" y="742" font-family="Noto Sans CJK JP,sans-serif" font-size="29" fill="#17324d" text-anchor="start">公称応力＝F ÷ A</text><text x="85" y="786" font-family="Noto Sans CJK JP,sans-serif" font-size="27" fill="#17324d" text-anchor="start">10000 N ÷ 25 mm²＝400 MPa</text><text x="85" y="827" font-family="Noto Sans CJK JP,sans-serif" font-size="24" fill="#536575" text-anchor="start">1 N/mm²＝1 MPa</text><text x="740" y="742" font-family="Noto Sans CJK JP,sans-serif" font-size="29" fill="#17324d" text-anchor="start">公称ひずみ＝ΔL ÷ L</text><text x="740" y="786" font-family="Noto Sans CJK JP,sans-serif" font-size="27" fill="#17324d" text-anchor="start">(51−50) ÷ 50＝0.02＝2%</text><text x="740" y="827" font-family="Noto Sans CJK JP,sans-serif" font-size="24" fill="#536575" text-anchor="start">ひずみは長さの比（無次元）</text><text x="60" y="902" font-family="Noto Sans CJK JP,sans-serif" font-size="27" fill="#17324d" text-anchor="start">この一時点の値を、最大引張強さや破断伸びと呼ばない。</text><text x="60" y="955" font-family="Noto Sans CJK JP,sans-serif" font-size="25" fill="#536575" text-anchor="start">HRC・HBW・HV は別の硬さ尺度。試験方法と条件を含めて確認する。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1070" viewBox="0 0 1300 1070"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#172e43"/></marker></defs><rect width="1300" height="1070" fill="#f5f8fa"/><rect x="24" y="24" width="1252" height="1022" rx="14" fill="#fff" stroke="#b6c9d5" stroke-width="2"/><text x="60" y="75" font-family="Noto Sans CJK JP" font-size="30" fill="#172e43" text-anchor="start">図S：二つの工程モデルを比較する</text><text x="60" y="1035" font-family="Noto Sans CJK JP" font-size="20" fill="#596e7d" text-anchor="start">独自の学習用概念図 / 実配線・操作・工程設定の指示ではない</text><text x="80" y="128" font-family="Noto Sans CJK JP" font-size="27" fill="#172e43" text-anchor="start">A：工程モデル</text><text x="700" y="128" font-family="Noto Sans CJK JP" font-size="27" fill="#172e43" text-anchor="start">B：工程モデル</text><rect x="80" y="165" width="510" height="70" rx="14" fill="#e9f4f7" stroke="#9db5c2" stroke-width="2"/><text x="335" y="208" font-family="Noto Sans CJK JP" font-size="25" fill="#172e43" text-anchor="middle">前準備・適切な前処理</text><path d="M335 238 L335 260" fill="none" stroke="#172e43" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="265" width="510" height="70" rx="14" fill="#e9f4f7" stroke="#9db5c2" stroke-width="2"/><text x="335" y="308" font-family="Noto Sans CJK JP" font-size="25" fill="#172e43" text-anchor="middle">脱脂・洗浄 → 水洗</text><path d="M335 338 L335 360" fill="none" stroke="#172e43" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="365" width="510" height="70" rx="14" fill="#e9f4f7" stroke="#9db5c2" stroke-width="2"/><text x="335" y="408" font-family="Noto Sans CJK JP" font-size="25" fill="#172e43" text-anchor="middle">活性化 → 水洗</text><path d="M335 438 L335 460" fill="none" stroke="#172e43" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="465" width="510" height="70" rx="14" fill="#fff5d6" stroke="#9db5c2" stroke-width="2" stroke-dasharray="9 7"/><text x="335" y="508" font-family="Noto Sans CJK JP" font-size="25" fill="#172e43" text-anchor="middle">下地めっき → 水洗</text><path d="M335 538 L335 560" fill="none" stroke="#172e43" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="565" width="510" height="70" rx="14" fill="#e9f4f7" stroke="#9db5c2" stroke-width="2"/><text x="335" y="608" font-family="Noto Sans CJK JP" font-size="25" fill="#172e43" text-anchor="middle">主めっき → 水洗</text><path d="M335 638 L335 660" fill="none" stroke="#172e43" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="665" width="510" height="70" rx="14" fill="#fff5d6" stroke="#9db5c2" stroke-width="2" stroke-dasharray="9 7"/><text x="335" y="708" font-family="Noto Sans CJK JP" font-size="25" fill="#172e43" text-anchor="middle">必要な後処理 → 水洗</text><path d="M335 738 L335 760" fill="none" stroke="#172e43" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="765" width="510" height="70" rx="14" fill="#e9f4f7" stroke="#9db5c2" stroke-width="2"/><text x="335" y="808" font-family="Noto Sans CJK JP" font-size="25" fill="#172e43" text-anchor="middle">乾燥</text><rect x="700" y="165" width="510" height="70" rx="14" fill="#e9f4f7" stroke="#9db5c2" stroke-width="2"/><text x="955" y="208" font-family="Noto Sans CJK JP" font-size="25" fill="#172e43" text-anchor="middle">脱脂・洗浄 → 水洗</text><path d="M955 238 L955 260" fill="none" stroke="#172e43" stroke-width="4" marker-end="url(#arrow)"/><rect x="700" y="265" width="510" height="70" rx="14" fill="#e9f4f7" stroke="#9db5c2" stroke-width="2"/><text x="955" y="308" font-family="Noto Sans CJK JP" font-size="25" fill="#172e43" text-anchor="middle">活性化 → 水洗</text><path d="M955 338 L955 360" fill="none" stroke="#172e43" stroke-width="4" marker-end="url(#arrow)"/><rect x="700" y="365" width="510" height="70" rx="14" fill="#e9f4f7" stroke="#9db5c2" stroke-width="2"/><text x="955" y="408" font-family="Noto Sans CJK JP" font-size="25" fill="#172e43" text-anchor="middle">承認されたフラックス処理</text><path d="M955 438 L955 460" fill="none" stroke="#172e43" stroke-width="4" marker-end="url(#arrow)"/><rect x="700" y="465" width="510" height="70" rx="14" fill="#e9f4f7" stroke="#9db5c2" stroke-width="2"/><text x="955" y="508" font-family="Noto Sans CJK JP" font-size="25" fill="#172e43" text-anchor="middle">乾燥を確認</text><path d="M955 538 L955 560" fill="none" stroke="#172e43" stroke-width="4" marker-end="url(#arrow)"/><rect x="700" y="565" width="510" height="70" rx="14" fill="#e9f4f7" stroke="#9db5c2" stroke-width="2"/><text x="955" y="608" font-family="Noto Sans CJK JP" font-size="25" fill="#172e43" text-anchor="middle">溶融浴でのめっき</text><path d="M955 638 L955 660" fill="none" stroke="#172e43" stroke-width="4" marker-end="url(#arrow)"/><rect x="700" y="665" width="510" height="70" rx="14" fill="#e9f4f7" stroke="#9db5c2" stroke-width="2"/><text x="955" y="708" font-family="Noto Sans CJK JP" font-size="25" fill="#172e43" text-anchor="middle">冷却</text><path d="M955 738 L955 760" fill="none" stroke="#172e43" stroke-width="4" marker-end="url(#arrow)"/><rect x="700" y="765" width="510" height="70" rx="14" fill="#e9f4f7" stroke="#9db5c2" stroke-width="2"/><text x="955" y="808" font-family="Noto Sans CJK JP" font-size="25" fill="#172e43" text-anchor="middle">仕上げ</text><text x="80" y="912" font-family="Noto Sans CJK JP" font-size="23" fill="#172e43" text-anchor="start">破線：製品仕様で必要かを確認する承認工程。省略を自己判断しない。</text><text x="80" y="957" font-family="Noto Sans CJK JP" font-size="23" fill="#172e43" text-anchor="start">順序の比較用。濃度・温度・時間・配線・作業許可は指定しない。</text><text x="80" y="1002" font-family="Noto Sans CJK JP" font-size="23" fill="#172e43" text-anchor="start">B：湿った品物を溶融浴へ入れるという意味ではない。</text></svg>
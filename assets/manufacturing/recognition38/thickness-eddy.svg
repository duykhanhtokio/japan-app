<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334e68"/></marker></defs><rect width="1400" height="1000" fill="#fffaf0"/><style>text{font-family:'Noto Sans CJK JP',sans-serif;fill:#213b52;font-size:28px}.h{font-size:38px;font-weight:700}.small{font-size:24px}.label{font-size:31px;font-weight:700}.dim{stroke:#334e68;stroke-width:3;marker-start:url(#arrow);marker-end:url(#arrow)}.arr{stroke:#334e68;stroke-width:5;fill:none;marker-end:url(#arrow)}</style><text class="h" x="65" y="75">測定パネル B：プローブと試料</text><text class="small" x="65" y="120">独立した学習模式図・実寸ではありません／実機の操作指示ではありません</text><rect x="535" y="215" width="330" height="190" rx="24" fill="#dce9f0" stroke="#334e68" stroke-width="4"/><text class="label" x="590" y="260">プローブ</text><path d="M575 320 Q600 270 625 320 T675 320 T725 320 T775 320 T825 320" fill="none" stroke="#a95032" stroke-width="8"/><text class="small" x="585" y="365">コイル・交流磁界</text><path d="M620 415Q530 490 610 565 M780 415Q870 490 790 565" class="arr"/><rect x="245" y="575" width="910" height="55" fill="#d6ab54" stroke="#334e68" stroke-width="3"/><rect x="245" y="630" width="910" height="170" fill="#cbd5dc" stroke="#334e68" stroke-width="3"/><text class="label" x="300" y="614">非導電性皮膜</text><text class="label" x="300" y="775">導電性・非磁性の基材（例：Al）</text><ellipse cx="710" cy="685" rx="200" ry="28" fill="none" stroke="#a95032" stroke-width="5"/><path d="M900 678L918 685L900 697" fill="none" stroke="#a95032" stroke-width="5"/><text x="640" y="735">渦電流</text><text x="90" y="865">B：プローブと皮膜・基材の関係を確認</text><text class="small" x="90" y="920">形状・材質・校正条件を照合します。全ての層構成への適用保証ではありません。</text></svg>
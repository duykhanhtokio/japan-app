<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1140" viewBox="0 0 1300 1140"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#172e43"/></marker></defs><rect width="1300" height="1140" fill="#f5f8fa"/><rect x="24" y="24" width="1252" height="1092" rx="14" fill="#fff" stroke="#b6c9d5" stroke-width="2"/><text x="60" y="75" font-family="Noto Sans CJK JP" font-size="30" fill="#172e43" text-anchor="start">図T：処理の系列とできる皮膜</text><text x="60" y="1105" font-family="Noto Sans CJK JP" font-size="20" fill="#596e7d" text-anchor="start">独自の学習用概念図 / 実配線・操作・工程設定の指示ではない</text><text x="65" y="130" font-family="Noto Sans CJK JP" font-size="29" fill="#172e43" text-anchor="start">表面処理</text><path d="M150 153 L150 945" fill="none" stroke="#172e43" stroke-width="4"/><path d="M150 225 L255 225" fill="none" stroke="#172e43" stroke-width="4"/><rect x="255" y="190" width="950" height="130" rx="14" fill="#eef5f8" stroke="#b6c9d5" stroke-width="2"/><text x="280" y="230" font-family="Noto Sans CJK JP" font-size="28" fill="#172e43" text-anchor="start">めっき</text><text x="545" y="230" font-family="Noto Sans CJK JP" font-size="26" fill="#172e43" text-anchor="start">金属皮膜</text><text x="280" y="280" font-family="Noto Sans CJK JP" font-size="23" fill="#172e43" text-anchor="start">金属・樹脂など（適切な下地等を確認）</text><path d="M150 430 L255 430" fill="none" stroke="#172e43" stroke-width="4"/><rect x="255" y="395" width="950" height="130" rx="14" fill="#eef5f8" stroke="#b6c9d5" stroke-width="2"/><text x="280" y="435" font-family="Noto Sans CJK JP" font-size="28" fill="#172e43" text-anchor="start">陽極酸化</text><text x="545" y="435" font-family="Noto Sans CJK JP" font-size="26" fill="#172e43" text-anchor="start">酸化皮膜</text><text x="280" y="485" font-family="Noto Sans CJK JP" font-size="23" fill="#172e43" text-anchor="start">Al・Ti・Mg など</text><path d="M150 595 L255 595" fill="none" stroke="#172e43" stroke-width="4"/><rect x="255" y="560" 
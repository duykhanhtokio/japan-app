<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker><pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 16L16 0" stroke="#9aaba8" stroke-width="2"/></pattern></defs><rect width="1600" height="1000" fill="#fff9ed"/><g font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif" fill="#21384b"><text x="55" y="65" font-size="36" font-weight="700" fill="#21384b">図11：断続する区間を読む独立した学習模型</text><text x="80" y="145" font-size="27" font-weight="400" fill="#21384b">寸法はmm。赤い区間が対象。ピッチは同じ位置（始点）どうしの距離。</text><rect x="120" y="450" width="1330" height="130" rx="0" fill="#e5ede5" stroke="#306d90" stroke-width="4"/><line x1="260" y1="515" x2="460" y2="515" stroke="#d6232e" stroke-width="22" stroke-linecap="round"/><line x1="610" y1="515" x2="810" y2="515" stroke="#d6232e" stroke-width="22" stroke-linecap="round"/><line x1="960" y1="515" x2="1160" y2="515" stroke="#d6232e" stroke-width="22" stroke-linecap="round"/><line x1="260" y1="360" x2="460" y2="360" stroke="#21384b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line x1="260" y1="370" x2="260" y2="490" stroke="#21384b" stroke-width="2" stroke-linecap="round"/><line x1="460" y1="370" x2="460" y2="490" stroke="#21384b" stroke-width="2" stroke-linecap="round"/><text x="335" y="330" font-size="32" font-weight="700" fill="#21384b">20</text><line x1="260" y1="690" x2="610" y2="690" stroke="#21384b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line x1="260" y1="540" x2="260" y2="705" stroke="#21384b" stroke-width="2" stroke-linecap="round"/><line x1="610" y1="540" x2="610" y2="705" stroke="#21384b" stroke-width="2" stroke-linecap="round"/><text x="400" y="745" font-size="32" font-weight="700" fill="#21384b">35</text><text x="100" y="830" font-size="27" font-weight="400" fill="#21384b">3区間。実際の溶接記号・施工条件へそのまま流用しない。</text><text x="50" y="960" font-size="21" font-weight="400" fill="#21384b">学習用の独立した模式図。現場用表示・操作・現在の規格への適合を認証しません。</text></g></svg>
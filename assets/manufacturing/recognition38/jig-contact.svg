<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="1600" height="1200" fill="#fff8e8"/><g font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" fill="#26364c"><text x="45" y="65" font-size="39" font-weight="700" fill="#26364c">治具：保持・必要な接点・被覆を区別する</text><text x="45" y="118" font-size="24" font-weight="400" fill="#26364c">通電が必要な処理の独立した概念図。AとBは、同じ保持部の異なる役割に着目します。</text><rect x="100" y="200" width="1400" height="680" rx="10" fill="#f4f1e8" stroke="#c9c5b6" stroke-width="3"/><rect x="580" y="260" width="100" height="510" rx="0" fill="#a8c7b8" stroke="#287b72" stroke-width="3"/><rect x="610" y="240" width="40" height="65" rx="0" fill="#9faeb8" stroke="#26364c" stroke-width="3"/><path d="M650 430 L880 430 L930 480 L940 540" fill="none" stroke="#26364c" stroke-width="16"/><path d="M650 430 L880 430 L930 480" fill="none" stroke="#287b72" stroke-width="22"/><rect x="900" y="520" width="300" height="235" rx="35" fill="#c5d1d8" stroke="#426b91" stroke-width="3"/><text x="1000" y="660" font-size="32" font-weight="700" fill="#426b91">D：品物</text><circle cx="940" cy="540" r="15" fill="#e7ad68" stroke="#b45828" stroke-width="3"/><circle cx="900" cy="480" r="74" fill="none" stroke="#426b91" stroke-width="3"/><text x="150" y="345" font-size="30" font-weight="700" fill="#287b72">C：接点以外の治具被覆</text><line x1="410" y1="365" x2="575" y2="410" stroke="#287b72" stroke-width="4" marker-end="url(#arr)"/><text x="1050" y="340" font-size="31" font-weight="700" fill="#426b91">A：保持部</text><line x1="1100" y1="365" x2="960" y2="455" stroke="#426b91" stroke-width="4" marker-end="url(#arr)"/><text x="1100" y="805" font-size="29" font-weight="700" fill="#b45828">B：必要な導電接点</text><line x1="1130" y1="765" x2="955" y2="555" stroke="#b45828" stroke-width="4" marker-end="url(#arr)"/><line x1="630" y1="320" x2="630" y2="660" stroke="#b45828" stroke-width="5" marker-end="url(#arr)" stroke-dasharray="9 7"/><text x="160" y="620" font-size="27" font-weight="700" fill="#b45828">金属内部の導電経路</text><text x="160" y="665" font-size="24" font-weight="400" fill="#26364c">（模式的な表示）</text><line x1="450" y1="625" x2="595" y2="625" stroke="#b45828" stroke-width="3"/><text x="100" y="955" font-size="28" font-weight="700" fill="#26364c">A：品物を保持　／　B：指定された接点の導通を保つ　／　C：不要な付着を抑える</text><text x="100" y="1015" font-size="25" font-weight="400" fill="#26364c">必要な裸接点まで一律に被覆しません。被覆・保持・接点の条件は実物の指定で確認します。</text><text x="100" y="1075" font-size="25" font-weight="400" fill="#26364c">材質名だけで全ての処理液への適合を保証しません。極性・寸法・電源配線は示しません。</text><text x="100" y="1140" font-size="23" font-weight="400" fill="#26364c">図の位置や形は独自例です。実設備を触る、被覆を剥がす、薬液を扱うための指示ではありません。</text></g></svg>
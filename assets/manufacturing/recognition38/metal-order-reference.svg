ine x1="630" y1="775" x2="662" y2="775" stroke="#426b91" stroke-width="4" marker-end="url(#arr)"/><rect x="675" y="690" width="250" height="175" rx="12" fill="#e9f0f5" stroke="#426b91" stroke-width="3"/><text x="690" y="720" font-size="23" font-weight="700" fill="#26364c">13</text><text x="750" y="780" font-size="46" font-weight="700" fill="#426b91">Ag</text><text x="695" y="835" font-size="25" font-weight="700" fill="#26364c">銀</text><line x1="935" y1="775" x2="967" y2="775" stroke="#426b91" stroke-width="4" marker-end="url(#arr)"/><rect x="980" y="690" width="250" height="175" rx="12" fill="#e9f0f5" stroke="#426b91" stroke-width="3"/><text x="995" y="720" font-size="23" font-weight="700" fill="#26364c">14</text><text x="1055" y="780" font-size="46" font-weight="700" fill="#426b91">Pt</text><text x="1000" y="835" font-size="25" font-weight="700" fill="#26364c">白金</text><line x1="1240" y1="775" x2="1272" y2="775" stroke="#426b91" stroke-width="4" marker-end="url(#arr)"/><rect x="1285" y="690" width="250" height="175" rx="12" fill="#e9f0f5" stroke="#426b91" stroke-width="3"/><text x="1300" y="720" font-size="23" font-weight="700" fill="#26364c">15</text><text x="1360" y="780" font-size="46" font-weight="700" fill="#426b91">Au</text><text x="1305" y="835" font-size="25" font-weight="700" fill="#26364c">金</text><text x="70" y="185" font-size="26" font-weight="700" fill="#426b91">大きい側：01 →</text><text x="1200" y="935" font-size="26" font-weight="700" fill="#426b91">→ 15：小さい側</text><text x="70" y="1000" font-size="28" font-weight="700" fill="#26364c">HはPbとCuの間。水素は比較の基準として含まれ、金属ではありません。</text><text x="70" y="1060" font-size="25" font-weight="400" fill="#26364c">保護皮膜・液・温度などで実際の反応は変わります。順序だけで腐食速度を決めません。</text><text x="70" y="1120" font-size="25" font-weight="400" fill="#26364c">Alの酸化皮膜などの条件も確認します。全ての酸への一律の溶解や薬液作業を指示しません。</text></g></svg>
idth="130" height="80" rx="0" fill="#dae5df" stroke="#21384b" stroke-width="3"/><path d="M1340 400L1490 400L1490 480L1310 480Z" fill="#dae5df" stroke="#21384b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="1190" y1="230" x2="1510" y2="230" stroke="#306d90" stroke-width="4" stroke-linecap="round"/><path d="M1190 230L1160 300L1260 330L1342 408" fill="none" stroke="#306d90" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line x1="1260" y1="330" x2="1342" y2="408" stroke="#306d90" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1150" y="565" font-size="27" font-weight="700" fill="#21384b">左部材／右部材</text><text x="80" y="710" font-size="26" font-weight="400" fill="#21384b">A・B：基本記号が基線のどちら側か、矢がどこを指すかを読む。</text><text x="80" y="770" font-size="26" font-weight="400" fill="#21384b">C：折れた矢で示された部材を確認する。</text><text x="80" y="835" font-size="25" font-weight="400" fill="#21384b">図示方式・規格・注記を確認する。実溶接の指示や資格を与えない。</text><text x="50" y="960" font-size="21" font-weight="400" fill="#21384b">学習用の独立した模式図。現場用表示・操作・現在の規格への適合を認証しません。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334e68"/></marker></defs><rect width="1400" height="1000" fill="#fffaf0"/><style>text{font-family:'Noto Sans CJK JP',sans-serif;fill:#213b52;font-size:28px}.h{font-size:38px;font-weight:700}.small{font-size:24px}.label{font-size:31px;font-weight:700}.dim{stroke:#334e68;stroke-width:3;marker-start:url(#arrow);marker-end:url(#arrow)}.arr{stroke:#334e68;stroke-width:5;fill:none;marker-end:url(#arrow)}</style><text class="h" x="65" y="75">測定パネル A：励起側と検出側</text><text class="small" x="65" y="120">独立した学習模式図・実寸ではありません／実機の操作指示ではありません</text><rect x="150" y="220" width="370" height="150" rx="18" fill="#fae2d8" stroke="#a94b30" stroke-width="4"/><text class="label" x="205" y="285">励起側：X線源</text><path d="M490 370L660 600" class="arr"/><text x="365" y="465">入射X線</text><rect x="900" y="220" width="350" height="150" rx="18" fill="#dcebdc" stroke="#447755" stroke-width="4"/><text class="label" x="960" y="285">検出器</text><path d="M755 600L975 370" class="arr"/><text x="865" y="465">特性X線</text><rect x="270" y="600" width="860" height="55" fill="#d6ab54" stroke="#334e68" stroke-width="3"/><rect x="270" y="655" width="860" height="150" fill="#cbd5dc" stroke="#334e68" stroke-width="3"/><text class="label" x="320" y="640">皮膜</text><text class="label" x="320" y="740">基材</text><text x="90" y="865">A：元素に関係するX線の情報を測定に利用</text><text class="small" x="90" y="920">模式的な入射・検出の区別です。装置の構造・精度・校正手順は示しません。</text></svg>
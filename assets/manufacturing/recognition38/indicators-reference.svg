<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="1600" height="1200" fill="#fff8e8"/><g font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" fill="#26364c"><text x="45" y="65" font-size="39" font-weight="700" fill="#26364c">指示薬：名前を確認してから色の組合せを読む</text><text x="45" y="118" font-size="24" font-weight="400" fill="#26364c">代表的な呈色の比較。数値pH目盛り・全試験紙の校正表ではありません。</text><text x="560" y="185" font-size="28" font-weight="700" fill="#26364c">低いpH側の代表例</text><text x="1070" y="185" font-size="28" font-weight="700" fill="#26364c">高いpH側の代表例</text><rect x="50" y="235" width="1500" height="190" rx="10" fill="#f7f3e8" stroke="#c9c5b6" stroke-width="3"/><text x="75" y="300" font-size="29" font-weight="700" fill="#26364c">フェノールフタレイン</text><rect x="560" y="270" width="330" height="75" rx="14" fill="#fffdf6" stroke="#26364c" stroke-width="3"/><text x="560" y="390" font-size="27" font-weight="700" fill="#26364c">無色</text><rect x="1100" y="270" width="330" height="75" rx="14" fill="#e38ab4" stroke="#26364c" stroke-width="3"/><text x="1100" y="390" font-size="27" font-weight="700" fill="#26364c">赤色系（ピンク）</text><line x1="920" y1="310" x2="1055" y2="310" stroke="#426b91" stroke-width="5" marker-end="url(#arr)"/><rect x="50" y="465" width="1500" height="190" rx="10" fill="#f7f3e8" stroke="#c9c5b6" stroke-width="3"/><text x="75" y="530" font-size="29" font-weight="700" fill="#26364c">メチルオレンジ</text><rect x="560" y="500" width="330" height="75" rx="14" fill="#da7772" stroke="#26364c" stroke-width="3"/><text x="560" y="620" font-size="27" font-weight="700" fill="#26364c">赤色系</text><rect x="1100" y="500" width="330" height="75" rx="14" fill="#f2d879" stroke="#26364c" stroke-width="3"/><text x="1100" y="620" font-size="27" font-weight="700" fill="#26364c">黄色系</text><line x1="920" y1="540" x2="1055" y2="540" stroke="#426b91" stroke-width="5" marker-end="url(#arr)"/><rect x="50" y="695" width="1500" height="210" rx="10" fill="#f7f3e8" stroke="#c9c5b6" stroke-width="3"/><text x="75" y="765" font-size="37" font-weight="700" fill="#26364c">BTB</text><rect x="500" y="730" width="230" height="80" rx="12" fill="#f2d879" stroke="#26364c" stroke-width="3"/><text x="565" y="860" font-size="28" font-weight="700" fill="#26364c">黄色</text><rect x="850" y="730" width="230" height="80" rx="12" fill="#81b69b" stroke="#26364c" stroke-width="3"/><text x="915" y="860" font-size="28" font-weight="700" fill="#26364c">緑色</text><rect x="1200" y="730" width="230" height="80" rx="12" fill="#8ab4d6" stroke="#26364c" stroke-width="3"/><text x="1265" y="860" font-size="28" font-weight="700" fill="#26364c">青色</text><line x1="755" y1="770" x2="825" y2="770" stroke="#426b91" stroke-width="4" marker-end="url(#arr)"/><line x1="1105" y1="770" x2="1175" y2="770" stroke="#426b91" stroke-width="4" marker-end="url(#arr)"/><text x="70" y="980" font-size="28" font-weight="700" fill="#26364c">同じ色でも指示薬が違えば意味が異なります。無色だけで中性とは決めません。</text><text x="70" y="1040" font-size="25" font-weight="400" fill="#26364c">変色する範囲と条件は指示薬ごとに異なり、中間色もあります。色名と試薬名を一緒に記録します。</text><text x="70" y="1100" font-size="25" font-weight="400" fill="#26364c">pH試験紙はその製品の色見本・使用条件で読みます。この学習図から数値pHを確定しません。</text><text x="70" y="1160" font-size="24" font-weight="400" fill="#26364c">色覚差に備え全ての色見本に色名を併記。薬液混合や滴定の実施手順は含めていません。</text></g></svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300"><ns0:rect width="1600" height="1300" fill="#fffaf0" /><ns0:g font-family="Noto Sans CJK JP,sans-serif"><ns0:text x="55" y="110" font-size="23" fill="#173b52">独立した合成模式図・紙上学習専用／実物写真・操作手順・合否基準ではありません。</ns0:text><ns0:text x="65" y="180" font-size="30" fill="#173b52">A</ns0:text><ns0:rect x="70" y="215" width="660" height="330" rx="12" fill="#e5f0f1" stroke="#37677a" stroke-width="3" /><ns0:circle cx="300" cy="370" r="105" fill="#d9bf92" stroke="#37677a" stroke-width="7" /><ns0:circle cx="300" cy="370" r="18" fill="#37677a" /><ns0:line x1="405" y1="370" x2="605" y2="370" stroke="#37677a" stroke-width="4" /><ns0:rect x="185" y="480" width="240" height="30" rx="12" fill="#a9c6d3" stroke="#37677a" stroke-width="3" /><ns0:text x="820" y="180" font-size="30" fill="#173b52">B・C・D：独立した表面断面モデル</ns0:text><ns0:text x="820" y="230" font-size="25" fill="#173b52">B</ns0:text><ns0:polyline points="850,320 900,265 950,320 1000,260 1050,320 1100,270 1150,320 1200,260 1250,320 1300,270 1350,320 1430,270" fill="none" stroke="#406978" stroke-width="7" /><ns0:text x="820" y="455" font-size="25" fill="#173b52">C</ns0:text><ns0:polyline points="850,520 900,510 950,520 1000,510 1050,520 1100,580 1150,520 1200,510 1250,520 1300,510 1350,520 1430,510" fill="none" stroke="#406978" stroke-width="7" /><ns0:text x="820" y="680" font-size="25" fill="#173b52">D</ns0:text><ns0:polyline points="850,760 900,752 950,760 1000,752 1050,760 1100,752 1150,760 1200,752 1250,760 1300,752 1350,760 1430,752" fill="none" stroke="#406978" stroke-width="7" /><ns0:text x="70" y="1150" font-size="24" fill="#173b52">図は操作順序や材料除去量を保証せず、鏡面の必要性も製品の指定で異なります。</ns0:text><ns0:text x="55" y="1240" font-size="23" fill="#173b52">対象面・観察事実・工程条件を分ける。実作業は指定された手順と権限に従います。</ns0:text></ns0:g></ns0:svg>
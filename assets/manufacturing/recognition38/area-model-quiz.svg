<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300"><ns0:rect width="1600" height="1300" fill="#fffaf0" /><ns0:g font-family="Noto Sans CJK JP,sans-serif"><ns0:text x="55" y="65" font-size="36" fill="#173b52">めっき：対象面の面積と保持方式</ns0:text><ns0:text x="55" y="110" font-size="23" fill="#173b52">独立した合成模式図・紙上学習専用／実物写真・操作手順・合否基準ではありません。</ns0:text><ns0:text x="65" y="180" font-size="30" fill="#173b52">面積モデル：穴なし直方体 60 × 40 × 2 mm</ns0:text><ns0:rect x="100" y="225" width="480" height="320" rx="12" fill="#e5f0f1" stroke="#37677a" stroke-width="3" /><ns0:text x="245" y="405" font-size="34" fill="#173b52">A：60 × 40</ns0:text><ns0:line x1="100" y1="575" x2="580" y2="575" stroke="#37677a" stroke-width="4" /><ns0:text x="270" y="615" font-size="26" fill="#173b52">60 mm</ns0:text><ns0:text x="610" y="395" font-size="26" fill="#173b52">40 mm</ns0:text><ns0:rect x="880" y="225" width="480" height="32" rx="12" fill="#e4bc7b" stroke="#37677a" stroke-width="3" /><ns0:text x="890" y="305" font-size="26" fill="#173b52">B：側面 60 × 2 mm</ns0:text><ns0:text x="880" y="350" font-size="26" fill="#173b52">短い側面 40 × 2 mm は二面</ns0:text><ns0:text x="70" y="680" font-size="28" fill="#173b52">C・D・E：保持・移動の形を区別する（接続や運転は示しません）</ns0:text><ns0:rect x="80" y="720" width="440" height="340" rx="12" fill="#e5f0f1" stroke="#37677a" stroke-width="3" /><ns0:text x="100" y="770" font-size="28" fill="#173b52">C</ns0:text><ns0:rect x="580" y="720" width="440" height="340" rx="12" fill="#e5f0f1" stroke="#37677a" stroke-width="3" /><ns0:text x="600" y="770" font-size="28" fill="#173b52">D</ns0:text><ns0:rect x="1080" y="720" width="440" height="340" rx="12" fill="#e5f0f1" stroke="#37677a" stroke-width="3" /><ns0:text x="1100" y="770" font-size="28" fill="#173b52">E</ns0:text><ns0:line x1="140" y1="820" x2="450" y2="820" stroke="#37677a" stroke-width="4" /><ns0:line x1="210" y1="820" x2="210" y2="900" stroke="#37677a" stroke-width="4" /><ns0:line x1="370" y1="820" x2="370" y2="900" stroke="#37677a" stroke-width="4" /><ns0:rect x="180" y="900" width="60" height="100" rx="12" fill="#b7c9d3" stroke="#37677a" stroke-width="3" /><ns0:rect x="340" y="900" width="60" height="100" rx="12" fill="#b7c9d3" stroke="#37677a" stroke-width="3" /><ns0:polygon points="655,850 770,800 885,850 885,970 770,1020 655,970" fill="#c6d8e0" stroke="#37677a" stroke-width="4" /><ns0:circle cx="700" cy="895" r="16" fill="#e6b765" /><ns0:circle cx="760" cy="920" r="16" fill="#e6b765" /><ns0:circle cx="815" cy="890" r="16" fill="#e6b765" /><ns0:circle cx="780" cy="970" r="16" fill="#e6b765" /><ns0:circle cx="1160" cy="900" r="55" fill="#d2dfe6" stroke="#37677a" stroke-width="4" /><ns0:circle cx="1435" cy="900" r="55" fill="#d2dfe6" stroke="#37677a" stroke-width="4" /><ns0:line x1="1160" y1="860" x2="1435" y2="860" stroke="#d39c4d" stroke-width="20" /><ns0:text x="70" y="1140" font-size="25" fill="#173b52">この面積例に穴・接点の除外はありません。実物では対象面の指定を確認します。</ns0:text><ns0:text x="55" y="1240" font-size="23" fill="#173b52">対象面・観察事実・工程条件を分ける。実作業は指定された手順と権限に従います。</ns0:text></ns0:g></ns0:svg>
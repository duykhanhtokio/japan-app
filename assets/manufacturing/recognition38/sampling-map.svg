<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334e68"/></marker></defs><rect width="1400" height="1000" fill="#fffaf0"/><style>text{font-family:'Noto Sans CJK JP',sans-serif;fill:#213b52;font-size:28px}.h{font-size:38px;font-weight:700}.small{font-size:24px}.label{font-size:31px;font-weight:700}.dim{stroke:#334e68;stroke-width:3;marker-start:url(#arrow);marker-end:url(#arrow)}.arr{stroke:#334e68;stroke-width:5;fill:none;marker-end:url(#arrow)}</style><text class="h" x="65" y="75">測定位置と局所値：平均だけで判定しない</text><text class="small" x="65" y="120">独立した学習模式図・実寸ではありません／実機の操作指示ではありません</text><rect x="300" y="240" width="800" height="480" fill="#d9e7ed" stroke="#334e68" stroke-width="5"/><path d="M300 220V150 M1100 220V150" fill="none" stroke="#334e68" stroke-width="3"/><path d="M300 170H1100" class="dim"/><text x="630" y="158">100 mm</text><path d="M280 240H195 M280 720H195" fill="none" stroke="#334e68" stroke-width="3"/><path d="M220 240V720" class="dim"/><text x="70" y="490">60 mm</text><circle cx="460" cy="360" r="14" fill="#ad4b2d"/><text class="label" x="410" y="330">A: 8 μm</text><circle cx="940" cy="360" r="14" fill="#ad4b2d"/><text class="label" x="890" y="330">B: 10 μm</text><circle cx="700" cy="480" r="14" fill="#ad4b2d"/><text class="label" x="650" y="450">C: 12 μm</text><circle cx="460" cy="600" r="14" fill="#ad4b2d"/><text class="label" x="410" y="570">D: 14 μm</text><circle cx="940" cy="600" r="14" fill="#ad4b2d"/><text class="label" x="890" y="570">E: 16 μm</text><text x="300" y="790">同じ試料の五つの測定位置：A・B・C・D・E</text><text x="90" y="860">紙上の判定条件：各測定位置 10～14 μm（両端を含む）</text><text class="small" x="90" y="915">寸法・位置・膜厚値は独自例です。平均値と局所値を分けて読んでください。</text></svg>
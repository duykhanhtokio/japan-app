<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300"><rect width="1600" height="1300" fill="#fffaf0"/><g font-family="Noto Sans CJK JP,sans-serif"><text x="55" y="65" font-size="36" fill="#173b52">バフ：停止工具と工程前後の表面変化</text><text x="55" y="110" font-size="23" fill="#173b52">独立した合成模式図・紙上学習専用／実物写真・操作手順・合否基準ではありません。</text><text x="65" y="180" font-size="30" fill="#173b52">A：停止した工具の概念／清掃・調整を実演しない</text><rect x="70" y="215" width="660" height="330" rx="12" fill="#e5f0f1" stroke="#37677a" stroke-width="3"/><circle cx="300" cy="370" r="105" fill="#d9bf92" stroke="#37677a" stroke-width="7"/><circle cx="300" cy="370" r="18" fill="#37677a"/><line x1="405" y1="370" x2="605" y2="370" stroke="#37677a" stroke-width="4"/><rect x="185" y="480" width="240" height="30" rx="12" fill="#a9c6d3" stroke="#37677a" stroke-width="3"/><text x="460" y="325" font-size="40" fill="#173b52">停止</text><text x="90" y="580" font-size="23" fill="#173b52">光沢・バリや傷の除去は目的。回転数や押付け条件は示さない。</text><text x="820" y="180" font-size="30" fill="#173b52">B・C・D：独立した表面断面モデル</text><text x="820" y="230" font-size="25" fill="#173b52">B：粗い凹凸</text><polyline points="850,320 900,265 950,320 1000,260 1050,320 1100,270 1150,320 1200,260 1250,320 1300,270 1350,320 1430,270" fill="none" stroke="#406978" stroke-width="7"/><text x="820" y="455" font-size="25" fill="#173b52">C：細かくなっても深い傷が残る</text><polyline points="850,520 900,510 950,520 1000,510 1050,520 1100,580 1150,520 1200,510 1250,520 1300,510 1350,520 1430,510" fill="none" stroke="#406978" stroke-width="7"/><text x="820" y="680" font-size="25" fill="#173b52">D：細かく均一な模型</text><polyline points="850,760 900,752 950,760 1000,752 1050,760 1100,752 1150,760 1200,752 1250,760 1300,752 1350,760 1430,752" fill="none" stroke="#406978" stroke-width="7"/><text x="70" y="860" font-size="29" fill="#173b52">工程の目的：粗い段階の傷を確認 → 中間の均一化 → 指定の仕上げ</text><text x="70" y="935" font-size="28" fill="#173b52">細かい番手へ進むだけで残った深い傷が消えるとは限りません。</text><text x="70" y="1000" font-size="26" fill="#173b52">番手とRaは一対一の換算ではありません。色・通称から全製品の成分も決まりません。</text><text x="70" y="1080" font-size="25" fill="#173b52">Cの深い谷を残したまま「細かいから合格」としない。面・条件・指定評価を確認します。</text><text x="70" y="1150" font-size="24" fill="#173b52">図は操作順序や材料除去量を保証せず、鏡面の必要性も製品の指定で異なります。</text><text x="55" y="1240" font-size="23" fill="#173b52">対象面・観察事実・工程条件を分ける。実作業は指定された手順と権限に従います。</text></g></svg>
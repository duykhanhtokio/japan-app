<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#faf9f4"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="65" y="64" fill="#087f8c" font-size="28" font-weight="700">機械金属加工・学習図 083</text><text x="65" y="120" fill="#17344d" font-size="36" font-weight="700">金属の光沢・熱伝導率・融点を用途と対応させる</text><rect x="150" y="360" width="400" height="120" rx="0" fill="#c8a16c" stroke="#17344d" stroke-width="4"/><circle cx="140" cy="420" r="55" fill="#c64c4c" stroke="#17344d" stroke-width="3"/><line x1="180" y1="420" x2="510" y2="420" stroke="#d49320" stroke-width="14"/><polygon points="510,420 494.6923992600045,427.3944140798909 494.6923992600045,412.6055859201091" fill="#d49320" stroke="#d49320" stroke-width="1"/><text x="350" y="650" fill="#17344d" font-size="30" font-weight="500" text-anchor="middle">熱を伝えやすい例</text><rect x="800" y="360" width="400" height="120" rx="0" fill="#a8bac9" stroke="#17344d" stroke-width="4"/><circle cx="790" cy="420" r="55" fill="#c64c4c" stroke="#17344d" stroke-width="3"/><line x1="830" y1="420" x2="960" y2="420" stroke="#d49320" stroke-width="14"/><polygon points="960,420 944.6923992600045,427.3944140798909 944.6923992600045,412.6055859201091" fill="#d49320" stroke="#d49320" stroke-width="1"/><text x="1000" y="650" fill="#17344d" font-size="30" font-weight="500" text-anchor="middle">熱を伝えにくい例</text><text x="700" y="240" fill="#17344d" font-size="34" font-weight="500" text-anchor="middle">材料・条件をそろえて比べる模式図</text><text x="700" y="755" fill="#17344d" font-size="32" font-weight="500" text-anchor="middle">融点だけで使用できる温度は決まらない</text><text x="700" y="865" text-anchor="middle" fill="#667985" font-size="26">独自の学習用模式図・実機の仕様や作業指示ではありません</text></g></svg>
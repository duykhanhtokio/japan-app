<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#faf9f4"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="65" y="64" fill="#087f8c" font-size="28" font-weight="700">機械金属加工・学習図 058</text><text x="65" y="120" fill="#17344d" font-size="36" font-weight="700">火災時は通報・退避と適合する初期対応を優先する</text><path d="M270,600 C150,530 260,445 240,370 C370,450 340,480 380,450 C435,550 390,620 270,600 Z" fill="#d49320" stroke="#c64c4c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="145" y="610" width="340" height="35" rx="0" fill="#a8bac9" stroke="#17344d" stroke-width="3"/><rect x="760" y="300" width="100" height="130" rx="14" fill="#c64c4c" stroke="#c64c4c" stroke-width="3"/><text x="810" y="385" fill="#ffffff" font-size="28" font-weight="500" text-anchor="middle">通報</text><rect x="1050" y="280" width="180" height="350" rx="0" fill="#087f8c" stroke="#17344d" stroke-width="5"/><path d="M1070,310 H1190 V600" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><line x1="900" y1="550" x2="1050" y2="550" stroke="#087f8c" stroke-width="10"/><polygon points="1050,550 1034.6923992600045,557.3944140798909 1034.6923992600045,542.6055859201091" fill="#087f8c" stroke="#087f8c" stroke-width="1"/><text x="700" y="755" fill="#17344d" font-size="30" font-weight="500" text-anchor="middle">知らせる・退路を確保・無理な接近をしない</text><text x="700" y="865" text-anchor="middle" fill="#667985" font-size="26">独自の学習用模式図・実機の仕様や作業指示ではありません</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#faf9f4"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="65" y="64" fill="#087f8c" font-size="28" font-weight="700">機械金属加工・学習図 087</text><text x="65" y="120" fill="#17344d" font-size="36" font-weight="700">砥石と切りくずの危険を加工方式ごとに整理する</text><circle cx="460" cy="420" r="145" fill="#667985" stroke="#17344d" stroke-width="3"/><circle cx="460" cy="420" r="45" fill="#ffffff" stroke="#17344d" stroke-width="3"/><path d="M310,430 A150,150 0 0,1 610,430" fill="none" stroke="#087f8c" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"/><rect x="410" y="560" width="390" height="55" rx="0" fill="#a8bac9" stroke="#17344d" stroke-width="3"/><rect x="690" y="340" width="90" height="220" rx="0" fill="#667985" stroke="#17344d" stroke-width="3"/><path d="M540,540 l100,90 M560,520 l150,40 M580,500 l160,0" fill="none" stroke="#d49320" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><rect x="990" y="300" width="190" height="300" rx="0" fill="#e8f2f3" stroke="#17344d" stroke-width="4"/><path d="M1005,320 l165,255 M1170,320 l-165,255" fill="none" stroke="#c64c4c" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><text x="700" y="755" fill="#17344d" font-size="32" font-weight="500" text-anchor="middle">砥石・切りくずへ、動いたまま近づかない</text><text x="700" y="865" text-anchor="middle" fill="#667985" font-size="26">独自の学習用模式図・実機の仕様や作業指示ではありません</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#faf9f4"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="65" y="64" fill="#087f8c" font-size="28" font-weight="700">機械金属加工・学習図 079</text><text x="65" y="120" fill="#17344d" font-size="36" font-weight="700">ブロックゲージの測定面と保管を守る</text><rect x="230" y="400" width="70" height="210" rx="0" fill="#a8bac9" stroke="#17344d" stroke-width="4"/><rect x="310" y="382" width="70" height="228" rx="0" fill="#a8bac9" stroke="#17344d" stroke-width="4"/><rect x="390" y="364" width="70" height="246" rx="0" fill="#a8bac9" stroke="#17344d" stroke-width="4"/><rect x="470" y="346" width="70" height="264" rx="0" fill="#a8bac9" stroke="#17344d" stroke-width="4"/><line x1="225" y1="400" x2="550" y2="345" stroke="#087f8c" stroke-width="9"/><line x1="410" y1="365" x2="580" y2="265" stroke="#667985" stroke-width="2"/><circle cx="410" cy="365" r="4" fill="#087f8c" stroke="#087f8c" stroke-width="1"/><text x="586" y="260" fill="#17344d" font-size="28" font-weight="500" text-anchor="start">測定面</text><rect x="850" y="330" width="380" height="280" rx="18" fill="#c7a777" stroke="#17344d" stroke-width="5"/><rect x="875" y="385" width="45" height="180" rx="4" fill="#e8f2f3" stroke="#17344d" stroke-width="2"/><rect x="940" y="385" width="45" height="180" rx="4" fill="#e8f2f3" stroke="#17344d" stroke-width="2"/><rect x="1005" y="385" width="45" height="180" rx="4" fill="#e8f2f3" stroke="#17344d" stroke-width="2"/><rect x="1070" y="385" width="45" height="180" rx="4" fill="#e8f2f3" stroke="#17344d" stroke-width="2"/><rect x="1135" y="385" width="45" height="180" rx="4" fill="#e8f2f3" stroke="#17344d" stroke-width="2"/><text x="1070" y="710" fill="#17344d" font-size="32" font-weight="500" text-anchor="middle">保管・識別・傷の防止</text><text x="380" y="710" fill="#17344d" font-size="32" font-weight="500" text-anchor="middle">組合せと接触面を守る</text><text x="700" y="865" text-anchor="middle" fill
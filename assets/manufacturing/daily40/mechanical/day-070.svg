<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#faf9f4"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="65" y="64" fill="#087f8c" font-size="28" font-weight="700">機械金属加工・学習図 070</text><text x="65" y="120" fill="#17344d" font-size="36" font-weight="700">業務範囲と学び方を確認し、試験の公正を守る</text><rect x="165" y="260" width="390" height="390" rx="7" fill="#ffffff" stroke="#17344d" stroke-width="4"/><polygon points="510,260 555,305 510,305" fill="#e8f2f3" stroke="#17344d" stroke-width="3"/><text x="181" y="307" fill="#17344d" font-size="28" font-weight="500" text-anchor="start">専門語・文末</text><line x1="185" y1="337" x2="530" y2="337" stroke="#a8bac9" stroke-width="3"/><line x1="185" y1="367" x2="530" y2="367" stroke="#a8bac9" stroke-width="3"/><line x1="185" y1="397" x2="530" y2="397" stroke="#a8bac9" stroke-width="3"/><line x1="185" y1="427" x2="530" y2="427" stroke="#a8bac9" stroke-width="3"/><line x1="185" y1="457" x2="530" y2="457" stroke="#a8bac9" stroke-width="3"/><line x1="185" y1="487" x2="530" y2="487" stroke="#a8bac9" stroke-width="3"/><line x1="185" y1="517" x2="530" y2="517" stroke="#a8bac9" stroke-width="3"/><circle cx="460" cy="520" r="90" fill="none" stroke="#087f8c" stroke-width="10"/><line x1="520" y1="580" x2="580" y2="640" stroke="#087f8c" stroke-width="18"/><text x="340" y="405" fill="#17344d" font-size="40" font-weight="500" text-anchor="start">〜ない</text><rect x="950" y="300" width="180" height="290" rx="20" fill="#17344d" stroke="#17344d" stroke-width="4"/><circle cx="1040" cy="440" r="135" fill="none" stroke="#c64c4c" stroke-width="12"/><line x1="935" y1="545" x2="1145" y2="335" stroke="#c64c4c" stroke-width="13"/><text x="1040" y="710" fill="#17344d" font-size="30" font-weight="500" text-anchor="middle">試験情報を持ち出さない</text><text x="700" y="865" text-anchor="middle" fill="#667985" font-size="26">独自の学習用模式図・実機の仕様や作業指示ではありません</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#faf9f4"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="65" y="64" fill="#087f8c" font-size="28" font-weight="700">機械金属加工・学習図 055</text><text x="65" y="120" fill="#17344d" font-size="36" font-weight="700">ヒヤリ・ハットを件数だけで終わらせない</text><polygon points="1050,260 1250,660 850,660" fill="#e8f2f3" stroke="#087f8c" stroke-width="5"/><line x1="945" y1="470" x2="1150" y2="470" stroke="#17344d" stroke-width="4"/><line x1="900" y1="570" x2="1200" y2="570" stroke="#17344d" stroke-width="4"/><text x="1050" y="400" fill="#17344d" font-size="40" font-weight="500" text-anchor="middle">1</text><text x="1050" y="540" fill="#17344d" font-size="40" font-weight="500" text-anchor="middle">29</text><text x="1050" y="630" fill="#17344d" font-size="40" font-weight="500" text-anchor="middle">300</text><rect x="230" y="260" width="180" height="120" rx="0" fill="#d49320" stroke="#17344d" stroke-width="3"/><path d="M230,380 l30,70 -70,65" fill="none" stroke="#c64c4c" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><line x1="160" y1="600" x2="610" y2="600" stroke="#17344d" stroke-width="5"/><ellipse cx="420" cy="570" rx="60" ry="20" fill="#17344d" stroke="#17344d" stroke-width="3"/><text x="360" y="710" fill="#17344d" font-size="30" font-weight="500" text-anchor="middle">けががなくても事実を残す</text><text x="1040" y="750" fill="#17344d" font-size="28" font-weight="500" text-anchor="middle">学習上の比率・予測ではない</text><text x="700" y="865" text-anchor="middle" fill="#667985" font-size="26">独自の学習用模式図・実機の仕様や作業指示ではありません</text></g></svg>
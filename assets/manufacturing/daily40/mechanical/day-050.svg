<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#faf9f4"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="65" y="64" fill="#087f8c" font-size="28" font-weight="700">機械金属加工・学習図 050</text><text x="65" y="120" fill="#17344d" font-size="36" font-weight="700">比重を密度との比として読み、単位を混同しない</text><rect x="180" y="350" width="220" height="220" rx="0" fill="#3478b8" stroke="#17344d" stroke-width="3"/><polygon points="180,350 245,300 465,300 400,350" fill="#3478b8" stroke="#17344d" stroke-width="3"/><polygon points="400,350 465,300 465,520 400,570" fill="#3478b8" stroke="#17344d" stroke-width="3"/><rect x="900" y="350" width="220" height="220" rx="0" fill="#a8bac9" stroke="#17344d" stroke-width="3"/><polygon points="900,350 965,300 1185,300 1120,350" fill="#a8bac9" stroke="#17344d" stroke-width="3"/><polygon points="1120,350 1185,300 1185,520 1120,570" fill="#a8bac9" stroke="#17344d" stroke-width="3"/><text x="320" y="670" fill="#17344d" font-size="34" font-weight="500" text-anchor="middle">基準物質</text><text x="1040" y="670" fill="#17344d" font-size="34" font-weight="500" text-anchor="middle">比べる材料</text><text x="700" y="240" fill="#17344d" font-size="36" font-weight="500" text-anchor="middle">同じ体積・同じ条件で比べる</text><text x="700" y="755" fill="#17344d" font-size="32" font-weight="500" text-anchor="middle">比重は密度どうしの比（単位なし）</text><text x="700" y="865" text-anchor="middle" fill="#667985" font-size="26">独自の学習用模式図・実機の仕様や作業指示ではありません</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#faf9f4"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="65" y="64" fill="#087f8c" font-size="28" font-weight="700">機械金属加工・学習図 081</text><text x="65" y="120" fill="#17344d" font-size="36" font-weight="700">球・角・面取り・穴の補助記号を照合する</text><circle cx="280" cy="420" r="125" fill="#e8f2f3" stroke="#17344d" stroke-width="3"/><ellipse cx="280" cy="420" rx="125" ry="35" fill="none" stroke="#667985" stroke-width="3"/><line x1="155" y1="420" x2="405" y2="420" stroke="#c64c4c" stroke-width="4"/><text x="280" y="630" fill="#17344d" font-size="34" font-weight="500" text-anchor="middle">球径 Sφ</text><path d="M650,330 h240 l-60,60 h-180 Z" fill="#a8bac9" stroke="#17344d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M650,330 h90 v90 h-90 Z" fill="#e8f2f3" stroke="#17344d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line x1="850" y1="370" x2="920" y2="280" stroke="#667985" stroke-width="2"/><circle cx="850" cy="370" r="4" fill="#087f8c" stroke="#087f8c" stroke-width="1"/><text x="926" y="275" fill="#17344d" font-size="28" font-weight="500" text-anchor="start">面取り</text><rect x="950" y="460" width="220" height="120" rx="0" fill="#a8bac9" stroke="#17344d" stroke-width="3"/><polygon points="1000,460 1050,510 1100,460" fill="#ffffff" stroke="#17344d" stroke-width="3"/><text x="1060" y="660" fill="#17344d" font-size="32" font-weight="500" text-anchor="middle">皿ざぐり・穴</text><text x="700" y="755" fill="#17344d" font-size="32" font-weight="500" text-anchor="middle">記号だけでなく、指している形状を見る</text><text x="700" y="865" text-anchor="middle" fill="#667985" font-size="26">独自の学習用模式図・実機の仕様や作業指示ではありません</text></g></svg>
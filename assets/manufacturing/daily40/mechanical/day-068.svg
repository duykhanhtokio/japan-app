<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#faf9f4"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="65" y="64" fill="#087f8c" font-size="28" font-weight="700">機械金属加工・学習図 068</text><text x="65" y="120" fill="#17344d" font-size="36" font-weight="700">ダイオードとトランジスタを回路の役割で区別する</text><line x1="120" y1="420" x2="580" y2="420" stroke="#17344d" stroke-width="6"/><polygon points="270,340 270,500 400,420" fill="#e8f2f3" stroke="#17344d" stroke-width="3"/><line x1="400" y1="330" x2="400" y2="510" stroke="#17344d" stroke-width="7"/><line x1="170" y1="560" x2="490" y2="560" stroke="#087f8c" stroke-width="5"/><polygon points="490,560 474.6923992600045,567.3944140798909 474.6923992600045,552.6055859201091" fill="#087f8c" stroke="#087f8c" stroke-width="1"/><text x="355" y="690" fill="#17344d" font-size="34" font-weight="500" text-anchor="middle">一方向への導通</text><circle cx="1010" cy="420" r="135" fill="#ffffff" stroke="#17344d" stroke-width="3"/><line x1="870" y1="420" x2="960" y2="420" stroke="#17344d" stroke-width="6"/><line x1="960" y1="340" x2="960" y2="500" stroke="#17344d" stroke-width="6"/><line x1="960" y1="385" x2="1065" y2="315" stroke="#17344d" stroke-width="6"/><line x1="960" y1="455" x2="1065" y2="525" stroke="#17344d" stroke-width="6"/><line x1="1010" y1="488" x2="1065" y2="525" stroke="#17344d" stroke-width="5"/><polygon points="1065,525 1048.1715556191807,522.5909629057095 1056.426334804643,510.3203451975899" fill="#17344d" stroke="#17344d" stroke-width="1"/><text x="1030" y="690" fill="#17344d" font-size="32" font-weight="500" text-anchor="middle">増幅・スイッチング</text><text x="700" y="240" fill="#17344d" font-size="32" font-weight="500" text-anchor="middle">端子配置と使用条件は、機種ごとに確認</text><text x="700" y="865" text-anchor="middle" fill="#667985" font-size="26">独自の学習用模式図・実機の仕様や作業指示ではありません</text></g></svg>
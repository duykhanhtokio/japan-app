<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#193651"/></marker><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#e9eef1"/><stop offset=".5" stop-color="#aab9c5"/><stop offset="1" stop-color="#dce5eb"/></linearGradient></defs><rect x="0" y="0" width="1400" height="900" rx="0" fill="#fbfcfa" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1400" height="155" rx="0" fill="#193651" stroke="none" stroke-width="0"/><text x="48.00" y="40" font-size="26" fill="#c9e4e9" font-weight="normal" font-family="Noto Sans CJK JP">金属表面処理｜学習図 26</text><text x="48.00" y="90" font-size="36" fill="#fff" font-weight="bold" font-family="Noto Sans CJK JP">治具・マスキング・槽材の適合を確認する</text><polygon points="130,440 550,440 578,410 158,410" fill="#c1d0d9" stroke="#193651" stroke-width="3"/><rect x="130" y="440" width="420" height="130" rx="0" fill="url(#metal)" stroke="#193651" stroke-width="3"/><rect x="130" y="400" width="420" height="40" rx="0" fill="#d5a448" stroke="#193651" stroke-width="3"/><rect x="298.0" y="385" width="35" height="90" rx="2" fill="#8a9aa8" stroke="#193651" stroke-width="2"/><text x="238.50" y="620" font-size="29" fill="#193651" font-weight="bold" font-family="Noto Sans CJK JP">通電接点と保持</text><rect x="420" y="390" width="80" height="65" rx="8" fill="#188b87" stroke="#193651" stroke-width="3"/><polygon points="880,440 1180,440 1208,410 908,410" fill="#c1d0d9" stroke="#193651" stroke-width="3"/><rect x="880" y="440" width="300" height="130" rx="0" fill="url(#metal)" stroke="#193651" stroke-width="3"/><rect x="880" y="400" width="300" height="40" rx="0" fill="#d5a448" stroke="#193651" stroke-width="3"/><text x="928.50" y="620" font-size="29" fill="#193651" font-weight="bold" font-family="Noto Sans CJK JP">処理しない範囲</text><rect x="1050" y="390" width="90" height="45" rx="8" fill="#188b87" stroke="#193651" stroke-width="3"/><text x="930.00" y="310" font-size="30" fill="#193651" font-weight="normal" font-family="Noto Sans CJK JP">マスキング</text><line x1="45" y1="765" x2="1355" y2="765" stroke="#cbd8dd" stroke-width="2" /><text x="50.00" y="806" font-size="26" fill="#193651" font-weight="normal" font-family="Noto Sans CJK JP">治具は固定と通電の両面を確認する。</text><text x="50.00" y="839" font-size="26" fill="#193651" font-weight="normal" font-family="Noto Sans CJK JP">マスキングは範囲と材料適合を守る。</text><text x="50.00" y="872" font-size="26" fill="#193651" font-weight="normal" font-family="Noto Sans CJK JP">槽材の適合は薬液・温度などの条件で判断する。</text></svg>
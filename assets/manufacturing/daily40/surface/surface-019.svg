 y="670" font-size="29" fill="#193651" font-weight="bold" font-family="Noto Sans CJK JP">真空中の成膜</text><rect x="1050" y="340" width="220" height="250" rx="8" fill="#e7e9e0" stroke="#193651" stroke-width="3"/><line x1="1030" y1="380" x2="1120" y2="380" stroke="#188b87" stroke-width="14" /><text x="1050.00" y="320" font-size="28" fill="#193651" font-weight="normal" font-family="Noto Sans CJK JP">気相の反応</text><polygon points="1070,540 1210,540 1238,510 1098,510" fill="#c1d0d9" stroke="#193651" stroke-width="3"/><rect x="1070" y="540" width="140" height="130" rx="0" fill="url(#metal)" stroke="#193651" stroke-width="3"/><rect x="1070" y="500" width="140" height="40" rx="0" fill="#d5a448" stroke="#193651" stroke-width="3"/><line x1="45" y1="765" x2="1355" y2="765" stroke="#cbd8dd" stroke-width="2" /><text x="50.00" y="806" font-size="26" fill="#193651" font-weight="normal" font-family="Noto Sans CJK JP">無電解は化学反応を利用する。</text><text x="50.00" y="839" font-size="26" fill="#193651" font-weight="normal" font-family="Noto Sans CJK JP">PVDは物理的堆積、CVDは化学反応を利用する。</text><text x="50.00" y="872" font-size="26" fill="#193651" font-weight="normal" font-family="Noto Sans CJK JP">方式が違えば管理条件と危険も違う。</text></svg>
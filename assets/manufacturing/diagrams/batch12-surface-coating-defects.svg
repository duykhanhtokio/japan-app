<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="100%" height="100%" rx="20" fill="#fff8e8"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#26364c"/></marker></defs><g font-family="Noto Serif CJK JP,serif" fill="#26364c"><text x="34" y="52" font-size="31" font-weight="700">めっき皮膜の外観：断面を比べる模式例</text><rect x="25" y="115" width="375" height="475" rx="10" fill="#e7edf4"/><text x="210" y="165" font-size="27" font-weight="700" text-anchor="middle">ピンホール</text><rect x="55" y="350" width="315" height="125" rx="10" fill="#c5ae86"/><rect x="55" y="275" width="315" height="75" rx="10" fill="#6ca9bb"/><text x="210" y="530" font-size="19" font-weight="400" text-anchor="middle">皮膜を貫く穴</text><path d="M200 275H220V350H200Z" stroke="#fff8e8" stroke-width="1" fill="#fff8e8"/><rect x="420" y="115" width="375" height="475" rx="10" fill="#e7edf4"/><text x="605" y="165" font-size="27" font-weight="700" text-anchor="middle">ピット</text><rect x="450" y="350" width="315" height="125" rx="10" fill="#c5ae86"/><rect x="450" y="275" width="315" height="75" rx="10" fill="#6ca9bb"/><text x="605" y="530" font-size="19" font-weight="400" text-anchor="middle">この例では皮膜途中までのくぼみ</text><path d="M576 275L605 320L634 275Z" stroke="#fff8e8" stroke-width="1" fill="#fff8e8"/><rect x="815" y="115" width="375" height="475" rx="10" fill="#e7edf4"/><text x="1000" y="165" font-size="27" font-weight="700" text-anchor="middle">ふくれ</text><rect x="845" y="350" width="315" height="125" rx="10" fill="#c5ae86"/><rect x="845" y="275" width="315" height="75" rx="10" fill="#6ca9bb"/><text x="1000" y="530" font-size="19" font-weight="400" text-anchor="middle">皮膜が局部的に浮いた例</text><path d="M920 350Q1000 175 1080 350Z" stroke="#fff8e8" stroke-width="1" fill="#fff8e8"/><path d="M920 275Q1000 100 1080 275V350Q1000 175 920 350Z" stroke="#6ca9bb" stroke-width="1" fill="#6ca9bb"/><text x="45" y="640" font-size="23" font-weight="400">青：皮膜　／　茶：素地　／　明るい部分：穴・すき間を表す模式表示</text><text x="45" y="692" font-size="21" font-weight="400">寸法・深さは実寸ではない。実際の分類と合否は適用規格・限度見本で確認する。</text></g></svg>
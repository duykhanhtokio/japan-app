<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
<rect width="960" height="600" rx="20" fill="#fff8e8"/>
<defs><marker id="placement-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#707d8b"/></marker></defs>
<g font-family="Noto Sans CJK JP,sans-serif" fill="#26364c">
<text x="48" y="57" font-size="30" font-weight="700">第三角法：見る方向と図の配置</text>
<text x="48" y="100" font-size="20">最初に正面図と、図面の投影法の指示を確認する。</text>
<rect x="325" y="135" width="250" height="125" rx="14" fill="#dcebe4" stroke="#287b72" stroke-width="3"/>
<text x="450" y="184" text-anchor="middle" font-size="26" font-weight="700">平面図</text>
<text x="450" y="226" text-anchor="middle" font-size="23">上から見た図</text>
<path d="M450 318V278" stroke="#707d8b" stroke-width="3" marker-end="url(#placement-arrow)"/>
<text x="473" y="305" font-size="18">上に配置</text>
<rect x="325" y="335" width="250" height="125" rx="14" fill="#e4e9f0" stroke="#426187" stroke-width="3"/>
<text x="450" y="384" text-anchor="middle" font-size="26" font-weight="700">正面図</text>
<text x="450" y="426" text-anchor="middle" font-size="23">配置の基準</text>
<path d="M590 398H644" stroke="#707d8b" stroke-width="3" marker-end="url(#placement-arrow)"/>
<text x="616" y="375" text-anchor="middle" font-size="17">右に配置</text>
<rect x="665" y="335" width="250" height="125" rx="14" fill="#f3dfbc" stroke="#a66c30" stroke-width="3"/>
<text x="790" y="384" text-anchor="middle" font-size="26" font-weight="700">右側面図</text>
<text x="790" y="426" text-anchor="middle" font-size="23">右から見た図</text>
<rect x="48" y="335" width="220" height="125" rx="14" fill="#f4eedf"/>
<text x="67" y="373" font-size="20">矢印は図の配置関係。</text>
<text x="67" y="407" font-size="20">視線の向きではない。</text>
<text x="48" y="522" font-size="21">配置関係だけの模式図。部品の形状・寸法は示していない。</text>
<text x="48" y="562" font-size="21">見る方向の名前と、紙上の図の位置を対応させる。</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400"><rect width="1400" height="1400" fill="#fff8e8"/><g font-family="Noto Serif JP,Noto Serif CJK JP,serif" fill="#26364c"><text x="40" y="57" font-size="37" font-weight="700" fill="#26364c">ノギス：部位と測定面の役割を分けて見る</text><text x="40" y="105" font-size="25" font-weight="400" fill="#26364c">デプスバーのある器具の独自模式例。実寸・目盛り・操作手順は示していません。</text><rect x="30" y="145" width="655" height="535" rx="16" fill="#f1f0e6" stroke="#c9c5b6" stroke-width="3"/><text x="52" y="191" font-size="30" font-weight="700" fill="#26364c">① 本尺とスライダの関係</text><rect x="715" y="145" width="655" height="535" rx="16" fill="#f1f0e6" stroke="#c9c5b6" stroke-width="3"/><text x="737" y="191" font-size="30" font-weight="700" fill="#26364c">② 外側の測定面</text><rect x="30" y="710" width="655" height="535" rx="16" fill="#f1f0e6" stroke="#c9c5b6" stroke-width="3"/><text x="52" y="756" font-size="30" font-weight="700" fill="#26364c">③ 内側の測定面</text><rect x="715" y="710" width="655" height="535" rx="16" fill="#f1f0e6" stroke="#c9c5b6" stroke-width="3"/><text x="737" y="756" font-size="30" font-weight="700" fill="#26364c">④ 深さの測定面</text><rect x="130" y="355" width="485" height="30" rx="0" fill="#dfe7ee" stroke="#26364c" stroke-width="3"/><rect x="130" y="385" width="30" height="120" rx="0" fill="#dfe7ee" stroke="#26364c" stroke-width="3"/><rect x="295" y="340" width="80" height="60" rx="0" fill="#d6e8df" stroke="#287b72" stroke-width="3"/><rect x="310" y="400" width="30" height="105" rx="0" fill="#d6e8df" stroke="#287b72" stroke-width="3"/><path d="M130 355V302L148 327V355Z" fill="#dfe7ee" stroke="#26364c" stroke-width="3"/><path d="M310 340V322L328 297V340Z" fill="#d6e8df" stroke="#287b72" stroke-width="3"/><rect x="615" y="369" width="42" height="5" rx="0" fill="#26364c" stroke="#26364c" stroke-width="1"/><text x="255" y="261" font-size="25" font-weight="700" fill="#287b72">スライダ</text><line x1="332" y1="275" x2="332" y2="337" stroke="#287b72" stroke-width="2"/><text x="445" y="300" font-size="25" font-weight="700" fill="#26364c">デプスバー</text><line x1="592" y1="311" x2="635" y2="367" stroke="#26364c" stroke-width="2"/><text x="450" y="460" font-size="25" font-weight="700" fill="#426b91">本尺</text><line x1="480" y1="435" x2="480" y2="388" stroke="#426b91" stroke-width="2"/><text x="60" y="564" font-size="25" font-weight="700" fill="#426b91">固定ジョウ</text><line x1="145" y1="538" x2="145" y2="509" stroke="#426b91" stroke-width="2"/><text x="275" y="564" font-size="25" font-weight="700" fill="#287b72">測定ジョウ</text><line x1="325" y1="538" x2="325" y2="509" stroke="#287b72" stroke-width="2"/><text x="55" y="630" font-size="24" font-weight="400" fill="#26364c">固定側と、スライダ側の部位を対応させる。</text><rect x="815" y="355" width="485" height="30" rx="0" fill="#dfe7ee" stroke="#26364c" stroke-width="3"/><rect x="815" y="385" width="30" height="120" rx="0" fill="#dfe7ee" stroke="#26364c" stroke-width="3"/><rect x="980" y="340" width="80" height="60" rx="0" fill="#d6e8df" stroke="#287b72" stroke-width="3"/><rect x="995" y="400" width="30" height="105" rx="0" fill="#d6e8df" stroke="#287b72" stroke-width="3"/><rect x="845" y="421" width="150" height="60" rx="0" fill="#eadfc7" stroke="#8d7657" stroke-width="3"/><line x1="845" y1="421" x2="845" y2="481" stroke="#b45828" stroke-width="6"/><line x1="995" y1="421" x2="995" y2="481" stroke="#b45828" stroke-width="6"/><text x="1075" y="461" font-size="26" font-weight="700" fill="#26364c">工作物</text><line x1="1062" y1="451" x2="998" y2="451" stroke="#26364c" stroke-width="2"/><text x="762" y="562" font-size="25" font-weight="700" fill="#b45828">外側用測定面</text><line x1="848" y1="532" x2="846" y2="484" stroke="#b45828" stroke-width="2"/><line x1="948" y1="532" x2="993" y2="484" stroke="#b45828" stroke-width="2"/><text x="740" y="630" font-size="24" font-weight="400" fill="#26364c">工作物の外側の、向かい合う二面に接する。</text><rect x="115" y="884" width="95" height="136" rx="0" fill="#eadfc7" stroke="#8d7657" stroke-width="3"/><rect x="440" y="884" width="95" height="136" rx="0" fill="#eadfc7" stroke="#8d7657" stroke-width="3"/><rect x="205" y="1060" width="390" height="30" rx="0" fill="#dfe7ee" stroke="#26364c" stroke-width="3"/><rect x="400" y="1045" width="75" height="60" rx="0" fill="#d6e8df" stroke="#287b72" stroke-width="3"/><path d="M210 1060V946L235 977V1060Z" fill="#dfe7ee" stroke="#26364c" stroke-width="3"/><path d="M415 1045V977L440 946V1045Z" fill="#d6e8df" stroke="#287b72" stroke-width="3"/><line x1="210" y1="950" x2="210" y2="999" stroke="#b45828" stroke-width="6"/><line x1="440" y1="950" x2="440" y2="999" stroke="#b45828" stroke-width="6"/><text x="190" y="843" font-size="25" font-weight="700" fill="#26364c">穴・溝の向かい合う内側面</text><line x1="205" y1="858" x2="210" y2="882" stroke="#26364c" stroke-width="2"/><line x1="460" y1="858" x2="440" y2="882" stroke="#26364c" stroke-width="2"/><text x="100" y="1145" font-size="25" font-weight="700" fill="#b45828">内側用測定面</text><line x1="184" y1="1115" x2="210" y2="1003" stroke="#b45828" stroke-width="2"/><line x1="288" y1="1115" x2="440" y2="1003" stroke="#b45828" stroke-width="2"/><text x="55" y="1195" font-size="24" font-weight="400" fill="#26364c">小さいジョウの、外を向く測定面を区別する。</text><rect x="805" y="1010" width="490" height="160" rx="0" fill="#eadfc7" stroke="#8d7657" stroke-width="3"/><path d="M985 1010V1135H1165V1010" fill="#f1f0e6" stroke="#8d7657" stroke-width="3"/><rect x="945" y="846" width="60" height="164" rx="0" fill="#dfe7ee" stroke="#26364c" stroke-width="3"/><rect x="930" y="875" width="90" height="48" rx="0" fill="#d6e8df" stroke="#287b72" stroke-width="3"/><rect x="992" y="1010" width="6" height="125" rx="0" fill="#26364c" stroke="#26364c" stroke-width="1"/><line x1="945" y1="1010" x2="984" y2="1010" stroke="#b45828" stroke-width="6"/><line x1="992" y1="1135" x2="998" y2="1135" stroke="#b45828" stroke-width="6"/><circle cx="995" cy="1135" r="5" fill="#b45828"/><text x="1075" y="928" font-size="25" font-weight="700" fill="#26364c">デプスバー</text><line x1="1067" y1="941" x2="999" y2="1059" stroke="#26364c" stroke-width="2"/><text x="738" y="969" font-size="25" font-weight="700" fill="#b45828">基準となる端面</text><line x1="914" y1="981" x2="959" y2="1007" stroke="#b45828" stroke-width="2"/><text x="1070" y="1146" font-size="25" font-weight="700" fill="#b45828">底に当たる先端</text><line x1="1060" y1="1139" x2="1002" y2="1135" stroke="#b45828" stroke-width="2"/><text x="740" y="1195" font-size="24" font-weight="400" fill="#26364c">基準となる端面と、底の当たりを区別する。</text><text x="40" y="1303" font-size="27" font-weight="700" fill="#26364c">赤は当たりを示す補助色。実寸・読み値・合否を指定する図ではありません。</text><text x="40" y="1351" font-size="25" font-weight="400" fill="#26364c">実際には器具の仕様と指定された測定方法を確認し、動いている対象を測定しない。</text></g></svg>
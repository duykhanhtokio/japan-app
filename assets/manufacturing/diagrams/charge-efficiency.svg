<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" rx="20" fill="#fff8e8"/><g font-family="Noto Sans CJK JP,sans-serif" fill="#26364c"><text x="48" y="58" font-size="30" font-weight="700">電気量と電流効率を区別する</text><text x="48" y="100" font-size="20">同じ反応を仮定した計算の関係。実際の浴の運転条件ではありません。</text>
<rect x="48" y="140" width="864" height="130" rx="14" fill="#e1ebde"/><text x="75" y="182" font-size="25" font-weight="700">電気量 Q（C）</text><text x="75" y="232" font-size="27">Q = I（A）× t（s）</text><text x="485" y="232" font-size="22">時間は秒にそろえる。</text>
<rect x="48" y="305" width="864" height="145" rx="14" fill="#e4e9f0"/><text x="75" y="350" font-size="25" font-weight="700">電流効率（%）</text><text x="75" y="405" font-size="24">実際の析出量 ÷ 理論上の析出量 × 100</text>
<text x="48" y="505" font-size="21">流れた電流のすべてが、目的の析出に使われるとは限らない。</text><text x="48" y="550" font-size="21">物質・反応・単位など、計算の前提を確認する。</text></g></svg>
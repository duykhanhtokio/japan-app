<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect width="1400" height="1000" fill="#fff8e8"/><g font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" fill="#26364c"><text x="50" y="70" font-size="39" font-weight="700" fill="#26364c">ビッカース圧痕：四角形と二本の対角線</text><text x="50" y="120" font-size="24" font-weight="400" fill="#26364c">上から見た形の読み方。細長いヌープ圧痕とは区別します。</text><rect x="80" y="200" width="790" height="570" rx="12" fill="#e9f0f5" stroke="#426b91" stroke-width="3"/><path d="M475 265 L685 475 L475 685 L265 475 Z" fill="#f5f1dd" stroke="#26364c" stroke-width="6"/><line x1="475" y1="265" x2="475" y2="685" stroke="#287b72" stroke-width="5"/><line x1="265" y1="475" x2="685" y2="475" stroke="#b45828" stroke-width="5"/><circle cx="475" cy="475" r="7" fill="#26364c" stroke="#26364c" stroke-width="3"/><text x="500" y="360" font-size="30" font-weight="700" fill="#287b72">対角線 1</text><text x="530" y="530" font-size="30" font-weight="700" fill="#b45828">対角線 2</text><text x="920" y="315" font-size="32" font-weight="700" fill="#26364c">向かい合う</text><text x="920" y="365" font-size="32" font-weight="700" fill="#26364c">頂点を結ぶ</text><line x1="940" y1="410" x2="695" y2="475" stroke="#26364c" stroke-width="3" marker-end="url(#arrow)"/><text x="920" y="555" font-size="29" font-weight="400" fill="#26364c">正方形を回して</text><text x="920" y="600" font-size="29" font-weight="400" fill="#26364c">示した模式形</text><text x="920" y="675" font-size="28" font-weight="700" fill="#26364c">数値目盛りなし</text><line x1="50" y1="830" x2="1350" y2="830" stroke="#c9c5b6" stroke-width="2"/><text x="55" y="880" font-size="24" font-weight="400" fill="#26364c">二本の線は圧痕の二つの対角線を表します。図の長さは実寸ではありません。</text><text x="55" y="922" font-size="24" font-weight="400" fill="#26364c">硬さの計算値、試験荷重、皮膜厚さ、測定条件や合否基準を指定しません。</text></g></svg>
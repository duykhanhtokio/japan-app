<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect width="1400" height="1000" fill="#fff8e8"/><g font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" fill="#26364c"><text x="50" y="70" font-size="39" font-weight="700" fill="#26364c">ホール効果：三つの方向を区別する</text><text x="50" y="120" font-size="24" font-weight="400" fill="#26364c">平面内の電流と電圧の方向、紙面に垂直な磁界の関係を示します。</text><rect x="280" y="280" width="840" height="360" rx="0" fill="#e9f0f5" stroke="#426b91" stroke-width="3"/><circle cx="450" cy="360" r="23" fill="#fff8e8" stroke="#287b72" stroke-width="3"/><circle cx="450" cy="360" r="4" fill="#287b72" stroke="#287b72" stroke-width="2"/><circle cx="450" cy="560" r="23" fill="#fff8e8" stroke="#287b72" stroke-width="3"/><circle cx="450" cy="560" r="4" fill="#287b72" stroke="#287b72" stroke-width="2"/><circle cx="700" cy="360" r="23" fill="#fff8e8" stroke="#287b72" stroke-width="3"/><circle cx="700" cy="360" r="4" fill="#287b72" stroke="#287b72" stroke-width="2"/><circle cx="700" cy="560" r="23" fill="#fff8e8" stroke="#287b72" stroke-width="3"/><circle cx="700" cy="560" r="4" fill="#287b72" stroke="#287b72" stroke-width="2"/><circle cx="950" cy="360" r="23" fill="#fff8e8" stroke="#287b72" stroke-width="3"/><circle cx="950" cy="360" r="4" fill="#287b72" stroke="#287b72" stroke-width="2"/><circle cx="950" cy="560" r="23" fill="#fff8e8" stroke="#287b72" stroke-width="3"/><circle cx="950" cy="560" r="4" fill="#287b72" stroke="#287b72" stroke-width="2"/><line x1="100" y1="460" x2="1300" y2="460" stroke="#b45828" stroke-width="7" marker-end="url(#arrow)"/><text x="1180" y="415" font-size="32" font-weight="700" fill="#b45828">電流 I</text><line x1="700" y1="220" x2="700" y2="700" stroke="#426b91" stroke-width="7" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="750" y="215" font-size="29" font-weight="700" fill="#426b91">ホール電圧の方向</text><text x="750" y="260" font-size="24" font-weight="400" fill="#426b91">（正負を指定しない）</text><circle cx="165" cy="735" r="22" fill="#fff8e8" stroke="#287b72" stroke-width="3"/><circle cx="165" cy="735" r="4" fill="#287b72" stroke="#287b72" stroke-width="2"/><text x="205" y="746" font-size="28" font-weight="700" fill="#287b72">磁界 B：紙面から手前へ</text><text x="760" y="735" font-size="28" font-weight="700" fill="#26364c" text-anchor="middle">I ⟂ B    ／    電圧の方向 ⟂ I・B</text><line x1="50" y1="830" x2="1350" y2="830" stroke="#c9c5b6" stroke-width="2"/><text x="55" y="880" font-size="24" font-weight="400" fill="#26364c">丸と点は紙面から手前への方向を表します。三方向の直交関係だけの図です。</text><text x="55" y="922" font-size="24" font-weight="400" fill="#26364c">電圧の正負、電子・正孔の別、実際のセンサー端子や配線を決める図ではありません。</text></g></svg>
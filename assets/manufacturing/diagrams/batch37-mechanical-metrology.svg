<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="13" height="13"><path d="M-3 3L3-3M0 13L13 0M10 16L16 10" stroke="#78918d" stroke-width="2"/></pattern><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="1600" height="1200" fill="#fff9eb"/><g font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif" fill="#24384a"><text x="50" y="62" font-size="38" font-weight="700" fill="#24384a">測定：形・基準・一目盛を対応させる</text><text x="50" y="107" font-size="23" font-weight="400" fill="#24384a">Vブロック、ねじ式、比較式、限界ゲージを別々の概念として読みます。</text><rect x="45" y="145" width="740" height="445" rx="10" fill="#f9fbf5" stroke="#becac3" stroke-width="2"/><text x="65" y="183" font-size="28" font-weight="700" fill="#30698a">Vブロック：90°はこの例の溝角</text><path d="M125 495L125 315L225 315L325 415L425 315L525 315L525 495Z" fill="#e4ecea" stroke="#30698a" stroke-width="4"/><circle cx="325" cy="315" r="70.71" fill="#f5e7c8" stroke="#a9562a" stroke-width="4"/><line x1="325" y1="415" x2="325" y2="315" stroke="#839990" stroke-width="2" stroke-dasharray="7 5"/><path d="M305 395L325 375L345 395" fill="none" stroke="#277b66" stroke-width="3"/><text x="560" y="315" font-size="28" font-weight="700" fill="#a9562a">円筒</text><line x1="560" y1="325" x2="395" y2="315" stroke="#a9562a" stroke-width="3" marker-end="url(#arr)"/><text x="115" y="548" font-size="24" font-weight="400" fill="#24384a">角度・保持・接触は器具ごとに確認</text><rect x="815" y="145" width="740" height="445" rx="10" fill="#f9fbf5" stroke="#becac3" stroke-width="2"/><text x="835" y="183" font-size="28" font-weight="700" fill="#30698a">マイクロメータ：二つの読みを加える</text><path d="M970 285L920 285C875 285 870 455 970 455L1060 455C1110 455 1110 350 1110 330" fill="none" stroke="#30698a" stroke-width="17"/><rect x="960" y="270" width="25" height="55" rx="0" fill="#cbd6d7" stroke="#30698a" stroke-width="2"/><line x1="985" y1="297" x2="1075" y2="297" stroke="#24384a" stroke-width="3" stroke-dasharray="6 4"/><rect x="1075" y="280" width="195" height="34" rx="0" fill="#dbe6dc" stroke="#277b66" stroke-width="2"/><rect x="1200" y="260" width="115" height="75" rx="0" fill="#dbe6dc" stroke="#277b66" stroke-width="3"/><rect x="1315" y="279" width="70" height="38" rx="4" fill="#e4d7bf" stroke="#a9562a" stroke-width="2"/><line x1="1210" y1="268" x2="1210" y2="282" stroke="#277b66" stroke-width="2"/><line x1="1222" y1="268" x2="1222" y2="282" stroke="#277b66" stroke-width="2"/><line x1="1234" y1="268" x2="1234" y2="282" stroke="#277b66" stroke-width="2"/><line x1="1246" y1="268" x2="1246" y2="282" stroke="#277b66" stroke-width="2"/><line x1="1258" y1="268" x2="1258" y2="282" stroke="#277b66" stroke-width="2"/><line x1="1270" y1="268" x2="1270" y2="282" stroke="#277b66" stroke-width="2"/><line x1="1282" y1="268" x2="1282" y2="282" stroke="#277b66" stroke-width="2"/><line x1="1294" y1="268" x2="1294" y2="282" stroke="#277b66" stroke-width="2"/><text x="855" y="235" font-size="23" font-weight="700" fill="#30698a">固定：アンビル</text><line x1="975" y1="240" x2="972" y2="270" stroke="#30698a" stroke-width="2"/><text x="1110" y="385" font-size="23" font-weight="700" fill="#277b66">可動：スピンドル</text><line x1="1150" y1="355" x2="1130" y2="315" stroke="#277b66" stroke-width="2"/><text x="850" y="505" font-size="29" font-weight="700" fill="#24384a">例：14.5 + 0.23 = 14.73 mm</text><text x="850" y="550" font-size="24" font-weight="400" fill="#24384a">0.5/50 = 1/100 = 0.01 mm／一目盛</text><rect x="45" y="620" width="740" height="475" rx="10" fill="#f9fbf5" stroke="#becac3" stroke-width="2"/><text x="65" y="658" font-size="28" font-weight="700" fill="#30698a">比較測定：形と基準から読む</text><circle cx="170" cy="775" r="60" fill="#edf3f0" stroke="#30698a" stroke-width="4"/><line x1="170" y1="775" x2="145" y2="745" stroke="#a9562a" stroke-width="4"/><circle cx="170" cy="775" r="5" fill="#24384a" stroke="#24384a" stroke-width="3"/><circle cx="385" cy="775" r="60" fill="#edf3f0" stroke="#30698a" stroke-width="4"/><line x1="385" y1="775" x2="360" y2="745" stroke="#a9562a" stroke-width="4"/><circle cx="385" cy="775" r="5" fill="#24384a" stroke="#24384a" stroke-width="3"/><circle cx="600" cy="775" r="60" fill="#edf3f0" stroke="#30698a" stroke-width="4"/><line x1="600" y1="775" x2="575" y2="745" stroke="#a9562a" stroke-width="4"/><circle cx="600" cy="775" r="5" fill="#24384a" stroke="#24384a" stroke-width="3"/><rect x="156" y="837" width="28" height="68" rx="0" fill="#e0e8e5" stroke="#30698a" stroke-width="2"/><circle cx="170" cy="916" r="12" fill="#e0e8e5" stroke="#30698a" stroke-width="2"/><text x="100" y="968" font-size="24" font-weight="700" fill="#24384a">直動式</text><line x1="385" y1="837" x2="420" y2="900" stroke="#277b66" stroke-width="7"/><circle cx="420" cy="900" r="10" fill="#e0e8e5" stroke="#277b66" stroke-width="2"/><text x="310" y="968" font-size="24" font-weight="700" fill="#24384a">てこ式</text><line x1="600" y1="837" x2="600" y2="900" stroke="#277b66" stroke-width="7"/><line x1="558" y1="900" x2="642" y2="900" stroke="#277b66" stroke-width="7"/><circle cx="600" cy="900" r="77" fill="none" stroke="#a9562a" stroke-width="3"/><text x="530" y="1008" font-size="24" font-weight="700" fill="#24384a">内径比較</text><text x="80" y="1060" font-size="25" font-weight="700" fill="#24384a">基準 30.000 mm − 0.012 mm = 29.988 mm</text><rect x="815" y="620" width="740" height="475" rx="10" fill="#f9fbf5" stroke="#becac3" stroke-width="2"/><text x="835" y="658" font-size="28" font-weight="700" fill="#30698a">限界ゲージ：通り／止りの条件は別に確認</text><rect x="870" y="770" width="245" height="40" rx="2" fill="#e5ece4" stroke="#277b66" stroke-width="3"/><rect x="870" y="735" width="45" height="110" rx="2" fill="#dbe5dd" stroke="#277b66" stroke-width="3"/><rect x="1070" y="745" width="45" height="90" rx="2" fill="#dbe5dd" stroke="#277b66" stroke-width="3"/><text x="870" y="900" font-size="24" font-weight="700" fill="#24384a">プラグ：穴側の判定</text><circle cx="1325" cy="790" r="75" fill="#e4eada" stroke="#30698a" stroke-width="4"/><circle cx="1325" cy="790" r="35" fill="#fff9eb" stroke="#30698a" stroke-width="4"/><text x="1225" y="900" font-size="24" font-weight="700" fill="#24384a">リング</text><path d="M960 970L960 1035L1110 1035L1110 970" fill="none" stroke="#30698a" stroke-width="16"/><text x="1160" y="1010" font-size="24" font-weight="700" fill="#24384a">挟みゲージ</text><text x="850" y="1070" font-size="24" font-weight="400" fill="#24384a">実測値を表示する器具とは区別する</text><text x="50" y="1145" font-size="24" font-weight="400" fill="#24384a">独立した概念図。実寸・操作・判定条件や現行規格への適合を示しません。</text><text x="50" y="1180" font-size="22" font-weight="400" fill="#24384a">実物では機種・図面の版・指定された測定／加工条件を確認します。</text></g></svg>
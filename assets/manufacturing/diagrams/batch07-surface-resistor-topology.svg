<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b45828"/></marker></defs>
<rect width="1280" height="800" rx="24" fill="#fff8e8"/>
<g font-family="Noto Sans CJK JP,sans-serif" fill="#26364c">
<text x="44" y="55" font-size="31" font-weight="700">接続点と数値で確かめる：電流・電圧の収支</text>
<text x="44" y="96" font-size="21">紙上の理想抵抗・直流電源の演習例　｜　実設備の配線・設定の指示ではありません</text>
<rect x="36" y="126" width="588" height="568" rx="18" fill="#e1ebde"/>
<rect x="656" y="126" width="588" height="568" rx="18" fill="#e4e9f0"/>
<text x="62" y="172" font-size="27" font-weight="700">直列：24 V、4 Ω ＋ 8 Ω</text>
<text x="62" y="211" font-size="21">同じ電流 2 A が二つの抵抗を通る</text>
<g stroke="#287b72" stroke-width="5" fill="none"><path d="M96 342H174M284 342H378M488 342H574"/><rect x="174" y="318" width="110" height="48" fill="#fff8e8"/><rect x="378" y="318" width="110" height="48" fill="#fff8e8"/></g>
<circle cx="96" cy="342" r="7" fill="#287b72"/><circle cx="574" cy="342" r="7" fill="#287b72"/>
<text x="79" y="385" font-size="25">＋</text><text x="558" y="385" font-size="25">−</text>
<text x="201" y="307" font-size="25">4 Ω</text><text x="405" y="307" font-size="25">8 Ω</text>
<path d="M175 263H483" stroke="#b45828" stroke-width="4" marker-end="url(#arrow)"/>
<text x="302" y="251" font-size="23" fill="#9d4c23">2 A</text>
<text x="190" y="412" font-size="23">8 V</text><text x="391" y="412" font-size="23">16 V</text>
<text x="76" y="469" font-size="23">両端の電圧：24 V = 8 V + 16 V</text>
<text x="62" y="535" font-size="24">R = 4 + 8 = 12 Ω</text>
<text x="62" y="578" font-size="24">I = 24 ÷ 12 = 2 A</text>
<text x="62" y="624" font-size="21">各抵抗の電圧：4 × 2 = 8 V</text>
<text x="245" y="661" font-size="21">8 × 2 = 16 V</text>
<text x="682" y="172" font-size="27" font-weight="700">並列：6 V、6 Ω と 3 Ω</text>
<text x="682" y="211" font-size="21">二つの枝は同じ接続点 A・B の間</text>
<g stroke="#426b91" stroke-width="5" fill="none"><path d="M704 357H792V283H914M1024 283H1144V431H1024M914 431H792V357M1144 357H1204"/><rect x="914" y="259" width="110" height="48" fill="#fff8e8"/><rect x="914" y="407" width="110" height="48" fill="#fff8e8"/></g>
<g fill="#426b91"><circle cx="792" cy="357" r="7"/><circle cx="1144" cy="357" r="7"/><circle cx="704" cy="357" r="7"/><circle cx="1204" cy="357" r="7"/></g>
<text x="775" y="391" font-size="21">A</text><text x="1128" y="391" font-size="21">B</text>
<text x="686" y="402" font-size="25">＋</text><text x="1188" y="402" font-size="25">−</text>
<text x="940" y="247" font-size="23">6 Ω</text><text x="940" y="397" font-size="23">3 Ω</text>
<path d="M816 242H879" stroke="#b45828" stroke-width="4" marker-end="url(#arrow)"/>
<text x="809" y="231" font-size="20" fill="#9d4c23">1 A</text>
<path d="M816 472H879" stroke="#b45828" stroke-width="4" marker-end="url(#arrow)"/>
<text x="809" y="502" font-size="20" fill="#9d4c23">2 A</text>
<text x="1038" y="328" font-size="19">各枝 6 V</text>
<text x="682" y="541" font-size="23">I₁ = 6 ÷ 6 = 1 A</text>
<text x="682" y="580" font-size="23">I₂ = 6 ÷ 3 = 2 A</text>
<text x="682" y="619" font-size="23">全電流：1 + 2 = 3 A</text>
<text x="682" y="661" font-size="23">R = (6 × 3) ÷ (6 + 3) = 2 Ω</text>
<text x="44" y="741" font-size="22">直列：電圧降下の和を確認　／　並列：分岐する電流の和を確認</text>
<text x="44" y="777" font-size="19">＋・−は理想電源を加える両端の極性を示します。矢印は慣用電流の向きです。</text>
</g></svg>
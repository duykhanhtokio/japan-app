<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" rx="20" fill="#fff8e8"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#26364c"><text x="50" y="62" font-size="30" font-weight="700">抵抗が変わると、電流はどう変わる？</text><text x="50" y="105" font-size="20">抵抗が一定の範囲で成り立つオームの法則</text><path d="M140 450V160M140 450H720" stroke="#26364c" fill="none" stroke-width="4"/><text x="60" y="175" font-size="23">I [A]</text><text x="730" y="460" font-size="23">V [V]</text><text x="110" y="480" font-size="18">0</text><path d="M140 450L640 200" stroke="#287b72" stroke-width="6"/><path d="M140 450L640 325" stroke="#b36d39" stroke-width="6"/><text x="660" y="205" font-size="22" fill="#287b72">小さい R</text><text x="660" y="330" font-size="22" fill="#b36d39">大きい R</text><path d="M540 450V250" stroke="#88909b" stroke-width="2" stroke-dasharray="8 6"/><circle cx="540" cy="250" r="7" fill="#287b72"/><circle cx="540" cy="350" r="7" fill="#b36d39"/><text x="510" y="485" font-size="18">同じ電圧</text><rect x="130" y="520" width="700" height="48" rx="10" fill="#e1ebde"/><text x="160" y="552" font-size="23">I = V ÷ R　　同じ電圧なら、抵抗が大きいほど電流は小さい。</text></g></svg>
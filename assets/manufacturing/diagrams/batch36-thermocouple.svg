<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect width="1400" height="1000" fill="#fff8e8"/><g font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" fill="#26364c"><text x="50" y="70" font-size="39" font-weight="700" fill="#26364c">熱電対：異なる金属と二つの温度</text><text x="50" y="120" font-size="24" font-weight="400" fill="#26364c">温度差に関係する熱起電力を利用する、原理の概念図です。</text><rect x="70" y="220" width="290" height="420" rx="12" fill="#e6f0e8" stroke="#287b72" stroke-width="3"/><text x="215" y="285" font-size="34" font-weight="700" fill="#287b72" text-anchor="middle">計測側</text><text x="215" y="350" font-size="33" font-weight="700" fill="#26364c" text-anchor="middle">温度 T1</text><rect x="1000" y="220" width="330" height="420" rx="12" fill="#e9f0f5" stroke="#426b91" stroke-width="3"/><text x="1165" y="285" font-size="34" font-weight="700" fill="#426b91" text-anchor="middle">計器側</text><text x="1165" y="350" font-size="33" font-weight="700" fill="#26364c" text-anchor="middle">温度 T2</text><path d="M260 440 L450 390 L1000 390" fill="none" stroke="#b45828" stroke-width="7"/><path d="M260 440 L450 550 L1000 550" fill="none" stroke="#426b91" stroke-width="7"/><circle cx="260" cy="440" r="10" fill="#26364c" stroke="#26364c" stroke-width="3"/><circle cx="1000" cy="390" r="10" fill="#fff8e8" stroke="#b45828" stroke-width="3"/><circle cx="1000" cy="550" r="10" fill="#fff8e8" stroke="#426b91" stroke-width="3"/><text x="630" y="355" font-size="33" font-weight="700" fill="#b45828" text-anchor="middle">金属 A</text><text x="630" y="605" font-size="33" font-weight="700" fill="#426b91" text-anchor="middle">金属 B</text><line x1="1120" y1="400" x2="1120" y2="540" stroke="#287b72" stroke-width="5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="1165" y="490" font-size="25" font-weight="700" fill="#287b72">熱起電力</text><text x="700" y="735" font-size="29" font-weight="700" fill="#26364c" text-anchor="middle">接点の温度だけでなく、計器側の基準の扱いも関係する</text><line x1="50" y1="830" x2="1350" y2="830" stroke="#c9c5b6" stroke-width="2"/><text x="55" y="880" font-size="24" font-weight="400" fill="#26364c">A・Bは異なる金属を表す記号です。熱起電力の正負は指定していません。</text><text x="55" y="922" font-size="24" font-weight="400" fill="#26364c">基準接点補償の回路、極性、実配線、使用温度範囲や操作手順は示しません。</text></g></svg>
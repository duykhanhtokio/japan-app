<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect width="1400" height="1100" fill="#fff8e8"/><g font-family="Noto Serif JP,Noto Serif CJK JP,serif" fill="#26364c"><text x="40" y="57" font-size="38" font-weight="700" fill="#26364c">電流と電圧：測る量と接続を区別する</text><text x="40" y="105" font-size="26" font-weight="400" fill="#26364c">回路の一部を示す独自概念図。実機の端子・配線・接続手順ではありません。</text><rect x="30" y="145" width="655" height="760" rx="16" fill="#f1f0e6" stroke="#c9c5b6" stroke-width="3"/><text x="52" y="196" font-size="30" font-weight="700" fill="#426b91">電流計 A：対象の枝路に直列</text><rect x="715" y="145" width="655" height="760" rx="16" fill="#f1f0e6" stroke="#c9c5b6" stroke-width="3"/><text x="737" y="196" font-size="30" font-weight="700" fill="#287b72">電圧計 V：対象の二点間に並列</text><text x="248" y="256" font-size="25" font-weight="400" fill="#26364c">回路の続きへ</text><line x1="355" y1="275" x2="355" y2="332" stroke="#426b91" stroke-width="4"/><circle cx="355" cy="375" r="43" fill="#fffdf7" stroke="#426b91" stroke-width="4"/><text x="335" y="391" font-size="46" font-weight="700" fill="#426b91">A</text><line x1="355" y1="418" x2="355" y2="485" stroke="#426b91" stroke-width="4"/><rect x="290" y="485" width="130" height="100" rx="0" fill="#e7edf4" stroke="#26364c" stroke-width="3"/><text x="324" y="546" font-size="29" font-weight="700" fill="#26364c">負荷</text><line x1="355" y1="585" x2="355" y2="690" stroke="#426b91" stroke-width="4"/><text x="248" y="732" font-size="25" font-weight="400" fill="#26364c">回路の続きへ</text><text x="65" y="801" font-size="27" font-weight="700" fill="#426b91">負荷と電流計は同じ枝路上。</text><text x="65" y="851" font-size="26" font-weight="400" fill="#26364c">この枝路を流れる電流を測る。</text><text x="840" y="256" font-size="25" font-weight="400" fill="#26364c">回路の続きへ</text><line x1="950" y1="275" x2="950" y2="335" stroke="#26364c" stroke-width="4"/><line x1="950" y1="335" x2="950" y2="435" stroke="#26364c" stroke-width="4"/><rect x="885" y="435" width="130" height="100" rx="0" fill="#e7edf4" stroke="#26364c" stroke-width="3"/><text x="919" y="496" font-size="29" font-weight="700" fill="#26364c">負荷</text><line x1="950" y1="535" x2="950" y2="640" stroke="#26364c" stroke-width="4"/><line x1="950" y1="640" x2="950" y2="690" stroke="#26364c" stroke-width="4"/><line x1="950" y1="335" x2="1185" y2="335" stroke="#287b72" stroke-width="4"/><line x1="1185" y1="335" x2="1185" y2="442" stroke="#287b72" stroke-width="4"/><circle cx="1185" cy="485" r="43" fill="#fffdf7" stroke="#287b72" stroke-width="4"/><text x="1165" y="501" font-size="46" font-weight="700" fill="#287b72">V</text><line x1="1185" y1="528" x2="1185" y2="640" stroke="#287b72" stroke-width="4"/><line x1="1185" y1="640" x2="950" y2="640" stroke="#287b72" stroke-width="4"/><circle cx="950" cy="335" r="7" fill="#26364c" stroke="#26364c" stroke-width="1"/><text x="908" y="345" font-size="29" font-weight="700" fill="#26364c">P</text><circle cx="950" cy="640" r="7" fill="#26364c" stroke="#26364c" stroke-width="1"/><text x="908" y="650" font-size="29" font-weight="700" fill="#26364c">Q</text><text x="840" y="732" font-size="25" font-weight="400" fill="#26364c">回路の続きへ</text><text x="745" y="801" font-size="26" font-weight="700" fill="#287b72">負荷と電圧計は同じ二点 P・Q の間。</text><text x="745" y="851" font-size="26" font-weight="400" fill="#26364c">二点間の電圧（電位差）を測る。</text><text x="40" y="958" font-size="28" font-weight="700" fill="#26364c">紙上で関係を学ぶ図です。電流レンジを電源両端へ直接当てない。</text><text x="40" y="1004" font-size="27" font-weight="400" fill="#26364c">実作業では担当範囲・教育・設備手順と測定器の適合を確認する。</text><text x="40" y="1050" font-size="26" font-weight="400" fill="#26364c">数値・入力端子・レンジの選び方や、実機の接続操作は示していません。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="1600" height="1500" fill="#fff8e8"/><g font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" fill="#26364c"><text x="45" y="65" font-size="38" font-weight="700" fill="#26364c">腐食と皮膜：通る場所と層の役割を読む</text><text x="45" y="112" font-size="23" font-weight="400" fill="#26364c">独立した概念配置。寸法、腐食速度、全反応機構や装置配線を示しません。</text><rect x="40" y="160" width="1520" height="345" rx="10" fill="#f7f3e8" stroke="#c9c5b6" stroke-width="2"/><text x="65" y="205" font-size="30" font-weight="700" fill="#26364c">① 金属側の電子と、液側のイオンを分ける</text><rect x="400" y="325" width="760" height="140" rx="0" fill="#e9f0f5" stroke="#426b91" stroke-width="2"/><rect x="500" y="280" width="70" height="160" rx="0" fill="#d1d9dc" stroke="#26364c" stroke-width="2"/><rect x="920" y="280" width="70" height="160" rx="0" fill="#b6c8be" stroke="#26364c" stroke-width="2"/><text x="465" y="260" font-size="28" font-weight="700" fill="#26364c">Al</text><text x="920" y="260" font-size="28" font-weight="700" fill="#26364c">Ni</text><path d="M535 280 L535 235 L955 235 L955 280" fill="none" stroke="#26364c" stroke-width="4"/><line x1="650" y1="235" x2="830" y2="235" stroke="#b45828" stroke-width="5" marker-end="url(#arr)"/><text x="650" y="220" font-size="22" font-weight="700" fill="#b45828">金属側：電子</text><line x1="590" y1="390" x2="850" y2="390" stroke="#287b72" stroke-width="4" stroke-dasharray="7 5"/><text x="620" y="435" font-size="21" font-weight="700" fill="#287b72">液側：イオンが電荷移動に関与</text><text x="70" y="310" font-size="23" font-weight="400" fill="#26364c">異種金属・導電経路</text><text x="70" y="350" font-size="23" font-weight="400" fill="#26364c">電解質を含む環境</text><text x="70" y="430" font-size="23" font-weight="700" fill="#26364c">条件で腐食は変わる</text><text x="1190" y="315" font-size="21" font-weight="400" fill="#26364c">金属の並びだけで</text><text x="1190" y="352" font-size="21" font-weight="400" fill="#26364c">全環境の速度を</text><text x="1190" y="389" font-size="23" font-weight="700" fill="#26364c">決めない</text><rect x="40" y="530" width="1520" height="340" rx="10" fill="#f7f3e8" stroke="#c9c5b6" stroke-width="2"/><text x="65" y="575" font-size="30" font-weight="700" fill="#26364c">② ピンホール：基材へ届く経路を見分ける</text><rect x="410" y="720" width="650" height="95" rx="0" fill="#b7c8d2" stroke="#26364c" stroke-width="2"/><rect x="410" y="655" width="285" height="65" rx="0" fill="#73a4b0" stroke="#426b91" stroke-width="2"/><rect x="745" y="655" width="315" height="65" rx="0" fill="#73a4b0" stroke="#426b91" stroke-width="2"/><path d="M720 600 Q690 638 705 650 Q720 665 735 650 Q750 638 720 600Z" fill="#c5e0e4" stroke="#426b91" stroke-width="3"/><line x1="720" y1="660" x2="720" y2="748" stroke="#b45828" stroke-width="4" marker-end="url(#arr)"/><text x="1110" y="685" font-size="26" font-weight="700" fill="#426b91">皮膜</text><text x="1110" y="765" font-size="26" font-weight="700" fill="#26364c">基材</text><text x="70" y="650" font-size="24" font-weight="400" fill="#26364c">水などが基材へ</text><text x="70" y="690" font-size="24" font-weight="400" fill="#26364c">届く穴の例</text><text x="70" y="795" font-size="21" font-weight="700" fill="#26364c">穴から腐食が広がる場合がある</text><text x="1100" y="825" font-size="21" font-weight="400" fill="#26364c">実寸・合否は未指定</text><rect x="40" y="895" width="1520" height="440" rx="10" fill="#f7f3e8" stroke="#c9c5b6" stroke-width="2"/><text x="65" y="940" font-size="30" font-weight="700" fill="#26364c">③ 代表的な多孔質陽極酸化皮膜の断面</text><rect x="420" y="1200" width="650" height="90" rx="0" fill="#b7c8d2" stroke="#26364c" stroke-width="2"/><rect x="420" y="1165" width="650" height="35" rx="0" fill="#487f8b" stroke="#426b91" stroke-width="2"/><rect x="420" y="1020" width="105" height="145" rx="0" fill="#a4c4c8" stroke="#426b91" stroke-width="2"/><rect x="525" y="1020" width="25" height="145" rx="0" fill="#fff8e8" stroke="#c9c5b6" stroke-width="2"/><rect x="550" y="1020" width="105" height="145" rx="0" fill="#a4c4c8" stroke="#426b91" stroke-width="2"/><rect x="655" y="1020" width="25" height="145" rx="0" fill="#fff8e8" stroke="#c9c5b6" stroke-width="2"/><rect x="680" y="1020" width="105" height="145" rx="0" fill="#a4c4c8" stroke="#426b91" stroke-width="2"/><rect x="785" y="1020" width="25" height="145" rx="0" fill="#fff8e8" stroke="#c9c5b6" stroke-width="2"/><rect x="810" y="1020" width="105" height="145" rx="0" fill="#a4c4c8" stroke="#426b91" stroke-width="2"/><rect x="915" y="1020" width="25" height="145" rx="0" fill="#fff8e8" stroke="#c9c5b6" stroke-width="2"/><rect x="940" y="1020" width="105" height="145" rx="0" fill="#a4c4c8" stroke="#426b91" stroke-width="2"/><rect x="1045" y="1020" width="25" height="145" rx="0" fill="#fff8e8" stroke="#c9c5b6" stroke-width="2"/><text x="1120" y="1070" font-size="27" font-weight="700" fill="#426b91">孔を含む領域</text><line x1="1110" y1="1090" x2="1055" y2="1090" stroke="#426b91" stroke-width="3" marker-end="url(#arr)"/><text x="1120" y="1185" font-size="25" font-weight="700" fill="#287b72">緻密なバリア層</text><line x1="1110" y1="1180" x2="1065" y2="1180" stroke="#287b72" stroke-width="3" marker-end="url(#arr)"/><text x="1120" y="1265" font-size="24" font-weight="700" fill="#26364c">アルミニウム基材</text><text x="70" y="1045" font-size="24" font-weight="400" fill="#26364c">孔の形・太さ・</text><text x="70" y="1085" font-size="24" font-weight="400" fill="#26364c">層の比は模式的</text><text x="70" y="1150" font-size="24" font-weight="400" fill="#26364c">自然酸化膜と</text><text x="70" y="1190" font-size="24" font-weight="400" fill="#26364c">処理皮膜は別</text><text x="70" y="1270" font-size="20" font-weight="700" fill="#26364c">全ての皮膜が同形とは限らない</text><line x1="45" y1="1380" x2="1555" y2="1380" stroke="#c9c5b6" stroke-width="2"/><text x="45" y="1425" font-size="23" font-weight="400" fill="#26364c">図は概念の区別用です。実作業で電子配線や薬液の流れ、電極接続を指示するものではありません。</text><text x="45" y="1465" font-size="23" font-weight="400" fill="#26364c">材料、保護皮膜、電解質、温度などの条件を確認し、反応しやすさの順だけで腐食を断定しません。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" rx="20" fill="#fff8e8"/><g font-family="Noto Sans CJK JP,sans-serif" fill="#26364c"><text x="48" y="58" font-size="30" font-weight="700">直列と並列：何が共通になる？</text><text x="48" y="100" font-size="20">理想的な抵抗と直流電源の基本関係を示す模式図</text>
<rect x="40" y="130" width="420" height="345" rx="14" fill="#e1ebde"/><rect x="500" y="130" width="420" height="345" rx="14" fill="#e4e9f0"/>
<text x="70" y="175" font-size="26" font-weight="700">直列回路</text><text x="530" y="175" font-size="26" font-weight="700">並列回路</text>
<g stroke="#287b72" stroke-width="4" fill="none"><path d="M85 275H140M220 275H265M345 275H420"/><rect x="140" y="255" width="80" height="40" fill="#fff8e8"/><rect x="265" y="255" width="80" height="40" fill="#fff8e8"/></g>
<text x="163" y="245" font-size="21">R₁</text><text x="287" y="245" font-size="21">R₂</text><text x="67" y="310" font-size="19">＋</text><text x="403" y="310" font-size="19">−</text>
<text x="70" y="355" font-size="22">電流は同じ：I₁ = I₂</text><text x="70" y="400" font-size="22">電圧の合計：V = V₁ + V₂</text><text x="70" y="443" font-size="22">合成抵抗：R = R₁ + R₂</text>
<g stroke="#b36d39" stroke-width="4" fill="none"><path d="M540 270H580V225H660M740 225H825V315H740M660 315H580V270M825 270H875"/><rect x="660" y="205" width="80" height="40" fill="#fff8e8"/><rect x="660" y="295" width="80" height="40" fill="#fff8e8"/></g>
<text x="686" y="195" font-size="19">R₁</text><text x="686" y="285" font-size="19">R₂</text><text x="533" y="300" font-size="19">＋</text><text x="865" y="300" font-size="19">−</text>
<text x="530" y="380" font-size="22">電圧は同じ：V₁ = V₂</text><text x="530" y="425" font-size="22">電流の合計：I = I₁ + I₂</text>
<text x="48" y="520" font-size="21">比較する前に、接続点と電源の両端を確認する。</text><text x="48" y="560" font-size="20">実機への接続や測定の指示ではありません。</text></g></svg>
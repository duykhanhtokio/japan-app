<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
<rect width="1280" height="800" rx="24" fill="#fff8e8"/>
<g font-family="Noto Serif CJK JP,serif" fill="#26364c">
<text x="44" y="58" font-size="34" font-weight="700" fill="#26364c">ダイヤルゲージ：基準との差を読む</text>
<text x="44" y="102" font-size="23" font-weight="400" fill="#26364c">紙上の比較測定例｜一目盛 0.01 mm と仮定。図の長さ・変位は実寸ではありません。</text>
<rect x="44" y="132" width="576" height="350" rx="16" fill="#e8eef1"/>
<text x="64" y="171" font-size="24" font-weight="700" fill="#26364c">① 基準（マスター）でゼロを合わせる</text>
<circle cx="194" cy="282" r="78" fill="#fffdf7" stroke="#287b72" stroke-width="5"/>
<path d="M194.00 222.00L194.00 208.00" stroke="#26364c" stroke-width="3"/>
<text x="188" y="192" font-size="18" font-weight="400" fill="#26364c">0</text>
<path d="M209.53 224.04L213.15 210.52" stroke="#26364c" stroke-width="3"/>
<text x="213" y="195" font-size="18" font-weight="400" fill="#26364c">1</text>
<path d="M224.00 230.04L231.00 217.91" stroke="#26364c" stroke-width="3"/>
<text x="236" y="205" font-size="18" font-weight="400" fill="#26364c">2</text>
<path d="M236.43 239.57L246.33 229.67" stroke="#26364c" stroke-width="3"/>
<text x="256" y="220" font-size="18" font-weight="400" fill="#26364c">3</text>
<path d="M245.96 252.00L258.09 245.00" stroke="#26364c" stroke-width="3"/>
<text x="271" y="240" font-size="18" font-weight="400" fill="#26364c">4</text>
<path d="M194 282L194.00 218.00" stroke="#287b72" stroke-width="5"/><circle cx="194" cy="282" r="6" fill="#287b72"/>
<path d="M194 362V396" stroke="#64788d" stroke-width="7"/><circle cx="194" cy="399" r="5" fill="#64788d"/><rect x="119" y="404" width="150" height="34" fill="#287b72"/><path d="M79 444H584" stroke="#26364c" stroke-width="4"/>
<text x="309" y="260" font-size="26" font-weight="700" fill="#287b72">表示 0.00 mm</text>
<text x="309" y="303" font-size="21" font-weight="400" fill="#26364c">同じ取付け・接触条件</text>
<text x="309" y="344" font-size="21" font-weight="400" fill="#26364c">基準面を清潔に保つ</text>
<text x="71" y="469" font-size="20" font-weight="400" fill="#26364c">基準平面 ／ 模式図（形状・寸法は省略）</text>
<rect x="660" y="132" width="576" height="350" rx="16" fill="#e8eef1"/>
<text x="680" y="171" font-size="24" font-weight="700" fill="#26364c">② 同じ条件で対象を測る</text>
<circle cx="810" cy="282" r="78" fill="#fffdf7" stroke="#b36d39" stroke-width="5"/>
<path d="M810.00 222.00L810.00 208.00" stroke="#26364c" stroke-width="3"/>
<text x="804" y="192" font-size="18" font-weight="400" fill="#26364c">0</text>
<path d="M825.53 224.04L829.15 210.52" stroke="#26364c" stroke-width="3"/>
<text x="829" y="195" font-size="18" font-weight="400" fill="#26364c">1</text>
<path d="M840.00 230.04L847.00 217.91" stroke="#26364c" stroke-width="3"/>
<text x="852" y="205" font-size="18" font-weight="400" fill="#26364c">2</text>
<path d="M852.43 239.57L862.33 229.67" stroke="#26364c" stroke-width="3"/>
<text x="872" y="220" font-size="18" font-weight="400" fill="#26364c">3</text>
<path d="M861.96 252.00L874.09 245.00" stroke="#26364c" stroke-width="3"/>
<text x="887" y="240" font-size="18" font-weight="400" fill="#26364c">4</text>
<path d="M810 282L865.43 250.00" stroke="#b36d39" stroke-width="5"/><circle cx="810" cy="282" r="6" fill="#b36d39"/>
<path d="M810 362V396" stroke="#64788d" stroke-width="7"/><circle cx="810" cy="399" r="5" fill="#64788d"/><rect x="735" y="404" width="150" height="34" fill="#b36d39"/><path d="M695 444H1200" stroke="#26364c" stroke-width="4"/>
<text x="925" y="260" font-size="26" font-weight="700" fill="#b36d39">表示例 ＋0.04 mm</text>
<text x="925" y="303" font-size="21" font-weight="400" fill="#26364c">同じ取付け・接触条件</text>
<text x="925" y="344" font-size="21" font-weight="400" fill="#26364c">基準面を清潔に保つ</text>
<text x="687" y="469" font-size="20" font-weight="400" fill="#26364c">基準平面 ／ 模式図（形状・寸法は省略）</text>
<rect x="44" y="510" width="1192" height="115" rx="16" fill="#dfece5"/>
<text x="70" y="551" font-size="31" font-weight="700" fill="#26364c">差の大きさ：0.01 mm／目盛 × 4目盛 ＝ 0.04 mm</text>
<text x="70" y="597" font-size="23" font-weight="400" fill="#26364c">この紙上例では、示した4目盛の移動を「＋」として記録しています。</text>
<text x="44" y="674" font-size="26" font-weight="700" fill="#26364c">注意：対象の絶対寸法が 0.04 mm という意味ではありません。</text>
<text x="44" y="721" font-size="24" font-weight="400" fill="#26364c">符号・針の向き・一目盛の値は、機器と測定方向・基準設定で確認します。</text>
<text x="44" y="765" font-size="23" font-weight="400" fill="#26364c">一目盛の値だけで、測定精度や合否を保証することはできません。</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect width="1400" height="1000" fill="#fff8e8"/><g font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" fill="#26364c"><text x="50" y="70" font-size="39" font-weight="700" fill="#26364c">L・C・R：測る量を区別する</text><text x="50" y="120" font-size="24" font-weight="400" fill="#26364c">独立した概念配置。実機の外観、端子、スイッチを再現していません。</text><rect x="70" y="230" width="500" height="480" rx="12" fill="#e9f0f5" stroke="#426b91" stroke-width="3"/><text x="320" y="295" font-size="36" font-weight="700" fill="#426b91" text-anchor="middle">LCR メーター</text><rect x="125" y="345" width="390" height="120" rx="12" fill="#fff8e8" stroke="#426b91" stroke-width="3"/><text x="320" y="420" font-size="27" font-weight="400" fill="#26364c" text-anchor="middle">表示欄：数値例なし</text><text x="120" y="550" font-size="27" font-weight="700" fill="#26364c">対象の量と条件を照合する</text><text x="120" y="610" font-size="27" font-weight="400" fill="#26364c">端子・配線は描かない</text><rect x="740" y="240" width="580" height="125" rx="12" fill="#e6f0e8" stroke="#287b72" stroke-width="3"/><text x="790" y="318" font-size="52" font-weight="700" fill="#287b72">L</text><text x="900" y="315" font-size="32" font-weight="700" fill="#26364c">インダクタンス</text><line x1="590" y1="303" x2="720" y2="303" stroke="#426b91" stroke-width="4" marker-end="url(#arrow)"/><rect x="740" y="395" width="580" height="125" rx="12" fill="#e6f0e8" stroke="#287b72" stroke-width="3"/><text x="790" y="473" font-size="52" font-weight="700" fill="#287b72">C</text><text x="900" y="470" font-size="32" font-weight="700" fill="#26364c">静電容量</text><line x1="590" y1="458" x2="720" y2="458" stroke="#426b91" stroke-width="4" marker-end="url(#arrow)"/><rect x="740" y="550" width="580" height="125" rx="12" fill="#e6f0e8" stroke="#287b72" stroke-width="3"/><text x="790" y="628" font-size="52" font-weight="700" fill="#287b72">R</text><text x="900" y="625" font-size="32" font-weight="700" fill="#26364c">抵抗</text><line x1="590" y1="613" x2="720" y2="613" stroke="#426b91" stroke-width="4" marker-end="url(#arrow)"/><line x1="50" y1="830" x2="1350" y2="830" stroke="#c9c5b6" stroke-width="2"/><text x="55" y="880" font-size="24" font-weight="400" fill="#26364c">インピーダンスなども測る計器です。機種・部品・測定条件を確認します。</text><text x="55" y="922" font-size="24" font-weight="400" fill="#26364c">図の表示欄は測定値、単位、精度、合否や接続手順を指定しません。</text></g></svg>
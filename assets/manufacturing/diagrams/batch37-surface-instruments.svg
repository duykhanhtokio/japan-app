<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="1600" height="1500" fill="#fff8e8"/><g font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" fill="#26364c"><text x="45" y="65" font-size="38" font-weight="700" fill="#26364c">測定：視線・液面・目盛り・基準を分ける</text><text x="45" y="112" font-size="23" font-weight="400" fill="#26364c">独立した紙上モデル。器具や液ごとの指定読取り方法が優先されます。</text><rect x="40" y="160" width="490" height="550" rx="10" fill="#f7f3e8" stroke="#c9c5b6" stroke-width="2"/><text x="58" y="205" font-size="27" font-weight="700" fill="#26364c">① 液柱温度計と視線</text><rect x="255" y="270" width="30" height="300" rx="12" fill="#fff8e8" stroke="#426b91" stroke-width="2"/><circle cx="270" cy="580" r="26" fill="#e6b2a7" stroke="#b45828" stroke-width="2"/><rect x="265" y="380" width="10" height="200" rx="0" fill="#c98170" stroke="#b45828" stroke-width="2"/><line x1="287" y1="300" x2="310" y2="300" stroke="#26364c" stroke-width="3"/><text x="318" y="308" font-size="22" font-weight="400" fill="#26364c">40</text><line x1="287" y1="380" x2="310" y2="380" stroke="#26364c" stroke-width="3"/><text x="318" y="388" font-size="22" font-weight="400" fill="#26364c">30</text><line x1="287" y1="460" x2="310" y2="460" stroke="#26364c" stroke-width="3"/><text x="318" y="468" font-size="22" font-weight="400" fill="#26364c">20</text><line x1="275" y1="380" x2="470" y2="380" stroke="#287b72" stroke-width="3" stroke-dasharray="8 6"/><circle cx="470" cy="380" r="13" fill="#fff8e8" stroke="#287b72" stroke-width="2"/><text x="360" y="345" font-size="22" font-weight="700" fill="#287b72">同じ高さ</text><text x="60" y="650" font-size="21" font-weight="400" fill="#26364c">液柱の先端を指定方向から読む</text><rect x="555" y="160" width="490" height="550" rx="10" fill="#f7f3e8" stroke="#c9c5b6" stroke-width="2"/><text x="573" y="205" font-size="27" font-weight="700" fill="#26364c">② 比重計：上縁視定の例</text><rect x="625" y="275" width="340" height="320" rx="0" fill="#fff8e8" stroke="#426b91" stroke-width="2"/><rect x="775" y="270" width="45" height="300" rx="0" fill="#e9f0f5" stroke="#426b91" stroke-width="2"/><line x1="777" y1="330" x2="820" y2="330" stroke="#26364c" stroke-width="3"/><text x="830" y="338" font-size="23" font-weight="400" fill="#26364c">1.10</text><line x1="777" y1="400" x2="820" y2="400" stroke="#26364c" stroke-width="3"/><text x="830" y="408" font-size="23" font-weight="400" fill="#26364c">1.12</text><line x1="777" y1="470" x2="820" y2="470" stroke="#26364c" stroke-width="3"/><text x="830" y="478" font-size="23" font-weight="400" fill="#26364c">1.14</text><path d="M627 430 L745 430 Q775 430 775 400 M820 400 Q820 430 855 430 L963 430" fill="none" stroke="#287b72" stroke-width="5"/><line x1="670" y1="365" x2="770" y2="398" stroke="#b45828" stroke-width="4" marker-end="url(#arr)"/><text x="645" y="335" font-size="24" font-weight="700" fill="#b45828">上縁</text><text x="575" y="630" font-size="23" font-weight="700" fill="#26364c">この図の指定読値：1.12</text><text x="575" y="670" font-size="22" font-weight="400" fill="#26364c">架空換算モデルでは200g/L</text><rect x="1070" y="160" width="490" height="550" rx="10" fill="#f7f3e8" stroke="#c9c5b6" stroke-width="2"/><text x="1088" y="205" font-size="27" font-weight="700" fill="#26364c">③ ビューレット：下縁の例</text><rect x="1255" y="265" width="80" height="300" rx="0" fill="#fff8e8" stroke="#426b91" stroke-width="2"/><line x1="1337" y1="310" x2="1363" y2="310" stroke="#26364c" stroke-width="3"/><text x="1370" y="318" font-size="22" font-weight="400" fill="#26364c">2.0mL</text><line x1="1337" y1="330" x2="1355" y2="330" stroke="#26364c" stroke-width="3"/><line x1="1337" y1="350" x2="1355" y2="350" stroke="#26364c" stroke-width="3"/><line x1="1337" y1="370" x2="1355" y2="370" stroke="#26364c" stroke-width="3"/><line x1="1337" y1="390" x2="1355" y2="390" stroke="#26364c" stroke-width="3"/><line x1="1337" y1="410" x2="1363" y2="410" stroke="#26364c" stroke-width="3"/><text x="1370" y="418" font-size="22" font-weight="400" fill="#26364c">3.0mL</text><line x1="1337" y1="430" x2="1355" y2="430" stroke="#26364c" stroke-width="3"/><line x1="1337" y1="450" x2="1355" y2="450" stroke="#26364c" stroke-width="3"/><line x1="1337" y1="470" x2="1355" y2="470" stroke="#26364c" stroke-width="3"/><line x1="1337" y1="490" x2="1355" y2="490" stroke="#26364c" stroke-width="3"/><line x1="1337" y1="510" x2="1363" y2="510" stroke="#26364c" stroke-width="3"/><text x="1370" y="518" font-size="22" font-weight="400" fill="#26364c">4.0mL</text><path d="M1257 410 Q1295 450 1333 410" fill="none" stroke="#287b72" stroke-width="5"/><line x1="1155" y1="460" x2="1290" y2="432" stroke="#b45828" stroke-width="4" marker-end="url(#arr)"/><text x="1100" y="505" font-size="24" font-weight="700" fill="#b45828">液面の底</text><text x="1090" y="630" font-size="23" font-weight="700" fill="#26364c">この図の指定読値：3.2mL</text><text x="1090" y="670" font-size="22" font-weight="400" fill="#26364c">目盛りの増える向きも確認</text><rect x="40" y="770" width="490" height="550" rx="10" fill="#f7f3e8" stroke="#c9c5b6" stroke-width="2"/><text x="58" y="815" font-size="27" font-weight="700" fill="#26364c">④ ホールピペット：標線</text><path d="M250 875 L250 1015 Q190 1055 250 1115 L250 1200 L270 1200 L270 1115 Q330 1055 270 1015 L270 875Z" fill="#e9f0f5" stroke="#426b91" stroke-width="3"/><line x1="225" y1="955" x2="295" y2="955" stroke="#26364c" stroke-width="4"/><path d="M251 945 Q260 965 269 945" fill="none" stroke="#287b72" stroke-width="4"/><text x="315" y="960" font-size="25" font-weight="700" fill="#26364c">標線</text><line x1="370" y1="990" x2="270" y2="955" stroke="#b45828" stroke-width="3" marker-end="url(#arr)"/><text x="325" y="1030" font-size="24" font-weight="700" fill="#b45828">下縁</text><text x="60" y="1260" font-size="21" font-weight="400" fill="#26364c">この模式例は下縁を標線へ対応</text><rect x="555" y="770" width="490" height="550" rx="10" fill="#f7f3e8" stroke="#c9c5b6" stroke-width="2"/><text x="573" y="815" font-size="27" font-weight="700" fill="#26364c">⑤ アナログ目盛りの読取り</text><line x1="658.0" y1="1130.0" x2="640.0" y2="1130.0" stroke="#426b91" stroke-width="3"/><text x="605.0" y="1138.0" font-size="22" font-weight="400" fill="#26364c">0</text><line x1="664.9499746860882" y1="1086.1195867987574" x2="647.8309573927754" y2="1080.5572809000084" stroke="#426b91" stroke-width="3"/><line x1="685.1195867987575" y1="1046.5344941744688" x2="670.5572809000084" y2="1035.9543596332044" stroke="#426b91" stroke-width="3"/><text x="640.3318560406348" y="1029.2597283258924" font-size="22" font-weight="400" fill="#26364c">2</text><line x1="716.5344941744688" y1="1015.1195867987575" x2="705.9543596332044" y2="1000.5572809000084" stroke="#426b91" stroke-width="3"/><line x1="756.1195867987575" y1="994.9499746860881" x2="750.5572809000084" y2="977.8309573927754" stroke="#426b91" stroke-width="3"/><text x="732.8318560406348" y="962.0545444853966" font-size="22" font-weight="400" fill="#26364c">4</text><line x1="800.0" y1="988.0" x2="800.0" y2="970.0" stroke="#426b91" stroke-width="3"/><line x1="843.8804132012425" y1="994.9499746860882" x2="849.4427190999916" y2="977.8309573927754" stroke="#426b91" stroke-width="3"/><text x="847.1681439593652" y="962.0545444853966" font-size="22" font-weight="400" fill="#26364c">6</text><line x1="883.4655058255312" y1="1015.1195867987575" x2="894.0456403667957" y2="1000.5572809000084" stroke="#426b91" stroke-width="3"/><line x1="914.8804132012425" y1="1046.5344941744688" x2="929.4427190999916" y2="1035.9543596332044" stroke="#426b91" stroke-width="3"/><text x="939.6681439593652" y="1029.2597283258924" font-size="22" font-weight="400" fill="#26364c">8</text><line x1="935.0500253139118" y1="1086.1195867987574" x2="952.1690426072246" y2="1080.5572809000084" stroke="#426b91" stroke-width="3"/><line x1="942.0" y1="1130.0" x2="960.0" y2="1130.0" stroke="#426b91" stroke-width="3"/><text x="975.0" y="1138.0" font-size="22" font-weight="400" fill="#26364c">10</text><line x1="800" y1="1130" x2="843.2623792124926" y2="996.8520877186785" stroke="#b45828" stroke-width="6" marker-end="url(#arr)"/><circle cx="800" cy="1130" r="9" fill="#26364c" stroke="#26364c" stroke-width="2"/><text x="575" y="1190" font-size="22" font-weight="700" fill="#26364c">紙上目盛り0～10：針の位置は6</text><text x="575" y="1240" font-size="21" font-weight="400" fill="#26364c">実測値にはレンジと単位も必要</text><text x="575" y="1280" font-size="20" font-weight="400" fill="#26364c">機種の精度・接続を示す図ではない</text><rect x="1070" y="770" width="490" height="550" rx="10" fill="#f7f3e8" stroke="#c9c5b6" stroke-width="2"/><text x="1088" y="815" font-size="27" font-weight="700" fill="#26364c">⑥ 測る方式と調整装置</text><text x="1090" y="875" font-size="23" font-weight="700" fill="#426b91">熱電対</text><text x="1090" y="908" font-size="21" font-weight="400" fill="#26364c">異種金属・熱起電力</text><text x="1090" y="955" font-size="23" font-weight="700" fill="#426b91">白金抵抗体</text><text x="1090" y="988" font-size="21" font-weight="400" fill="#26364c">温度による抵抗変化</text><text x="1090" y="1035" font-size="23" font-weight="700" fill="#426b91">冷却蛇管</text><text x="1090" y="1068" font-size="21" font-weight="400" fill="#26364c">液を冷やす装置の例</text><text x="1090" y="1115" font-size="23" font-weight="700" fill="#426b91">槽外熱交換器</text><text x="1090" y="1148" font-size="21" font-weight="400" fill="#26364c">槽外で温度調整の例</text><text x="1090" y="1195" font-size="23" font-weight="700" fill="#426b91">投入式ヒーター</text><text x="1090" y="1228" font-size="21" font-weight="400" fill="#26364c">液を温める装置の例</text><line x1="45" y1="1380" x2="1555" y2="1380" stroke="#c9c5b6" stroke-width="2"/><text x="45" y="1425" font-size="23" font-weight="400" fill="#26364c">上縁・下縁を全器具へ一般化しません。液の種類、温度、校正法、指定読取り方法を確認します。</text><text x="45" y="1465" font-size="23" font-weight="400" fill="#26364c">架空の目盛りや比重換算を実液・実機へ流用せず、通電、採液、加熱の手順は別に確認します。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" rx="20" fill="#fff8e8"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#26364c"><text x="50" y="62" font-size="30" font-weight="700">表面処理の電流・電圧と品質</text><text x="50" y="105" font-size="20">条件は処理方法・材料・設備によって異なる。</text><rect x="70" y="155" width="340" height="130" rx="16" fill="#d5e9ed"/><text x="105" y="200" font-size="25">電流・電圧</text><text x="105" y="242" font-size="21">指定条件と測定値を照合</text><path d="M430 220H530M512 204L530 220L512 236" stroke="#596b7c" fill="none" stroke-width="5"/><rect x="550" y="145" width="340" height="150" rx="16" fill="#e8dfbb"/><text x="585" y="190" font-size="25">皮膜の状態に影響</text><text x="585" y="230" font-size="21">膜厚・構造・外観など</text><text x="585" y="269" font-size="18">処理条件との関係を確認</text><rect x="70" y="345" width="820" height="150" rx="16" fill="#eee3d8"/><text x="105" y="390" font-size="24">測定値が指定範囲と違うとき</text><text x="105" y="432" font-size="22">自己判断で設定を上げ下げしない。</text><text x="105" y="472" font-size="22">作業標準に従い、責任者へ報告する。</text><text x="70" y="550" font-size="18">品質との関係を示す模式図。設備の調整手順や数値設定ではありません。</text></g></svg>
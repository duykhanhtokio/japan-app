idth="3"/><path d="M1050 805L1090 770L1130 805" fill="none" stroke="#24384a" stroke-width="3"/><path d="M1225 770L1225 815M1225 770L1265 815" fill="none" stroke="#24384a" stroke-width="3"/><path d="M1385 770L1385 815L1430 770Z" fill="none" stroke="#24384a" stroke-width="3"/><line x1="945" y1="990" x2="1470" y2="990" stroke="#30698a" stroke-width="3"/><path d="M945 990L895 1060" fill="none" stroke="#30698a" stroke-width="3"/><line x1="895" y1="1060" x2="870" y2="1060" stroke="#30698a" stroke-width="3" marker-end="url(#arr)"/><path d="M1120 990L1120 945L1165 990Z" fill="#e5eee5" stroke="#24384a" stroke-width="3"/><text x="880" y="910" font-size="24" font-weight="700" fill="#24384a">資料の方式：基線の上 → 矢の反対側</text><text x="50" y="1145" font-size="24" font-weight="400" fill="#24384a">独立した概念図。実寸・操作・判定条件や現行規格への適合を示しません。</text><text x="50" y="1180" font-size="22" font-weight="400" fill="#24384a">実物では機種・図面の版・指定された測定／加工条件を確認します。</text></g></svg>
30698a">半径・直径・板厚：指す箇所を確認</text><path d="M880 475L880 280L1110 280Q1170 280 1170 340L1170 475Z" fill="#e9eee4" stroke="#30698a" stroke-width="3"/><circle cx="1000" cy="385" r="42" fill="#fff9eb" stroke="#30698a" stroke-width="3"/><line x1="920" y1="330" x2="975" y2="352" stroke="#a9562a" stroke-width="3" marker-end="url(#arr)"/><text x="850" y="315" font-size="26" font-weight="700" fill="#a9562a">⌀ 8</text><line x1="1240" y1="245" x2="1140" y2="290" stroke="#277b66" stroke-width="3" marker-end="url(#arr)"/><text x="1240" y="245" font-size="28" font-weight="700" fill="#277b66">R 6</text><rect x="1305" y="340" width="30" height="135" rx="0" fill="#e9eee4" stroke="#30698a" stroke-width="3"/><line x1="1280" y1="515" x2="1355" y2="515" stroke="#24384a" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><text x="1265" y="555" font-size="27" font-weight="700" fill="#24384a">t 2.0</text><text x="850" y="535" font-size="22" font-weight="400" fill="#24384a">独自の部分形状：実寸比ではない</text><rect x="45" y="610" width="740" height="485" rx="10" fill="#f9fbf5" stroke="#becac3" stroke-width="2"/><text x="65" y="648" font-size="28" font-weight="700" fill="#30698a">表面性状：対象面・パラメータ・値</text><rect x="150" y="810" width="520" height="140" rx="0" fill="#e8eee6" stroke="#30698a" stroke-width="3"/><path d="M205 755L230 800L285 700L380 700" fill="none" stroke="#24384a" stroke-width="3"/><line x1="205" y1="755" x2="254.75" y2="755" stroke="#24384a" stroke-width="3"/><text x="290" y="680" font-size="30" font-weight="700" fill="#24384a">Ra 2.5 μm 以下</text><line x1="230" y1="800" x2="230" y2="810" stroke="#24384a" stroke-width="3" marker-end="url(#arr)"/><text x="95" y="1005" font-size="24" font-weight="700" fill="#24384a">この独自例：除去加工の指定を含む</text><text x="95" y="1050" font-size="23" font-weight="400" fill="#24384a">資料の Ra 3.1 μm 例とは別の数値</text><rect x="815" y="610" width="740" height="485" rx="10" fill="#f9fbf5" stroke="#becac3" stroke-width="2"/><text x="835" y="648" font-size="28" font-weigh
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" rx="20" fill="#fff8e8"/><g font-family="Noto Sans CJK JP,sans-serif" fill="#26364c"><text x="48" y="58" font-size="30" font-weight="700">濃度：質量と物質量を区別する</text><text x="48" y="100" font-size="20">分母は、溶媒だけではなく、できあがった溶液の体積</text>
<rect x="48" y="145" width="864" height="145" rx="12" fill="#e1ebde"/><rect x="48" y="325" width="864" height="145" rx="12" fill="#e4e9f0"/>
<text x="75" y="195" font-size="26" font-weight="700">質量濃度（g/L）</text><text x="75" y="250" font-size="26">溶質の質量（g）÷ 溶液の体積（L）</text>
<text x="75" y="375" font-size="26" font-weight="700">モル濃度（mol/L）</text><text x="75" y="430" font-size="26">溶質の物質量（mol）÷ 溶液の体積（L）</text>
<text x="48" y="525" font-size="21">g は質量、mol は物質量。単位の意味をそろえて計算する。</text><text x="48" y="565" font-size="21">数値だけでは相互に置き換えられない。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" rx="20" fill="#fff8e8"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#26364c"><text x="50" y="62" font-size="30" font-weight="700">QC工程図に必要な情報</text><text x="50" y="105" font-size="20">図は新しい説明例。実際の検査条件は作業標準で確認する。</text><rect x="60" y="145" width="840" height="75" rx="12" fill="#d9e6ee"/><text x="90" y="190" font-size="25">工程名　→　どの工程を管理するか</text><rect x="60" y="235" width="405" height="100" rx="12" fill="#e0ebcf"/><text x="85" y="274" font-size="24">管理項目</text><text x="85" y="310" font-size="20">例：製品の寸法</text><rect x="495" y="235" width="405" height="100" rx="12" fill="#f3dfbc"/><text x="520" y="274" font-size="24">管理方法</text><text x="520" y="310" font-size="20">例：指定された測定器</text><rect x="60" y="350" width="405" height="100" rx="12" fill="#e4dced"/><text x="85" y="389" font-size="24">管理頻度</text><text x="85" y="425" font-size="20">例：標準で指定された間隔</text><rect x="495" y="350" width="405" height="100" rx="12" fill="#eed2c6"/><text x="520" y="389" font-size="24">異常時の処置</text><text x="520" y="425" font-size="20">例：隔離・報告・指定の対応</text><text x="70" y="510" font-size="22">項目だけでなく、方法・頻度・異常時の対応まで確認する。</text><text x="70" y="550" font-size="18">特定の製品や設備の検査手順を指定する図ではありません。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1300" viewBox="0 0 1400 1300"><rect width="1400" height="1300" fill="#fff8e8"/><g font-family="Noto Serif JP,Noto Serif CJK JP,serif" fill="#26364c"><text x="40" y="57" font-size="37" font-weight="700" fill="#26364c">幾何公差とデータム：取付位置を比べる</text><text x="40" y="103" font-size="26" font-weight="400" fill="#26364c">資料に基づく独自模式図。枠内の幾何特性記号・公差値は省略。</text><rect x="30" y="145" width="655" height="505" rx="16" fill="#f1f0e6" stroke="#c9c5b6" stroke-width="3"/><text x="52" y="191" font-size="31" font-weight="700" fill="#26364c">① 表面への公差指示</text><rect x="715" y="145" width="655" height="505" rx="16" fill="#f1f0e6" stroke="#c9c5b6" stroke-width="3"/><text x="737" y="191" font-size="31" font-weight="700" fill="#26364c">② 軸線への公差指示</text><rect x="30" y="680" width="655" height="505" rx="16" fill="#f1f0e6" stroke="#c9c5b6" stroke-width="3"/><text x="52" y="726" font-size="31" font-weight="700" fill="#26364c">③ 表面をデータムにする</text><rect x="715" y="680" width="655" height="505" rx="16" fill="#f1f0e6" stroke="#c9c5b6" stroke-width="3"/><text x="737" y="726" font-size="31" font-weight="700" fill="#26364c">④ 軸線をデータムにする</text><rect x="110" y="240" width="120" height="45" rx="0" fill="#fffdf7" stroke="#26364c" stroke-width="3"/><line x1="155" y1="240" x2="155" y2="285" stroke="#26364c" stroke-width="3"/><path d="M110 263H90V390" fill="none" stroke="#426b91" stroke-width="3"/><path d="M83 375L90 390L97 375" fill="none" stroke="#426b91" stroke-width="3"/><path d="M70 390H285V465" fill="none" stroke="#26364c" stroke-width="4"/><text x="68" y="513" font-size="25" font-weight="700" fill="#426b91">外形線へ</text><rect x="455" y="240" width="120" height="45" rx="0" fill="#fffdf7" stroke="#26364c" stroke-width="3"/><line x1="500" y1="240" x2="500" y2="285" stroke="#26364c" stroke-width="3"/><path d="M455 263H427V390" fill="none" stroke="#426b91" stroke-width="3"/><path d="M420 375L427 390L434 375" fill="none" stroke="#426b91" stroke-width="3"/><path d="M485 390H630V465" fill="none" stroke="#26364c" stroke-width="4"/><line x1="400" y1="390" x2="485" y2="390" stroke="#26364c" stroke-width="2"/><text x="390" y="513" font-size="25" font-weight="700" fill="#426b91">外形線の延長線へ</text><text x="55" y="586" font-size="24" font-weight="400" fill="#26364c">矢印の先が接する線を確認する。</text><rect x="865" y="350" width="390" height="90" rx="0" fill="#e7edf4" stroke="#26364c" stroke-width="3"/><line x1="845" y1="395" x2="1273" y2="395" stroke="#426b91" stroke-width="2" stroke-dasharray="34 8 5 8"/><line x1="770" y1="350" x2="865" y2="350" stroke="#26364c" stroke-width="2"/><line x1="770" y1="440" x2="865" y2="440" stroke="#26364c" stroke-width="2"/><line x1="805" y1="350" x2="805" y2="440" stroke="#287b72" stroke-width="3"/><line x1="805" y1="440" x2="805" y2="483" stroke="#287b72" stroke-width="3"/><path d="M798 455L805 440L812 455" fill="none" stroke="#287b72" stroke-width="3"/><rect x="925" y="240" width="120" height="45" rx="0" fill="#fffdf7" stroke="#26364c" stroke-width="3"/><line x1="970" y1="240" x2="970" y2="285" stroke="#26364c" stroke-width="3"/><path d="M925 263H805V350" fill="none" stroke="#426b91" stroke-width="3"/><path d="M798 335L805 350L812 335" fill="none" stroke="#426b91" stroke-width="3"/><text x="840" y="508" font-size="23" font-weight="400" fill="#287b72">緑：寸法線とその延長</text><text x="740" y="559" font-size="25" font-weight="700" fill="#426b91">公差指示は寸法線の延長線へ。</text><text x="740" y="599" font-size="24" font-weight="400" fill="#26364c">破線の軸線へ直接向けない。</text><line x1="110" y1="955" x2="585" y2="955" stroke="#26364c" stroke-width="4"/><line x1="110" y1="955" x2="110" y2="1015" stroke="#26364c" stroke-width="4"/><rect x="307" y="842" width="46" height="46" rx="0" fill="#fffdf7" stroke="#26364c" stroke-width="3"/><text x="316" y="876" font-size="33" font-weight="400" fill="#26364c">A</text><line x1="330" y1="888" x2="330" y2="933" stroke="#26364c" stroke-width="3"/><path d="M317 955L330 933L343 955Z" fill="#26364c" stroke="#26364c" stroke-width="1"/><text x="105" y="1045" font-size="24" font-weight="400" fill="#26364c">三角形の底辺が対象の線に接する。</text><text x="55" y="1094" font-size="25" font-weight="700" fill="#426b91">外形線またはその延長線へ。</text><text x="55" y="1134" font-size="24" font-weight="400" fill="#26364c">文字 A は基準を識別する。</text><rect x="865" y="885" width="390" height="90" rx="0" fill="#e7edf4" stroke="#26364c" stroke-width="3"/><line x1="845" y1="930" x2="1273" y2="930" stroke="#426b91" stroke-width="2" stroke-dasharray="34 8 5 8"/><line x1="770" y1="885" x2="865" y2="885" stroke="#26364c" stroke-width="2"/><line x1="770" y1="975" x2="865" y2="975" stroke="#26364c" stroke-width="2"/><line x1="805" y1="885" x2="805" y2="975" stroke="#287b72" stroke-width="3"/><line x1="805" y1="975" x2="805" y2="1018" stroke="#287b72" stroke-width="3"/><path d="M798 990L805 975L812 990" fill="none" stroke="#287b72" stroke-width="3"/><rect x="782" y="772" width="46" height="46" rx="0" fill="#fffdf7" stroke="#26364c" stroke-width="3"/><text x="791" y="806" font-size="33" font-weight="400" fill="#26364c">A</text><line x1="805" y1="818" x2="805" y2="863" stroke="#26364c" stroke-width="3"/><path d="M792 885L805 863L818 885Z" fill="#26364c" stroke="#26364c" stroke-width="1"/><text x="840" y="1043" font-size="23" font-weight="400" fill="#287b72">緑：寸法線とその延長</text><text x="740" y="1094" font-size="25" font-weight="700" fill="#426b91">データム記号は寸法線の延長線へ。</text><text x="740" y="1134" font-size="24" font-weight="400" fill="#26364c">破線の軸線へ直接付けない。</text><text x="40" y="1230" font-size="27" font-weight="700" fill="#26364c">取付位置の比較用。公差値・実寸・測定合否は指定していません。</text><text x="40" y="1270" font-size="25" font-weight="400" fill="#26364c">実際の図面の適用規格と指示を優先してください。</text></g></svg>
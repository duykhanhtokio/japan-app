<!-- Radial medullary regions provide controlled organ detail without implying pathological findings. -->
<g fill="#bd7364" stroke="#e9af98" stroke-width="2"><path d="M954 240L983 242L974 290Z"/><path d="M994 245L1017 265L989 307Z"/><path d="M1025 280L1037 309L995 327Z"/><path d="M1040 326L1035 359L997 347Z"/><path d="M1029 375L1011 404L983 366Z"/><path d="M998 417L969 437L963 385Z"/></g>
<!-- Pelvis/calyces collect inside the cutaway kidney and continue into the ureter. -->
<path d="M974 287Q968 316 958 329L939 339L925 348L927 376Q941 365 954 361L978 384L987 378L968 352L993 346L995 334L966 340L989 311L981 303L957 330Z" fill="url(#urine)" stroke="#b59170" stroke-width="4" stroke-linejoin="round"/>

<path d="M632 364Q646 406 651 463Q655 519 677 580Q698 639 718 692L748 739" fill="none" stroke="#b59170" stroke-width="20" stroke-linecap="round"/>
<path d="M632 364Q646 406 651 463Q655 519 677 580Q698 639 718 692L748 739" fill="none" stroke="url(#urine)" stroke-width="13" stroke-linecap="round"/>
<path d="M928 367Q916 416 912 471Q909 528 893 584Q876 640 856 693L827 739" fill="none" stroke="#b59170" stroke-width="20" stroke-linecap="round"/>
<path d="M928 367Q916 416 912 471Q909 528 893 584Q876 640 856 693L827 739" fill="none" stroke="url(#urine)" stroke-width="13" stroke-linecap="round"/>
<!-- The bladder is a separate reservoir and has one outlet inferiorly. -->
<path d="M748 722Q714 715 700 748Q686 788 715 825Q737 850 763 861L770 884H805L811 861Q843 850 862 823Q889 785 875 749Q864 719 827 722Q789 739 748 722Z" fill="url(#bladder)" stroke="#a97163" stroke-width="5"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><defs>
<linearGradient id="kidney" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efaa9f"/><stop offset=".35" stop-color="#bd695e"/><stop offset=".8" stop-color="#8e4c48"/><stop offset="1" stop-color="#d3897b"/></linearGradient>
<linearGradient id="cut" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1b7a2"/><stop offset=".6" stop-color="#d88e78"/><stop offset="1" stop-color="#b97165"/></linearGradient>
<linearGradient id="urine" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#e5c7a3"/><stop offset=".5" stop-color="#fbecd0"/><stop offset="1" stop-color="#c7a27c"/></linearGradient>
<linearGradient id="bladder" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#efd2b9"/><stop offset=".5" stop-color="#dba78d"/><stop offset="1" stop-color="#b97d6c"/></linearGradient>
</defs><rect width="1536" height="1024" fill="#faf7ee"/>
<!-- Independently drawn front-view organ plate; surrounding torso is a faint orientation aid. -->
<path d="M517 96Q491 154 506 230L517 391Q514 480 539 564L581 732Q599 833 667 915H916Q976 839 995 732L1034 564Q1056 480 1054 391L1063 230Q1075 153 1047 96" fill="#f0e9da" stroke="#e1d9cb" stroke-width="3"/>
<!-- One intact kidney, with a medial hilum; opposite organ is an illustrative cutaway. -->
<path d="M637 231Q588 212 546 247Q503 285 510 358Q514 421 552 457Q593 493 638 475Q671 461 671 429Q668 404 639 386Q616 370 618 346Q619 321 644 307Q672 290 664 263Q657 240 637 231Z" fill="url(#kidney)" stroke="#8c5d53" stroke-width="5"/>
<path d="M552 251Q523 293 528 352Q532 414 562 441" fill="none" stroke="#f3c8b2" stroke-width="10" opacity=".55"/>
<!-- Cutaway kidney, external capsule and cortex rim are distinct from central pelvis. -->
<path d="M929 215Q978 198 1021 232Q1063 267 1061 336Q1059 408 1021 447Q979 483 935 463Q903 450 907 420Q911 397 939 378Q962 362 958 337Q955 313 930 299Q905 285 908 257Q912 227 929 215Z" fill="url(#kidney)" stroke="#8c5d53" stroke-width="5"/>

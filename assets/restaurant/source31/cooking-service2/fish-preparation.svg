<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#087e85"/></marker></defs><rect width="100%" height="100%" fill="#fffdf6"/><rect width="100%" height="110" fill="#183d50"/><text x="40" y="67" font-size="38" fill="white" font-family="Noto Sans CJK JP,sans-serif">魚の下処理：方向と部位を照合する</text><text x="45" y="165" font-size="28" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">うろこ：尾から頭へ</text><g transform="translate(80,230) scale(1.7)"><path d="M50 110Q150 25 310 100Q335 120 310 145Q160 225 50 145L0 180L0 75Z" fill="#cee2eb" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="290" cy="113" rx="5" ry="5" fill="#183d50" stroke="#183d50" stroke-width="4"/><path d="M256 87Q235 123 256 160" fill="none" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 140L177 184L229 157" fill="#e8c382" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M148 173L121 204L167 176" fill="#e8c382" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 130L238 130" fill="none" stroke="#7b9ca8" stroke-width="2"/></g><path d="M180 390L555 390" fill="none" stroke="#087e85" stroke-width="9" marker-end="url(#arr)"/><text x="100" y="570" font-size="28" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">尾</text><text x="555" y="570" font-size="28" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">頭</text><text x="865" y="165" font-size="28" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">えら：ふたを開き、両側の付け根</text><g transform="translate(895,230) scale(1.7)"><path d="M50 110Q150 25 310 100Q335 120 310 145Q160 225 50 145L0 180L0 75Z" fill="#cee2eb" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="290" cy="113" rx="5" ry="5" fill="#183d50" stroke="#183d50" stroke-width="4"/><path d="M256 87Q235 123 256 160" fill="none" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 140L177 184L229 157" fill="#e8c382" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M148 173L121 204L167 176" fill="#e8c382" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 130L238 130" fill="none" stroke="#7b9ca8" stroke-width="2"/></g><ellipse cx="1310" cy="425" rx="34" ry="54" fill="none" stroke="#bd3f39" stroke-width="4"/><path d="M1320 510L1410 565" fill="none" stroke="#bd3f39" stroke-width="4"/><text x="1110" y="610" font-size="27" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">えらと身のつながる所</text><text x="45" y="690" font-size="28" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">内臓：用途で切込み位置を分ける</text><g transform="translate(75,760) scale(1.5)"><path d="M50 110Q150 25 310 100Q335 120 310 145Q160 225 50 145L0 180L0 75Z" fill="#cee2eb" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="290" cy="113" rx="5" ry="5" fill="#183d50" stroke="#183d50" stroke-width="4"/><path d="M256 87Q235 123 256 160" fill="none" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 140L177 184L229 157" fill="#e8c382" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M148 173L121 204L167 176" fill="#e8c382" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 130L238 130" fill="none" stroke="#7b9ca8" stroke-width="2"/></g><path d="M455 990L300 1035" fill="none" stroke="#bd3f39" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="1095" font-size="26" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">切り身用：えら付近から腹へ</text><g transform="translate(670,760) scale(1.5)"><path d="M50 110Q150 25 310 100Q335 120 310 145Q160 225 50 145L0 180L0 75Z" fill="#cee2eb" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="290" cy="113" rx="5" ry="5" fill="#183d50" stroke="#183d50" stroke-width="4"/><path d="M256 87Q235 123 256 160" fill="none" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 140L177 184L229 157" fill="#e8c382" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M148 173L121 204L167 176" fill="#e8c382" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 130L238 130" fill="none" stroke="#7b9ca8" stroke-width="2"/></g><path d="M982 991L1005 980" fill="none" stroke="#087e85" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text x="640" y="1095" font-size="26" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">尾頭付き：裏側の胸びれ下</text><g transform="translate(1210,790) scale(0.8)"><path d="M50 110Q150 25 310 100Q335 120 310 145Q160 225 50 145L0 180L0 75Z" fill="#cee2eb" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="290" cy="113" rx="5" ry="5" fill="#183d50" stroke="#183d50" stroke-width="4"/><path d="M256 87Q235 123 256 160" fill="none" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 140L177 184L229 157" fill="#e8c382" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M148 173L121 204L167 176" fill="#e8c382" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 130L238 130" fill="none" stroke="#7b9ca8" stroke-width="2"/></g><path d="M1378 906L1322 934" fill="none" stroke="#bd3f39" stroke-width="7"/><text x="1190" y="1000" font-size="25" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">頭：ひれ後方の斜め線</text><text x="1190" y="1040" font-size="25" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">反対側も処理する</text><text x="38" y="1176" font-size="22" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">独自の学習用模式図。実物・機種・自店の手順を確認し、実演を受ける。</text></svg>

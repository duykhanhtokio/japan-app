<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#087e85"/></marker></defs><rect width="100%" height="100%" fill="#fffdf6"/><rect width="100%" height="110" fill="#183d50"/><text x="40" y="67" font-size="38" fill="white" font-family="Noto Sans CJK JP,sans-serif">令和4年の図を読む：2023年版教材の引用例</text><text x="40" y="202" font-size="28" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">転倒</text><rect x="535" y="170" width="720" height="40" rx="0" fill="#087e85" stroke="#087e85" stroke-width="4"/><text x="1280" y="202" font-size="29" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">30％</text><text x="40" y="280" font-size="28" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">切れ・こすれ</text><rect x="535" y="248" width="480" height="40" rx="0" fill="#087e85" stroke="#087e85" stroke-width="4"/><text x="1040" y="280" font-size="29" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">20％</text><text x="40" y="358" font-size="28" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">高温・低温物との接触</text><rect x="535" y="326" width="360" height="40" rx="0" fill="#087e85" stroke="#087e85" stroke-width="4"/><text x="920" y="358" font-size="29" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">15％</text><text x="40" y="436" font-size="28" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">動作の反動・無理な動作</text><rect x="535" y="404" width="240" height="40" rx="0" fill="#087e85" stroke="#087e85" stroke-width="4"/><text x="800" y="436" font-size="29" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">10％</text><text x="40" y="514" font-size="28" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">墜落・転落</text><rect x="535" y="482" width="144" height="40" rx="0" fill="#087e85" stroke="#087e85" stroke-width="4"/><text x="704" y="514" font-size="29" fill="#183d50" font-family="Noto Sans CJK J
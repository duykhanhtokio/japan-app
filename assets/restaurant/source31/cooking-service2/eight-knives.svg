<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#087e85"/></marker></defs><rect width="100%" height="100%" fill="#fffdf6"/><rect width="100%" height="110" fill="#183d50"/><text x="40" y="67" font-size="38" fill="white" font-family="Noto Sans CJK JP,sans-serif">八つの包丁：刃の形と主な用途を照合する</text><text x="45" y="180" font-size="31" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">柳刃：刺身</text><path d="M395 240L165 240Q85 246.25 85 265L395 265Z" fill="#cee2eb" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M395 252.5L535 252.5" fill="none" stroke="#183d50" stroke-width="28"/><text x="935" y="180" font-size="31" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">出刃：魚の処理</text><path d="M1205 240L1020 240Q975 261.25 975 325L1205 325Z" fill="#cee2eb" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1205 282.5L1345 282.5" fill="none" stroke="#183d50" stroke-width="28"/><text x="45" y="420" font-size="31" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">菜切：野菜の刻み</text><rect x="85" y="480" width="220" height="85" rx="0" fill="#cee2eb" stroke="#183d50" stroke-width="4"/><path d="M305 522.5L445 522.5" fill="none" stroke="#183d50" stroke-width="28"/><text x="935" y="420" font-size="31" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">薄刃：野菜の皮むき等</text><rect x="975" y="480" width="240" height="75" rx="0" fill="#cee2eb" stroke="#183d50" stroke-width="4"/><path d="M1215 517.5L1355 517.5" fill="none" stroke="#183d50" stroke-width="28"/><text x="45" y="660" font-size="31" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">牛刀：肉・魚・野菜</text><path d="M365 720L165 720Q85 736.25 85 785L365 785Z" fill="#cee2eb" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M365 752.5L505 752.5" fill="none" stroke="#183d50" stroke-width="28"/><text x="935" y="660" font-size="31" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">三徳：肉・魚・野菜</text><path d="M1220 720L1015 720Q975 738.75 975 795L1220 795Z" fill="#cee2eb" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1220 757.5L1360 757.5" fill="none" stroke="#183d50" stroke-width="28"/><text x="45" y="900" font-size="31" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">ペティ：細かな作業</text><path d="M255 960L145 960Q85 970.0 85 1000L255 1000Z" fill="#cee2eb" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M255 980.0L395 980.0" fill="none" stroke="#183d50" stroke-width="28"/><text x="935" y="900" font-size="31" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">中華包丁：広い刃と重み</text><rect x="975" y="960" width="240" height="130" rx="0" fill="#cee2eb" stroke="#183d50" stroke-width="4"/><path d="M1215 1025.0L1355 1025.0" fill="none" stroke="#183d50" stroke-width="28"/><text x="45" y="1120" font-size="28" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">形は比較用の概念図です。刃の厚み・片刃等は実物の仕様と指導で確認する。</text><text x="38" y="1176" font-size="22" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">独自の学習用模式図。実物・機種・自店の手順を確認し、実演を受ける。</text></svg>

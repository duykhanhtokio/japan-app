<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#087e85"/></marker></defs><rect width="100%" height="100%" fill="#fffdf6"/><rect width="100%" height="110" fill="#183d50"/><text x="40" y="67" font-size="38" fill="white" font-family="Noto Sans CJK JP,sans-serif">体調急変：通報・AED・誘導を分担する</text><ellipse cx="310" cy="535" rx="30" ry="25" fill="#e8c382" stroke="#183d50" stroke-width="4"/><rect x="345" y="510" width="260" height="55" rx="0" fill="#087e85" stroke="#183d50" stroke-width="4"/><path d="M605 525L720 490" fill="none" stroke="#183d50" stroke-width="14"/><path d="M605 550L725 585" fill="none" stroke="#183d50" stroke-width="14"/><text x="130" y="660" font-size="29" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">反応・呼吸の異常は緊急要請を遅らせない</text><ellipse cx="1050" cy="310" rx="20" ry="24" fill="#e8c382" stroke="#183d50" stroke-width="4"/><path d="M1028 340L1072 340L1077 410L1023 410Z" fill="#087e85" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1038 410L1025 465" fill="none" stroke="#183d50" stroke-width="5"/><path d="M1062 410L1076 465" fill="none" stroke="#183d50" stroke-width="5"/><path d="M1028 345L995 385" fill="none" stroke="#183d50" stroke-width="5"/><path d="M1072 345L1105 385" fill="none" stroke="#183d50" stroke-width="5"/><rect x="1100" y="280" width="70" height="135" rx="0" fill="#183d50" stroke="#183d50" stroke-width="4"/><rect x="1110" y="300" width="50" height="75" rx="0" fill="#cee2eb" stroke="#183d50" stroke-width="4"/><text x="1000" y="220" font-size="34" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">119番通報</text><text x="950" y="590" font-size="28" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">指令員の質問・指示に従う</text><rect x="1370" y="340" width="260" height="175" rx="15" fill="#e8c382" stroke="#183d50" stroke-width="8"/><rect x="1450" y="300" width="95" height="45" rx="0" fill="none" stroke="#183d50" stroke-width="10"/><path d="M1515 365L1470 430L1510 430L1465 495" fill="none" stroke="#183d50" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text x="1380" y="220" font-size="34" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">AEDを手配</text><path d="M1175 690L1650 690" fill="none" stroke="#087e85" stroke-width="7" marker-end="url(#arr)"/><rect x="1395" y="730" width="180" height="155" rx="0" fill="#fffdf6" stroke="#183d50" stroke-width="8"/><path d="M1510 735L1510 885" fill="none" stroke="#183d50" stroke-width="5"/><text x="1170" y="940" font-size="28" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">別の担当：入口の誘導と周囲の安全</text><text x="70" y="840" font-size="29" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">病名を独断で決めない。受講した応急手当の手順へつなぐ。</text><text x="38" y="976" font-size="22" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">独自の学習用模式図。実物・機種・自店の手順を確認し、実演を受ける。</text></svg>

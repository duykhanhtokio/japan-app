<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#087e85"/></marker></defs><rect width="100%" height="100%" fill="#fffdf6"/><rect width="100%" height="110" fill="#183d50"/><text x="40" y="67" font-size="38" fill="white" font-family="Noto Sans CJK JP,sans-serif">食品加工機械：種類ごとの防護部位</text><text x="45" y="180" font-size="32" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">切断・切削機</text><rect x="135" y="350" width="500" height="65" rx="0" fill="#cee2eb" stroke="#183d50" stroke-width="4"/><ellipse cx="380" cy="315" rx="90" ry="90" fill="#e8c382" stroke="#183d50" stroke-width="4"/><path d="M280 315A100 100 0 0 1 480 315" fill="#087e85" stroke="#087e85" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><text x="105" y="510" font-size="28" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">不要な刃の露出を防ぐ</text><text x="835" y="180" font-size="32" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">粉砕・混合機</text><path d="M1005 265L1285 265L1225 410L1065 410Z" fill="#cee2eb" stroke="#183d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="995" y="242" width="300" height="25" rx="0" fill="#087e85" stroke="#183d50" stroke-width="4"/><path d="M1145 270L1145 395" fill="none" stroke="#183d50" stroke-width="5"/><path d="M1080 355L1210 355" fill="none" stroke="#183d50" stroke-width="5"/><text x="885" y="510" font-size="28" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">開口部の転落・接触を防ぐ</text><text x="45" y="615" font-size="32" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">ロール機</text><rect x="165" y="655" width="400" height="210" rx="0" fill="none" stroke="#087e85" stroke-width="15"/><ellipse cx="290" cy="770" rx="65" ry="65" fill="#e8c382" stroke="#183d50" stroke-width="4"/><ellipse cx="430" cy="770" rx="65" ry="65" fill="#e8c382" stroke="#183d50" stroke-width="4"/><text x="115" y="945" font-size="28" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">巻き込まれる所を防護する</text><text x="835" y="615" font-size="32" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">成形・圧縮機</text><rect x="955" y="655" width="400" height="230" rx="0" fill="none" stroke="#087e85" stroke-width="15"/><rect x="1035" y="695" width="240" height="40" rx="0" fill="#e8c382" stroke="#183d50" stroke-width="4"/><rect x="1035" y="825" width="240" height="40" rx="0" fill="#e8c382" stroke="#183d50" stroke-width="4"/><path d="M1155 740L1155 803" fill="none" stroke="#087e85" stroke-width="6" marker-end="url(#arr)"/><text x="905" y="945" font-size="28" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">挟まれ・巻き込まれを防ぐ</text><text x="45" y="1050" font-size="27" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">投入・取出しと、掃除・詰まり調整を区別。停止・再始動防止は指定手順で確認する。</text><text x="38" y="1076" font-size="22" fill="#183d50" font-family="Noto Sans CJK JP,sans-serif">独自の学習用模式図。実物・機種・自店の手順を確認し、実演を受ける。</text></svg>

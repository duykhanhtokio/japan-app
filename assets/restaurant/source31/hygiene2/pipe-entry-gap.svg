<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#fffaf0"/><text x="70" y="75" font-size="40" font-family="Noto Sans CJK JP" fill="#183b49">配管の貫通部：小さな隙間も点検する</text><rect x="550" y="160" width="300" height="530" fill="#bdc8cc" stroke="#183b49" stroke-width="8"/><circle cx="700" cy="415" r="146" fill="#fffaf0" stroke="#183b49" stroke-width="5"/><circle cx="700" cy="415" r="105" fill="#6c9eaf" stroke="#183b49" stroke-width="8"/><circle cx="700" cy="415" r="75" fill="#dceaf0"/><path d="M554 395 L554 435 M595 395 L595 435 M554 415 L595 415" stroke="#b65336" stroke-width="5"/><text x="100" y="640" font-size="34" font-family="Noto Sans CJK JP" fill="#183b49">隙間の目安：約2cm</text><text x="870" y="350" font-size="34" font-family="Noto Sans CJK JP" fill="#183b49">壁を貫く配管</text><text x="870" y="410" font-size="32" font-family="Noto Sans CJK JP" fill="#183b49">周囲の開口を確認</text><text x="90" y="745" font-size="30" font-family="Noto Sans CJK JP" fill="#183b49">寸法は資料の例。図の縮尺・安全な上限を示すものではない。</text><text x="90" y="800" font-size="30" font-family="Noto Sans CJK JP" fill="#183b49">小さければ安全とは断定せず、専門担当と補修方法を相談する。</text><path d="M485 620 L574 430 M1020 440 L840 415" stroke="#b65336" stroke-width="5"/></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#fffaf0"/><text x="65" y="70" font-size="40" font-family="Noto Sans CJK JP" fill="#183b49">参考様式の練習：対象外を分母から外す</text><text x="65" y="125" font-size="28" font-family="Noto Sans CJK JP" fill="#183b49">下の配点は練習用。公式監視票の採点そのものではない。</text><path d="M65 190V630" stroke="#183b49" stroke-width="3"/><path d="M620 190V630" stroke="#183b49" stroke-width="3"/><path d="M850 190V630" stroke="#183b49" stroke-width="3"/><path d="M1110 190V630" stroke="#183b49" stroke-width="3"/><path d="M1330 190V630" stroke="#183b49" stroke-width="3"/><path d="M65 190H1330" stroke="#183b49" stroke-width="3"/><path d="M65 270H1330" stroke="#183b49" stroke-width="3"/><path d="M65 390H1330" stroke="#183b49" stroke-width="3"/><path d="M65 510H1330" stroke="#183b49" stroke-width="3"/><path d="M65 630H1330" stroke="#183b49" stroke-width="3"/><text x="90" y="245" font-size="28" font-family="Noto Sans CJK JP" fill="#183b49">確認項目</text><text x="650" y="245" font-size="28" font-family="Noto Sans CJK JP" fill="#183b49">練習の配点</text><text x="890" y="245" font-size="28" font-family="Noto Sans CJK JP" fill="#183b49">得点</text><text x="1140" y="245" font-size="28" font-family="Noto Sans CJK JP" fill="#183b49">対象</text><text x="90" y="345" font-size="30" font-family="Noto Sans CJK JP" fill="#183b49">衛生計画と現場が対応</text><text x="710" y="345" font-size="30" font-family="Noto Sans CJK JP" fill="#183b49">6</text><text x="930" y="345" font-size="30" font-family="Noto Sans CJK JP" fill="#183b49">6</text><text x="1140" y="345" font-size="30" font-family="Noto Sans CJK JP" fill="#183b49">対象</text><text x="90" y="465" font-size="30" font-family="Noto Sans CJK JP" fill="#183b49">教育後の実演を確認</text><text x="710" y="465" font-size="30" font-family="Noto Sans CJK JP" fill="#183b49">4</text><text x="930" y="465" font-size="30" font-family="Noto Sans CJK JP" fill="#183b49">0</text><text x="1140" y="465" font-size="30" font-family="Noto Sans CJK JP" fill="#183b49">対象</text><text x="90" y="585" font-size="30" font-family="Noto Sans CJK JP" fill="#183b49">この例では使わない設備</text><text x="710" y="585" font-size="30" font-family="Noto Sans CJK JP" fill="#183b49">2</text><text x="930" y="585" font-size="30" font-family="Noto Sans CJK JP" fill="#183b49">—</text><text x="1140" y="585" font-size="30" font-family="Noto Sans CJK JP" fill="#183b49">対象外</text><text x="90" y="720" font-size="34" font-family="Noto Sans CJK JP" fill="#183b49">分母：6＋4＝10点　　分子：6＋0＝6点</text><text x="90" y="785" font-size="36" font-family="Noto Sans CJK JP" fill="#183b49">この練習の得点率：6÷10×100＝60％</text><text x="90" y="850" font-size="28" font-family="Noto Sans CJK JP" fill="#183b49">実際の適用・対象外の判断は監視担当の基準で確認する。</text></svg>

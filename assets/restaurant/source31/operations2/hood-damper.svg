<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680"><rect width="1000" height="680" fill="#f4f7fa"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#17324d"><text x="40" y="50" font-size="30">フード・ダクト・ダンパーの位置関係</text><text x="40" y="88" font-size="20">独自の模式断面。実機の構造・寸法・点検手順を示す図ではない。</text><path d="M190 410 L280 230 H620 L710 410 Z" fill="#b7c7d4" stroke="#334b5f" stroke-width="6"/><rect x="330" y="120" width="240" height="110" fill="#d9e4ec" stroke="#334b5f" stroke-width="6"/><rect x="350" y="145" width="200" height="15" rx="6" fill="#586e80"/><circle cx="450" cy="152" r="12" fill="#1c516d"/><path d="M200 430 H700" stroke="#334b5f" stroke-width="12"/><path d="M250 500 H650 V580 H250 Z" fill="#d7e2e6" stroke="#334b5f" stroke-width="5"/><ellipse cx="450" cy="495" rx="110" ry="20" fill="#f4ca73"/><path d="M365 460 C335 410 375 380 360 340 M450 460 C425 410 465 390 450 340 M535 460 C510 410 550 390 535 340" stroke="#318a9a" stroke-width="8" fill="none"/><text x="680" y="156" font-size="26">ダンパー</text><path d="M660 150 H560" stroke="#17324d" stroke-width="3"/><text x="60" y="195" font-size="25">ダクト</text><path d="M145 190 H320" stroke="#17324d" stroke-width="3"/><text x="740" y="350" font-size="26">フード</text><path d="M725 340 H660" stroke="#17324d" stroke-width="3"/><text x="750" y="470" font-size="23">排気の方向</text><text x="65" y="625" font-size="24">油汚れを放置せず、所定の点検・清掃を適切な担当へつなぐ。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680"><rect width="1000" height="680" fill="#f4f7fa"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#17324d"><text x="40" y="50" font-size="30">同じ売上で標準と実際を比べる</text><text x="40" y="88" font-size="20">独自練習：売上 1,000,000円。面積は金額の構成を表す。</text><text x="40" y="212" font-size="28">標準</text><rect x="200" y="160" width="222.0" height="100" fill="#dc783c"/><rect x="422.0" y="160" width="518.0" height="100" fill="#3b9c91"/><text x="210" y="202" font-size="20">原価 300,000円</text><text x="210" y="235" font-size="22">30％</text><text x="437.0" y="202" font-size="24">粗利益 700,000円</text><text x="437.0" y="235" font-size="22">70％</text><text x="40" y="402" font-size="28">実際</text><rect x="200" y="350" width="236.8" height="100" fill="#dc783c"/><rect x="436.8" y="350" width="503.2" height="100" fill="#3b9c91"/><text x="210" y="392" font-size="20">原価 320,000円</text><text x="210" y="425" font-size="22">32％</text><text x="451.8" y="392" font-size="24">粗利益 680,000円</text><text x="451.8" y="425" font-size="22">68％</text><path d="M422 275 V320 H437 V340" fill="none" stroke="#b23a48" stroke-width="4"/><text x="470" y="306" font-size="21">原価の増加 20,000円 → 粗利益の減少 20,000円</text><text x="60" y="540" font-size="25">実際原価：100,000 ＋ 330,000 − 110,000 ＝ 320,000円</text><text x="60" y="590" font-size="25">差の向き：実際 − 標準 ＝ ＋2パーセントポイント</text><text x="60" y="635" font-size="20">率の相対増加や、全店共通の管理基準を表す図ではありません。</text></g></svg>

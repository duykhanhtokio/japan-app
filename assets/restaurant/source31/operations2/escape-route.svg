<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680"><rect width="1000" height="680" fill="#f4f7fa"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#17324d"><text x="40" y="50" font-size="28">煙のある出口へ近づかず、別の安全な経路を考える</text><text x="40" y="88" font-size="19">独自の避難経路模式図。実店舗では消防計画・誘導・現場の安全を確認する。</text><path d="M100 200 V140 H880 V540 H100 V410 M100 200 V320 M100 410 V370" fill="none" stroke="#355065" stroke-width="14"/><path d="M600 145 V340 H880 M450 540 V400" fill="none" stroke="#355065" stroke-width="10"/><circle cx="100" cy="180" r="40" fill="#818996" opacity=".65"/><circle cx="150" cy="205" r="40" fill="#818996" opacity=".65"/><circle cx="200" cy="160" r="40" fill="#818996" opacity=".65"/><circle cx="230" cy="240" r="40" fill="#818996" opacity=".65"/><circle cx="115" cy="270" r="40" fill="#818996" opacity=".65"/><rect x="300" y="270" width="90" height="60" rx="12" fill="#d5e1e7" stroke="#7291a4" stroke-width="3"/><rect x="420" y="270" width="90" height="60" rx="12" fill="#d5e1e7" stroke="#7291a4" stroke-width="3"/><rect x="700" y="440" width="90" height="60" rx="12" fill="#d5e1e7" stroke="#7291a4" stroke-width="3"/><path d="M620 420 H530 V375 H280 V345 H70" fill="none" stroke="#168a69" stroke-width="14" stroke-linejoin="round"/><path d="M70 345 l35 -22 v44 Z" fill="#168a69"/><circle cx="620" cy="420" r="17" fill="#168a69"/><text x="635" y="415" font-size="22">現在地</text><text x="260" y="200" font-size="27">煙</text><text x="150" y="370" font-size="22">使える経路を確認</text><text x="40" y="590" font-size="24">口・鼻を覆い、必要時は低い姿勢。袋探しで避難を遅らせない。</text><text x="40" y="635" font-size="21">避難後：人数・取り残しを消防へ報告。書類や私物を取りに戻らない。</text></g></svg>

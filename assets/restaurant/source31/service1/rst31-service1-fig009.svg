<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect x="3" y="3" width="1394" height="894" rx="24" fill="#faf8f0" stroke="#17624c" stroke-width="5"/><text x="700" y="74" font-size="42" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">食事中の窒息を見分け、通報を遅らせない</text><text x="350" y="160" font-size="36" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">咳が十分できる</text><ellipse cx="345" cy="280" rx="60" ry="65" fill="#e5b995" stroke="#24384b" stroke-width="5"/><rect x="245" y="350" width="200" height="255" rx="55" fill="#17624c" stroke="#24384b" stroke-width="5"/><path d="M 395 302 Q 475 280 505 320" fill="none" stroke="#55869b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 415 335 Q 505 335 550 375" fill="none" stroke="#55869b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><line x1="285" y1="610" x2="270" y2="730" stroke="#24384b" stroke-width="24" stroke-linecap="round" /><line x1="400" y1="610" x2="420" y2="730" stroke="#24384b" stroke-width="24" stroke-linecap="round" /><text x="350" y="790" font-size="30" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">咳を続けてもらい見守る</text><text x="1040" y="160" font-size="36" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">声が出ない・咳が弱い</text><ellipse cx="1040" cy="280" rx="60" ry="65" fill="#e5b995" stroke="#24384b" stroke-width="5"/><rect x="940" y="350" width="200" height="255" rx="55" fill="#17624c" stroke="#24384b" stroke-width="5"/><path d="M 970 400 L 1010 340 L 1040 345" fill="none" stroke="#e5b995" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1110 400 L 1070 340 L 1040 345" fill="none" stroke="#e5b995" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/><line x1="980" y1="610" x2="960" y2="730" stroke="#24384b" stroke-width="24" stroke-linecap="round" /><line x1="1100" y1="610" x2="1120" y2="730" stroke="#24384b" stroke-width="24" stroke-linecap="round" /><rect x="1200" y="480" width="95" height="170" rx="15" fill="#24384b" stroke="#24384b" stroke-width="5"/><text x="1247" y="550" font-size="28" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK JP">119</text><text x="1040" y="790" font-size="30" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">直ちに通報・応援を依頼</text><text x="700" y="856" font-size="28" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">独立作成した模式図。本文の条件と店の方法を確認する。</text></svg>

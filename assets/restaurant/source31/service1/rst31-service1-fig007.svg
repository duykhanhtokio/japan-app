<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect x="3" y="3" width="1394" height="894" rx="24" fill="#faf8f0" stroke="#17624c" stroke-width="5"/><text x="700" y="74" font-size="42" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">二本の箸の動く側を比べる</text><text x="700" y="160" font-size="34" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">右利きの教材例：下を保ち、上を動かす</text><path d="M 250 570 Q 190 490 235 400 L 355 350 Q 430 355 480 420 L 560 475 L 525 560 L 440 540 L 340 650 Z" fill="#e5b995" stroke="#24384b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 310 405 Q 380 350 470 405 L 520 440 L 490 485 L 420 445 L 350 480" fill="#e5b995" stroke="#24384b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="390" y1="520" x2="1110" y2="620" stroke="#c99138" stroke-width="16" stroke-linecap="round" /><line x1="400" y1="410" x2="1120" y2="560" stroke="#c99138" stroke-width="16" stroke-linecap="round" /><line x1="400" y1="410" x2="1120" y2="400" stroke="#c99138" stroke-width="9" stroke-linecap="round" stroke-dasharray="15 12"/><text x="990" y="330" font-size="32" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">上の箸：動く</text><path d="M 1140 420 Q 1195 485 1145 550" fill="none" stroke="#17624c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><line x1="1145" y1="540" x2="1133" y2="560" stroke="#17624c" stroke-width="7" stroke-linecap="round" /><line x1="1133" y1="560" x2="1133.8081699074155" y2="540.016335135898" stroke="#17624c" stroke-width="7" stroke-linecap="round" /><line x1="1133" y1="560" x2="1150.252330217777" y2="549.8828313221146" stroke="#17624c" stroke-width="7" stroke-linecap="round" /><text x="950" y="710" font-size="32" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">下の箸：位置を保つ</text><text x="700" y="856" font-size="28" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">独立作成した模
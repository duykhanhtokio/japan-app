<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect x="3" y="3" width="1394" height="894" rx="24" fill="#faf8f0" stroke="#17624c" stroke-width="5"/><text x="700" y="74" font-size="42" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">口や料理が触れる場所を避けて持つ</text><text x="350" y="160" font-size="34" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">グラスは下半分</text><path d="M 210 260 L 235 620 Q 350 680 465 620 L 490 260 Z" fill="#e5f0ef" stroke="#55869b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="350" cy="260" rx="140" ry="30" fill="#fff" stroke="#55869b" stroke-width="5"/><line x1="200" y1="455" x2="500" y2="455" stroke="#c99138" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 9"/><path d="M 420 550 Q 490 500 550 535 L 565 610 Q 515 650 450 622 Z" fill="#e5b995" stroke="#24384b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="440" y="540" width="120" height="38" rx="19" fill="#e5b995" stroke="#24384b" stroke-width="5"/><rect x="445" y="582" width="115" height="34" rx="17" fill="#e5b995" stroke="#24384b" stroke-width="5"/><text x="350" y="730" font-size="32" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">口が触れる縁を避ける</text><text x="1030" y="160" font-size="34" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">皿は底を支える</text><ellipse cx="1000" cy="350" rx="240" ry="50" fill="#fff" stroke="#24384b" stroke-width="5"/><ellipse cx="1000" cy="337" rx="165" ry="20" fill="#e0af76" stroke="#24384b" stroke-width="5"/><path d="M 785 365 Q 1000 435 1210 365" fill="none" stroke="#24384b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1165 390 Q 1210 390 1235 430 L 1220 555 L 1130 540 Q 1090 505 1110 460 L 1165 425 Z" fill="#e5b995" stroke="#24384b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="1000" y="395" width="185" height="38" rx="19" fill="#e5b995" stroke="#24384b" stroke-width="5"/><path d="M 1198 413 L 1235 365 Q 1258 350 1270 370 L 1240 430" fill="#e5b995" stroke="#24384b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="1035" y="635" font-size="30" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">親指は縁へ・他の指は底へ</text><text x="1035" y="730" font-size="32" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">料理に指を入れない</text><text x="700" y="856" font-size="28" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">独立作成した模式図。本文の条件と店の方法を確認する。</text></svg>

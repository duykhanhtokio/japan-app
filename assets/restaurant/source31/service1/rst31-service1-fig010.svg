<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect x="3" y="3" width="1394" height="894" rx="24" fill="#faf8f0" stroke="#17624c" stroke-width="5"/><text x="700" y="74" font-size="42" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">窒息の手技は対象・反応で区別する</text><text x="380" y="150" font-size="34" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">成人の背面・位置の理解</text><ellipse cx="370" cy="245" rx="55" ry="60" fill="#e5b995" stroke="#24384b" stroke-width="5"/><path d="M 260 320 Q 370 295 480 320 L 515 650 Q 370 700 225 650 Z" fill="#d7e5e0" stroke="#24384b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 280 370 Q 320 340 345 400 L 325 470 Z" fill="#e5d5ac" stroke="#24384b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 460 370 Q 420 340 395 400 L 415 470 Z" fill="#e5d5ac" stroke="#24384b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="370" y1="335" x2="370" y2="620" stroke="#55869b" stroke-width="4" stroke-linecap="round" /><ellipse cx="370" cy="405" rx="25" ry="25" fill="#ad3f38" stroke="#24384b" stroke-width="5"/><line x1="590" y1="385" x2="410" y2="405" stroke="#17624c" stroke-width="7" stroke-linecap="round" /><line x1="410" y1="405" x2="426.3854268045746" y2="393.53187947255833" stroke="#17624c" stroke-width="7" stroke-linecap="round" /><line x1="410" y1="405" x2="428.5031745592673" y2="412.59160926479257" stroke="#17624c" stroke-width="7" stroke-linecap="round" /><text x="790" y="330" font-size="34" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">左右の肩甲骨の間</text><text x="790" y="385" font-size="34" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">手の付け根を使う</text><path d="M 655 510 L 760 495 Q 810 500 825 540 L 808 585 L 700 590 Z" fill="#e5b995" stroke="#24384b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="710" y="430" width="35" height="95" rx="16" fill="#e5b995" stroke="#24384b" stroke-width="5"/><rect x="752" y="420" width="35" height="100" rx="16" fill="#e5b995" stroke="#24384b" stroke-width="5"/><rect x="794" y="435" width="35" height="105" rx="16" fill="#e5b995" stroke="#24384b" stroke-width="5"/><ellipse cx="735" cy="565" rx="30" ry="20" fill="#ad3f38" stroke="#24384b" stroke-width="5"/><text x="1040" y="550" font-size="32" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">手の付け根</text><line x1="1030" y1="570" x2="780" y2="570" stroke="#17624c" stroke-width="7" stroke-linecap="round" /><line x1="780" y1="570" x2="797.5516512378075" y2="560.4114892279159" stroke="#17624c" stroke-width="7" stroke-linecap="round" /><line x1="780" y1="570" x2="797.5516512378075" y2="579.5885107720841" stroke="#17624c" stroke-width="7" stroke-linecap="round" /><text x="700" y="720" font-size="30" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">まず背部叩打法。効果がなければ次の方法へ。</text><text x="700" y="770" font-size="30" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">反応がなくなったら心肺蘇生の手順へ。</text><text x="700" y="856" font-size="28" fill="#24384b" text-anchor="middle" font-family="Noto Sans CJK JP">独立作成した模式図。本文の条件と店の方法を確認する。</text></svg>

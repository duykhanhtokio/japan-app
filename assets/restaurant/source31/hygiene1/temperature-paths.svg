<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="670" viewBox="0 0 1160 670"><rect width="100%" height="100%" fill="#fffdf8"/><g font-family="Noto Sans CJK JP,sans-serif" fill="#183b4e"><text x="45" y="45" font-size="30" fill="#183b4e">工程によって温度の動きが違う</text><text x="45" y="80" font-size="19" fill="#183b4e">模式図：時間の長さや最高温度の基準を示す図ではありません</text><rect x="85" y="220" width="1010" height="235" fill="#fff0db"/><path d="M85 130 V540 H1110" fill="none" stroke="#183b4e" stroke-width="3"/><text x="15" y="225" font-size="20" fill="#183b4e">60℃</text><text x="15" y="455" font-size="20" fill="#183b4e">10℃</text><text x="930" y="585" font-size="22" fill="#183b4e">時間 →</text><text x="110" y="255" font-size="20" fill="#183b4e">資料の危険温度帯</text><text x="115" y="125" font-size="22" fill="#183b4e">非加熱で提供</text><path d="M120 490 H340" fill="none" stroke="#18689a" stroke-width="7" stroke-linejoin="round"/><text x="430" y="125" font-size="22" fill="#183b4e">加熱して提供</text><path d="M440 490 L545 155 H650" fill="none" stroke="#aa3150" stroke-width="7" stroke-linejoin="round"/><text x="740" y="125" font-size="22" fill="#183b4e">冷却・再加熱</text><path d="M750 490 L810 155 L895 490 H940 L1020 155" fill="none" stroke="#8c5b18" stroke-width="7" stroke-linejoin="round"/><text x="110" y="620" font-size="22" fill="#183b4e">低温を保つ</text><text x="440" y="620" font-size="22" fill="#183b4e">中心の加熱を確認</text><text x="750" y="620" font-size="22" fill="#183b4e">冷却も再加熱も確認</text></g></svg>

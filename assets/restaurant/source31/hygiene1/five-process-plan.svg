<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660"><rect width="100%" height="100%" fill="#fffdf8"/><g font-family="Noto Sans CJK JP,sans-serif" fill="#183b4e"><text x="40" y="45" font-size="29" fill="#183b4e">重要管理計画：三群を五つの工程欄へ</text><text x="40" y="82" font-size="19" fill="#183b4e">左は工程、中央は料理、右は確認方法。これは独立した架空の計画例です。</text><rect x="40" y="110" width="1040" height="90" fill="#eef7fb" stroke="#607987"/><text x="55" y="162" font-size="22" fill="#183b4e">非加熱・冷製</text><text x="320" y="162" font-size="22" fill="#183b4e">冷奴</text><text x="590" y="162" font-size="20" fill="#183b4e">低温保管から取り出し、すぐ提供</text><rect x="40" y="200" width="1040" height="90" fill="#fceef0" stroke="#607987"/><text x="55" y="252" font-size="22" fill="#183b4e">加熱・熱提供</text><text x="320" y="252" font-size="22" fill="#183b4e">焼き魚</text><text x="590" y="252" font-size="20" fill="#183b4e">検証した加熱条件と中心を確認</text><rect x="40" y="290" width="1040" height="90" fill="#fff4da" stroke="#607987"/><text x="55" y="342" font-size="22" fill="#183b4e">加熱後・高温保管</text><text x="320" y="342" font-size="22" fill="#183b4e">保温するごはん</text><text x="590" y="342" font-size="20" fill="#183b4e">保管中の温度を計画通り確認</text><rect x="40" y="380" width="1040" height="90" fill="#eef5e8" stroke="#607987"/><text x="55" y="432" font-size="22" fill="#183b4e">冷却・再加熱</text><text x="320" y="432" font-size="22" fill="#183b4e">翌日のカレー</text><text x="590" y="432" font-size="20" fill="#183b4e">冷却と再加熱の時間・温度を確認</text><rect x="40" y="470" width="1040" height="90" fill="#f2edfb" stroke="#607987"/><text x="55" y="522" font-size="22" fill="#183b4e">冷却・冷製提供</text><text x="320" y="522" font-size="22" fill="#183b4e">ポテトサラダ</text><text x="590" y="522" font-size="20" fill="#183b4e">加熱後の冷却、保存、提供を確認</text><path d="M300 110 V560 M570 110 V560" stroke="#607987"/><text x="45" y="610" font-size="22" fill="#183b4e">練習用空欄：料理＿＿＿＿＿　実際の工程＿＿＿＿＿　確認方法＿＿＿＿＿</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650"><rect width="100%" height="100%" fill="#fffdf8"/><g font-family="Noto Sans CJK JP,sans-serif" fill="#183b4e"><text x="40" y="45" font-size="30" fill="#183b4e">一般衛生の実施記録を読む（架空例）</text><text x="40" y="80" font-size="20" fill="#183b4e">基準：冷蔵10℃以下。空欄は未確認。実測と基準を混ぜない。</text><path d="M55 115 V350" stroke="#527082"/><path d="M145 115 V350" stroke="#527082"/><path d="M290 115 V350" stroke="#527082"/><path d="M435 115 V350" stroke="#527082"/><path d="M585 115 V350" stroke="#527082"/><path d="M755 115 V350" stroke="#527082"/><path d="M1020 115 V350" stroke="#527082"/><path d="M55 115 H1020" stroke="#527082"/><path d="M55 170 H1020" stroke="#527082"/><path d="M55 230 H1020" stroke="#527082"/><path d="M55 290 H1020" stroke="#527082"/><path d="M55 350 H1020" stroke="#527082"/><text x="63" y="150" font-size="19" fill="#183b4e">日付</text><text x="153" y="150" font-size="19" fill="#183b4e">冷蔵 / 冷凍</text><text x="298" y="150" font-size="19" fill="#183b4e">受入れ</text><text x="443" y="150" font-size="19" fill="#183b4e">手洗い</text><text x="593" y="150" font-size="19" fill="#183b4e">日々確認</text><text x="763" y="150" font-size="19" fill="#183b4e">確認者</text><text x="63" y="205" font-size="20" fill="#183b4e">5/1</text><text x="153" y="205" font-size="20" fill="#183b4e">4℃ / −18℃</text><text x="298" y="205" font-size="20" fill="#183b4e">良</text><text x="443" y="205" font-size="20" fill="#183b4e">否</text><text x="593" y="205" font-size="20" fill="#183b4e">済</text><text x="763" y="205" font-size="20" fill="#183b4e">田中</text><text x="63" y="265" font-size="20" fill="#183b4e">5/2</text><text x="153" y="265" font-size="20" fill="#183b4e">12℃ / −18℃</text><text x="298" y="265" font-size="20" fill="#183b4e">良</text><text x="443" y="265" font-size="20" fill="#183b4e">良</text><text x="593" y="265" font-size="20" fill="#183b4e">済</text><text x="763" y="265" font-size="20" fill="#183b4e">佐藤</text><text x="63" y="325" font-size="20" fill="#183b4e">5/3</text><text x="153" y="325" font-size="20" fill="#183b4e">—</text><text x="298" y="325" font-size="20" fill="#183b4e">—</text><text x="443" y="325" font-size="20" fill="#183b4e">—</text><text x="593" y="325" font-size="20" fill="#183b4e">—</text><text x="763" y="325" font-size="20" fill="#183b4e">—</text><ellipse cx="475" cy="198" rx="28" ry="25" fill="none" stroke="#b02f42" stroke-width="3"/><ellipse cx="190" cy="259" rx="35" ry="23" fill="none" stroke="#b02f42" stroke-width="3"/><text x="55" y="405" font-size="23" fill="#183b4e">特記事項</text><text x="55" y="450" font-size="22" fill="#183b4e">5/1 10:10　会計後の手洗い忘れ → 洗い直しを確認。</text><text x="55" y="495" font-size="22" fill="#183b4e">5/2 08:00　冷蔵12℃ → 責任者へ報告し、食品は確認待ち。</text><text x="55" y="540" font-size="22" fill="#183b4e">同日08:15　処置後8℃を再確認。食品の使用判断は別に記録。</text><path d="M475 225 C500 370 170 365 150 425 M190 282 C180 375 105 400 105 470" fill="none" stroke="#b02f42" stroke-width="2"/><text x="55" y="605" font-size="22" fill="#183b4e">行の日付と列の項目を見て、同じ日付の特記事項へ結び付ける。</text></g></svg>

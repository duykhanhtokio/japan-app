<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect width="1400" height="1100" fill="#FFFAEF"/><text x="40" y="65" font-family="Noto Sans CJK JP" font-size="40" fill="#173750">燃料：資料の対応例を読み、実機は別に確認</text><text x="40" y="123" font-family="Noto Sans CJK JP" font-size="31" fill="#173750">燃料名</text><text x="490" y="123" font-family="Noto Sans CJK JP" font-size="31" fill="#173750">資料にある機械の例</text><rect x="35" y="150" width="1330" height="112" rx="10" fill="#F0F3EC" stroke="#B38432"/><path d="M455 150 V262" stroke="#B38432"/><text x="55" y="214" font-family="Noto Sans CJK JP" font-size="28" fill="#173750">ガソリン</text><text x="490" y="214" font-family="Noto Sans CJK JP" font-size="32" fill="#173750">管理機・移植機</text><rect x="35" y="270" width="1330" height="112" rx="10" fill="#F4EBD8" stroke="#B38432"/><path d="M455 270 V382" stroke="#B38432"/><text x="55" y="334" font-family="Noto Sans CJK JP" font-size="28" fill="#173750">軽油</text><text x="490" y="334" font-family="Noto Sans CJK JP" font-size="32" fill="#173750">トラクタ・コンバイン</text><rect x="35" y="390" width="1330" height="112" rx="10" fill="#F0F3EC" stroke="#B38432"/><path d="M455 390 V502" stroke="#B38432"/><text x="55" y="454" font-family="Noto Sans CJK JP" font-size="28" fill="#173750">ガソリンとオイルの混合油</text><text x="490" y="454" font-family="Noto Sans CJK JP" font-size="32" fill="#173750">2サイクルエンジンの草刈り機</text><rect x="35" y="510" width="1330" height="112" rx="10" fill="#F4EBD8" stroke="#B38432"/><path d="M455 510 V622" stroke="#B38432"/><text x="55" y="574" font-family="Noto Sans CJK JP" font-size="28" fill="#173750">重油・灯油</text><text x="490" y="574" font-family="Noto Sans CJK JP" font-size="32" fill="#173750">穀物乾燥機・温風暖房機</text><text x="40" y="700" font-family="Noto Sans CJK JP" font-size="29" fill="#173750">2号の色の例：ガソリンは薄いオレンジ系（購入店で差がある）。</text><text x="40" y="755" font-family="Noto Sans CJK JP" font-size="29" fill="#173750">軽油は薄黄色、灯油は無色。色だけで油種・品質・適合を決めません。</text><text x="40" y="835" font-family="Noto Sans CJK JP" font-size="29" fill="#173750">実機の表示・取扱説明書を確認します。混合比や法要件は別に確認。</text><text x="40" y="900" font-family="Noto Sans CJK JP" font-size="29" fill="#173750">掲載例を、全ての管理機・全てのトラクタの指定燃料へ広げません。</text><text x="40" y="1010" font-family="Noto Sans CJK JP" font-size="29" fill="#173750">出典の位置：1号PDF42（印刷36）・2号PDF58（印刷56）。</text><text x="40" y="1060" font-family="Noto Sans CJK JP" font-size="25" fill="#173750">資料の例の読み取り。燃料選択・給油操作・現行の着色義務の認定ではありません。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><g font-family="Noto Sans CJK JP" fill="#173750"><rect x="20" y="20" width="1160" height="610" rx="28" fill="#FFFAEC" stroke="#B38432" stroke-width="3"/><text x="55" y="78" font-size="34" text-anchor="start">見えなくなる部分と、表面を整える仕事</text><path d="M55,101 L1145,101" fill="none" stroke="#B38432" stroke-width="2" stroke-linecap="round"/><rect x="55" y="135" width="533" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="77" y="185" font-size="29" text-anchor="start">閉じる前の接点</text><text x="77" y="235" font-size="24" text-anchor="start">配線・配管と設備の開口</text><text x="77" y="275" font-size="24" text-anchor="start">図面・担当者との照合</text><text x="77" y="315" font-size="24" text-anchor="start">表面の平滑さとは別</text><rect x="612" y="135" width="533" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="634" y="185" font-size="29" text-anchor="start">下地の継目と面</text><text x="634" y="235" font-size="24" text-anchor="start">テープ：継目の補強</text><text x="634" y="275" font-size="24" text-anchor="start">パテ：くぼみ・段差を整える</text><text x="634" y="315" font-size="24" text-anchor="start">研磨材：表面を滑らかに</text><text x="634" y="355" font-size="24" text-anchor="start">組合せ・条件は仕様で確認</text><rect x="125" y="397" width="345" height="135" rx="1" fill="#D8C398" stroke="#173750" stroke-width="3"/><path d="M192,414 L192,510" fill="none" stroke="#22766D" stroke-width="8" stroke-linecap="round"/><path d="M192,472 L416,472" fill="none" stroke="#22766D" stroke-width="8" stroke-linecap="round"/><path d="M281,414 L416,414" fill="none" stroke="#B38432" stroke-width="5" stroke-linecap="round"/><rect x="334" y="397" width="137" height="135" fill="#DDE5EA" fill-opacity="0.88" stroke="#173750" stroke-width="3"/><text x="298" y="551" font-size="22" text-anchor="middle">内部と閉じる面の関係</text><rect x="676" y="475" width="163" height="37" rx="1" fill="#DDE5EA" stroke="#173750" stroke-width="3"/><rect x="848" y="475" width="197" height="37" rx="1" fill="#DDE5EA" stroke="#173750" stroke-width="3"/><rect x="798" y="461" width="92" height="13" rx="1" fill="#D8E9E1" stroke="#22766D" stroke-width="3"/><path d="M763 461 Q842 448 923 461" fill="#E8D6AE" stroke="#B38432" stroke-width="3"/><text x="865" y="549" font-size="22" text-anchor="middle">継目の補強と表面の調整</text><text x="55" y="615" font-size="23" text-anchor="start">役割を比べる概念図・操作手順ではありません</text></g></svg>

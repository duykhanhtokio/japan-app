<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><g font-family="Noto Sans CJK JP" fill="#173750"><rect x="20" y="20" width="1160" height="610" rx="28" fill="#FFFAEC" stroke="#B38432" stroke-width="3"/><text x="55" y="78" font-size="34" text-anchor="start">屋根材の下の層と、雪への部材</text><path d="M55,101 L1145,101" fill="none" stroke="#B38432" stroke-width="2" stroke-linecap="round"/><rect x="55" y="135" width="533" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="77" y="185" font-size="29" text-anchor="start">下葺き材</text><text x="77" y="235" font-size="24" text-anchor="start">ルーフィングなど</text><text x="77" y="275" font-size="24" text-anchor="start">屋根材の下の防水層</text><text x="77" y="315" font-size="24" text-anchor="start">水切り：接点の雨仕舞</text><rect x="612" y="135" width="533" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="634" y="185" font-size="29" text-anchor="start">雪止め</text><text x="634" y="235" font-size="24" text-anchor="start">雪の滑り落ちを抑える</text><text x="634" y="275" font-size="24" text-anchor="start">雨どい：雨水を集め流す</text><text x="634" y="315" font-size="24" text-anchor="start">雪の条件と屋根の計画</text><path d="M117 444 L480 404 L484 439 L121 479 Z" fill="#D8C398" stroke="#173750" stroke-width="3"/><path d="M116,435 L480,395" fill="none" stroke="#22766D" stroke-width="10" stroke-linecap="round"/><path d="M116,420 L480,380" fill="none" stroke="#173750" stroke-width="15" stroke-linecap="round"/><text x="304" y="521" font-size="21" text-anchor="middle">上：屋根材　下：下葺き材</text><path d="M689 405 L1066 458" fill="none" stroke="#173750" stroke-width="9"/><path d="M877 432 L882 398 H900" fill="none" stroke="#B38432" stroke-width="7"/><path d="M1035 480 Q1064 526 1091 480" fill="none" stroke="#22766D" stroke-width="7"/><text x="842" y="549" font-size="22" text-anchor="middle">雪止め</text><text x="1058" y="549" font-size="22" text-anchor="middle">雨どい</text><text x="55" y="615" font-size="23" text-anchor="s
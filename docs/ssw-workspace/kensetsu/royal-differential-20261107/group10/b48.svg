<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><g font-family="Noto Sans CJK JP" fill="#173750"><rect x="20" y="20" width="1160" height="610" rx="28" fill="#FFFAEC" stroke="#B38432" stroke-width="3"/><text x="55" y="78" font-size="34" text-anchor="start">サッシの仮保持と、固定・接点</text><path d="M55,101 L1145,101" fill="none" stroke="#B38432" stroke-width="2" stroke-linecap="round"/><rect x="55" y="135" width="533" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="77" y="185" font-size="29" text-anchor="start">位置を仮に保つ</text><text x="77" y="235" font-size="24" text-anchor="start">くさびによる位置調整</text><text x="77" y="275" font-size="24" text-anchor="start">固定の完了とは別</text><rect x="612" y="135" width="533" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="634" y="185" font-size="29" text-anchor="start">力を伝える部分</text><text x="634" y="235" font-size="24" text-anchor="start">アンカー等の固定部</text><text x="634" y="275" font-size="24" text-anchor="start">溶接は仕様の一例</text><text x="634" y="315" font-size="24" text-anchor="start">充填・防水とも区別</text><rect x="118" y="413" width="257" height="34" rx="1" fill="#D8C398" stroke="#173750" stroke-width="3"/><rect x="118" y="510" width="257" height="27" rx="1" fill="#DDE5EA" stroke="#173750" stroke-width="3"/><path d="M151 508 L329 449 V508 Z" fill="#E8D6AE" stroke="#B38432" stroke-width="3"/><rect x="708" y="398" width="67" height="136" rx="1" fill="#D8C398" stroke="#173750" stroke-width="3"/><rect x="1004" y="398" width="50" height="136" rx="1" fill="#DDE5EA" stroke="#173750" stroke-width="3"/><path d="M746 454 H1026 V483" fill="none" stroke="#B38432" stroke-width="10"/><text x="876" y="551" font-size="22" text-anchor="middle">躯体側と枠側の固定部</text><text x="55" y="615" font-size="23" text-anchor="start">役割を比べる概念図・操作手順ではありません</text></g></svg>

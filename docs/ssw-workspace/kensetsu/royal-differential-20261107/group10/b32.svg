<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><g font-family="Noto Sans CJK JP" fill="#173750"><rect x="20" y="20" width="1160" height="610" rx="28" fill="#FFFAEC" stroke="#B38432" stroke-width="3"/><text x="55" y="78" font-size="34" text-anchor="start">屋根から落ちる二つの危険</text><path d="M55,101 L1145,101" fill="none" stroke="#B38432" stroke-width="2" stroke-linecap="round"/><rect x="55" y="135" width="533" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="77" y="185" font-size="29" text-anchor="start">端からの墜落</text><text x="77" y="235" font-size="24" text-anchor="start">滑る・バランスを崩す</text><text x="77" y="275" font-size="24" text-anchor="start">屋根の端から落ちる</text><rect x="612" y="135" width="533" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="634" y="185" font-size="29" text-anchor="start">踏み抜き</text><text x="634" y="235" font-size="24" text-anchor="start">屋根面を踏み抜いて落ちる</text><text x="634" y="275" font-size="24" text-anchor="start">見える面 ≠ 人を支える床</text><text x="634" y="315" font-size="24" text-anchor="start">指定の通路・作業床を確認</text><path d="M111,421 L368,421" fill="none" stroke="#173750" stroke-width="12" stroke-linecap="round"/><path d="M111,430 L111,531" fill="none" stroke="#173750" stroke-width="8" stroke-linecap="round"/><path d="M291 392 H406 V525 M397 513 L406 525 L415 513" fill="none" stroke="#B38432" stroke-width="5"/><text x="419" y="449" font-size="22" text-anchor="start">端</text><path d="M680,421 L831,421" fill="none" stroke="#173750" stroke-width="12" stroke-linecap="round"/><path d="M922,421 L1073,421" fill="none" stroke="#173750" stroke-width="12" stroke-linecap="round"/><path d="M831 421 L848 438 L858 424 M892 425 L904 440 L922 421 M877 385 V524 M868 512 L877 524 L886 512" fill="none" stroke="#B38432" stroke-width="5"/><text x="877" y="550" font-size="22" text-anchor="middle">屋根面を通り抜ける危険</text><text x="55" y="615" font-size="23" text-anchor="start">役割を比べる概念図・操作手順ではありません</text></g></svg>

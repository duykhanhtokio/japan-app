<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><g font-family="Noto Sans CJK JP" fill="#173750"><rect x="20" y="20" width="1160" height="610" rx="28" fill="#FFFAEC" stroke="#B38432" stroke-width="3"/><text x="55" y="78" font-size="34" text-anchor="start">車輪の有無と、クレーンの形式</text><path d="M55,101 L1145,101" fill="none" stroke="#B38432" stroke-width="2" stroke-linecap="round"/><rect x="55" y="135" width="533" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="77" y="185" font-size="29" text-anchor="start">ラフテレーン</text><text x="77" y="235" font-size="24" text-anchor="start">一つの運転席</text><text x="77" y="275" font-size="24" text-anchor="start">走行とクレーン操作</text><text x="77" y="315" font-size="24" text-anchor="start">自走式の機械</text><rect x="612" y="135" width="533" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="634" y="185" font-size="29" text-anchor="start">名称と構造</text><text x="634" y="235" font-size="24" text-anchor="start">トラッククレーン等と区別</text><text x="634" y="275" font-size="24" text-anchor="start">タイヤだけで分類しない</text><text x="634" y="315" font-size="24" text-anchor="start">機種の仕様に対応</text><rect x="145" y="379" width="231" height="50" rx="5" fill="#DDE5EA" stroke="#22766D" stroke-width="3"/><text x="260" y="413" font-size="24" text-anchor="middle">一つの運転席</text><path d="M260 430 V452 H167 V470 M260 452 H382 V470" fill="none" stroke="#22766D" stroke-width="3"/><rect x="105" y="472" width="129" height="50" rx="5" fill="#F5EAD1" stroke="#B38432" stroke-width="3"/><text x="169" y="505" font-size="23" text-anchor="middle">走行</text><rect x="277" y="472" width="210" height="50" rx="5" fill="#F5EAD1" stroke="#B38432" stroke-width="3"/><text x="382" y="505" font-size="23" text-anchor="middle">クレーン操作</text><rect x="674" y="395" width="394" height="45" rx="4" fill="#DDE5EA" stroke="#22766D" stroke-width="3"/><text x="871" y="426" font-size="24" text-anchor="middle">名称・構造・機種の仕様</text><text x="871" y="493" font-size="24" text-anchor="middle">タイヤだけで分類しない</text><text x="55" y="615" font-size="23" text-anchor="start">役割を比べる概念図・操作手順ではありません</text></g></svg>

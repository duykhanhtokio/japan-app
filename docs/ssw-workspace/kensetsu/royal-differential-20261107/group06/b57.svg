<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><g font-family="Noto Sans CJK JP" fill="#173750"><rect x="20" y="20" width="1160" height="610" rx="28" fill="#FFFAEC" stroke="#B38432" stroke-width="3"/><text x="55" y="78" font-size="34" text-anchor="start">工具名を、既習の働きへつなぐ</text><path d="M55,101 L1145,101" fill="none" stroke="#B38432" stroke-width="2" stroke-linecap="round"/><rect x="55" y="135" width="533" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="77" y="185" font-size="29" text-anchor="start">ボルシン</text><text x="77" y="235" font-size="24" text-anchor="start">鉄骨接合部の穴合わせ</text><text x="77" y="275" font-size="24" text-anchor="start">新しい穴をあける工具と別</text><text x="77" y="315" font-size="24" text-anchor="start">既習の接合工具へ対応</text><rect x="612" y="135" width="533" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="634" y="185" font-size="29" text-anchor="start">仮枠ハンマー</text><text x="634" y="235" font-size="24" text-anchor="start">型枠工事で用いる名称</text><text x="634" y="275" font-size="24" text-anchor="start">打つ部分と釘抜き部分等</text><text x="634" y="315" font-size="24" text-anchor="start">頭部・柄・作用は既習へ</text><rect x="117" y="411" width="192" height="79" rx="2" fill="#DDE5EA" stroke="#173750" stroke-width="3"/><rect x="137" y="427" width="192" height="79" rx="2" fill="#DDE5EA" stroke="#22766D" stroke-width="3"/><circle cx="221" cy="453" r="23" fill="#FFFAEC" stroke="#22766D" stroke-width="3"/><path d="M219 455 L369 406 L380 427 Z" fill="#E7CC8F" stroke="#173750" stroke-width="3"/><path d="M854,423 L854,512" fill="none" stroke="#D8C398" stroke-width="14" stroke-linecap="round"/><path d="M784 409 H861 L914 422 L896 433 L873 425 H784 Z" fill="#DDE5EA" stroke="#173750" stroke-width="3"/><path d="M890,420 L905,427" fill="none" stroke="#FFFAEC" stroke-width="3" stroke-linecap="round"/><text x="55" y="615" font-size="23" text-anchor="start">役割を比べる概念図・操作手順ではありません</text></g></svg>

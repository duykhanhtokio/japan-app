<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><g font-family="Noto Sans CJK JP" fill="#173750"><rect x="20" y="20" width="1160" height="610" rx="28" fill="#FFFAEC" stroke="#B38432" stroke-width="3"/><text x="55" y="78" font-size="34" text-anchor="start">鉄筋の位置と、端部・長さの道具</text><path d="M55,101 L1145,101" fill="none" stroke="#B38432" stroke-width="2" stroke-linecap="round"/><rect x="55" y="135" width="347" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="77" y="185" font-size="29" text-anchor="start">かぶりの例</text><text x="77" y="235" font-size="24" text-anchor="start">ドーナツ：側面</text><text x="77" y="275" font-size="24" text-anchor="start">キャラメル：床の下側</text><text x="77" y="315" font-size="24" text-anchor="start">材質と寸法も照合</text><rect x="426" y="135" width="347" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="448" y="185" font-size="29" text-anchor="start">別の位置・目的</text><text x="448" y="235" font-size="24" text-anchor="start">バーサポート：高さ保持</text><text x="448" y="275" font-size="24" text-anchor="start">プラキャップ：端を覆う</text><text x="448" y="315" font-size="24" text-anchor="start">同じ役割ではない</text><rect x="797" y="135" width="347" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="819" y="185" font-size="29" text-anchor="start">折尺</text><text x="819" y="235" font-size="24" text-anchor="start">節を折りたたむ定規</text><text x="819" y="275" font-size="24" text-anchor="start">巻いて収納する物と別</text><text x="819" y="315" font-size="24" text-anchor="start">全長は製品で確認</text><rect x="127" y="388" width="17" height="109" rx="2" fill="#D8C398" stroke="#173750" stroke-width="3"/><circle cx="184" cy="428" r="40" fill="#DDE5EA" stroke="#22766D" stroke-width="3"/><circle cx="184" cy="428" r="9" fill="#769AA5" stroke="#173750" stroke-width="2"/><path d="M154,506 L335,506" fill="none" stroke="#173750" stroke-width="3" stroke-linecap="round"/><rect x="246" y="468" width="44" height="37
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><g font-family="Noto Sans CJK JP" fill="#173750"><rect x="20" y="20" width="1160" height="610" rx="28" fill="#FFFAEC" stroke="#B38432" stroke-width="3"/><text x="55" y="78" font-size="34" text-anchor="start">保護するテープと、材料を扱うヘラ</text><path d="M55,101 L1145,101" fill="none" stroke="#B38432" stroke-width="2" stroke-linecap="round"/><rect x="55" y="135" width="533" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="77" y="185" font-size="29" text-anchor="start">マスキングテープ</text><text x="77" y="235" font-size="24" text-anchor="start">塗装する部分との境界</text><text x="77" y="275" font-size="24" text-anchor="start">付けたくない部分を保護</text><text x="77" y="315" font-size="24" text-anchor="start">シート付きマスカーと区別</text><rect x="612" y="135" width="533" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="634" y="185" font-size="29" text-anchor="start">ヘラ</text><text x="634" y="235" font-size="24" text-anchor="start">混ぜる・塗り広げる</text><text x="634" y="275" font-size="24" text-anchor="start">付着物を除く等</text><text x="634" y="315" font-size="24" text-anchor="start">材質・硬さ・先端形を対応</text><rect x="106" y="402" width="372" height="105" rx="2" fill="#DDE5EA" stroke="#173750" stroke-width="3"/><rect x="110" y="406" width="170" height="97" rx="1" fill="#D8E9E1" stroke="#22766D" stroke-width="3"/><path d="M281,405 L281,503" fill="none" stroke="#B38432" stroke-width="12" stroke-linecap="round"/><path d="M706 487 L749 424 H800 L843 487 Z" fill="#DDE5EA" stroke="#173750" stroke-width="3"/><rect x="757" y="379" width="35" height="46" rx="3" fill="#D8C398" stroke="#173750" stroke-width="3"/><path d="M919 487 L939 424 H982 L1002 487 Z" fill="#D8E9E1" stroke="#22766D" stroke-width="3"/><rect x="943" y="379" width="35" height="46" rx="3" fill="#D8C398" stroke="#173750" stroke-width="3"/><text x="55" y="615" font-size="23" text-anchor="start">役割を比べる概念図・操作手順ではありません</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><g font-family="Noto Sans CJK JP" fill="#173750"><rect x="20" y="20" width="1160" height="610" rx="28" fill="#FFFAEC" stroke="#B38432" stroke-width="3"/><text x="55" y="78" font-size="34" text-anchor="start">混和剤は目的と名称を分ける</text><path d="M55,101 L1145,101" fill="none" stroke="#B38432" stroke-width="2" stroke-linecap="round"/><rect x="55" y="135" width="347" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="77" y="185" font-size="29" text-anchor="start">加える対象</text><text x="77" y="235" font-size="24" text-anchor="start">コンクリートの性質を調整</text><text x="77" y="275" font-size="24" text-anchor="start">型枠に塗る剥離剤とは別</text><text x="77" y="315" font-size="24" text-anchor="start">基本材料と加える材料</text><rect x="426" y="135" width="347" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="448" y="185" font-size="29" text-anchor="start">減水剤</text><text x="448" y="235" font-size="24" text-anchor="start">セメント粒子の分散</text><text x="448" y="275" font-size="24" text-anchor="start">必要な流動性と単位水量</text><text x="448" y="315" font-size="24" text-anchor="start">減衰剤を分類名にしない</text><rect x="797" y="135" width="347" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="819" y="185" font-size="29" text-anchor="start">性質の違い</text><text x="819" y="235" font-size="24" text-anchor="start">流動化剤：流動性</text><text x="819" y="275" font-size="24" text-anchor="start">硬化促進剤：硬化</text><text x="819" y="315" font-size="24" text-anchor="start">量の自己判断を認めない</text><rect x="111" y="436" width="233" height="56" rx="2" fill="#DDE5EA" stroke="#173750" stroke-width="3"/><path d="M202 385 H246 L239 418 H209 Z" fill="#E7CC8F" stroke="#173750" stroke-width="2"/><path d="M224,420 L224,433" fill="none" stroke="#22766D" stroke-width="3" stroke-linecap="round"/><circle cx="485" cy="422" r="9" fill="#769AA5" stroke="#173750" stroke-width="1"/><circle cx="505" cy="422" r="9
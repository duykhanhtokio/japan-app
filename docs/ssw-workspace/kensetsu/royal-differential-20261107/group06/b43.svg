<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><g font-family="Noto Sans CJK JP" fill="#173750"><rect x="20" y="20" width="1160" height="610" rx="28" fill="#FFFAEC" stroke="#B38432" stroke-width="3"/><text x="55" y="78" font-size="34" text-anchor="start">なまし線の性質と、工具の部分</text><path d="M55,101 L1145,101" fill="none" stroke="#B38432" stroke-width="2" stroke-linecap="round"/><rect x="55" y="135" width="533" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="77" y="185" font-size="29" text-anchor="start">なまし線・番線</text><text x="77" y="235" font-size="24" text-anchor="start">焼きなましで柔らかく</text><text x="77" y="275" font-size="24" text-anchor="start">結束などのための線材</text><text x="77" y="315" font-size="24" text-anchor="start">強度が必ず増す意味でない</text><rect x="612" y="135" width="533" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="634" y="185" font-size="29" text-anchor="start">シノと回す口</text><text x="634" y="235" font-size="24" text-anchor="start">細い先端：結束等の用途</text><text x="634" y="275" font-size="24" text-anchor="start">口の部分：ボルトを回す</text><text x="634" y="315" font-size="24" text-anchor="start">ラチェット ≠ トルク測定</text><ellipse cx="260" cy="451" rx="95" ry="41" fill="none" stroke="#769AA5" stroke-width="4"/><ellipse cx="272" cy="451" rx="95" ry="41" fill="none" stroke="#769AA5" stroke-width="4"/><ellipse cx="284" cy="451" rx="95" ry="41" fill="none" stroke="#769AA5" stroke-width="4"/><path d="M719 454 H1020 L1085 443 L1020 431 H719 Z" fill="#DDE5EA" stroke="#173750" stroke-width="3"/><circle cx="719" cy="442" r="35" fill="#DDE5EA" stroke="#173750" stroke-width="3"/><path d="M719 422 L736 432 V452 L719 462 L702 452 V432 Z" fill="#FFFAEC" stroke="#173750" stroke-width="2"/><text x="55" y="615" font-size="23" text-anchor="start">役割を比べる概念図・操作手順ではありません</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><g font-family="Noto Sans CJK JP" fill="#173750"><rect x="20" y="20" width="1160" height="610" rx="28" fill="#FFFAEC" stroke="#B38432" stroke-width="3"/><text x="55" y="78" font-size="34" text-anchor="start">塗膜の層と、次の工程の時期</text><path d="M55,101 L1145,101" fill="none" stroke="#B38432" stroke-width="2" stroke-linecap="round"/><rect x="55" y="135" width="533" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="77" y="185" font-size="29" text-anchor="start">層の位置</text><text x="77" y="235" font-size="24" text-anchor="start">下塗り → 中塗り → 上塗り</text><text x="77" y="275" font-size="24" text-anchor="start">素地への付着・吸込み</text><text x="77" y="315" font-size="24" text-anchor="start">製品の用途を照合</text><rect x="612" y="135" width="533" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="634" y="185" font-size="29" text-anchor="start">工程間隔</text><text x="634" y="235" font-size="24" text-anchor="start">最短時間だけとは限らない</text><text x="634" y="275" font-size="24" text-anchor="start">上限・再処理の指定も確認</text><text x="634" y="315" font-size="24" text-anchor="start">温度等の条件を対応</text><rect x="109" y="493" width="239" height="35" rx="2" fill="#D8C398" stroke="#173750" stroke-width="3"/><rect x="109" y="466" width="239" height="27" rx="1" fill="#DDE5EA" stroke="#173750" stroke-width="3"/><rect x="109" y="439" width="239" height="27" rx="1" fill="#E8D6AE" stroke="#173750" stroke-width="3"/><rect x="109" y="412" width="239" height="27" rx="1" fill="#D8E9E1" stroke="#173750" stroke-width="3"/><text x="371" y="431" font-size="22" text-anchor="start">上塗り</text><text x="371" y="458" font-size="22" text-anchor="start">中塗り</text><text x="371" y="485" font-size="22" text-anchor="start">下塗り</text><text x="371" y="517" font-size="22" text-anchor="start">素地</text><rect x="665" y="413" width="152" height="67" rx="3" fill="#DDE5EA" stroke="#22766D" stroke-width="3"/><rect x="926" y="413" width="152" height="67" rx="3" fill="#D8E9E1" stroke="#22766D" stroke-width="3"/><text x="741" y="454" font-size="23" text-anchor="middle">前の工程</text><text x="1002" y="454" font-size="23" text-anchor="middle">次の工程</text><path d="M825,445 L917,445" fill="none" stroke="#B38432" stroke-width="3" stroke-linecap="round"/><text x="871" y="512" font-size="24" text-anchor="middle">製品・条件で照合</text><text x="55" y="615" font-size="23" text-anchor="start">役割を比べる概念図・操作手順ではありません</text></g></svg>

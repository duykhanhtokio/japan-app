<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><g font-family="Noto Sans CJK JP" fill="#173750"><rect x="20" y="20" width="1160" height="610" rx="28" fill="#FFFAEC" stroke="#B38432" stroke-width="3"/><text x="55" y="78" font-size="34" text-anchor="start">木造の床・屋根・仮支持</text><path d="M55,101 L1145,101" fill="none" stroke="#B38432" stroke-width="2" stroke-linecap="round"/><rect x="55" y="135" width="347" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="77" y="185" font-size="29" text-anchor="start">柱と床</text><text x="77" y="235" font-size="24" text-anchor="start">土台・胴差</text><text x="77" y="275" font-size="24" text-anchor="start">通し柱：複数階</text><text x="77" y="315" font-size="24" text-anchor="start">管柱：階ごと</text><rect x="426" y="135" width="347" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="448" y="185" font-size="29" text-anchor="start">屋根を支える</text><text x="448" y="235" font-size="24" text-anchor="start">小屋束・母屋・棟木</text><text x="448" y="275" font-size="24" text-anchor="start">垂木 → 野地板</text><text x="448" y="315" font-size="24" text-anchor="start">上棟 ≠ 全体の完成</text><rect x="797" y="135" width="347" height="425" rx="18" fill="#F0F3EE" stroke="#22766D" stroke-width="3"/><text x="819" y="185" font-size="29" text-anchor="start">接合と仮支持</text><text x="819" y="235" font-size="24" text-anchor="start">仮筋交い：途中の保持</text><text x="819" y="275" font-size="24" text-anchor="start">ホールダウン：引抜き</text><text x="819" y="315" font-size="24" text-anchor="start">取外しの判断は別</text><rect x="88" y="510" width="274" height="15" rx="1" fill="#D8C398" stroke="#173750" stroke-width="3"/><rect x="88" y="446" width="274" height="14" rx="1" fill="#D8C398" stroke="#173750" stroke-width="3"/><rect x="111" y="389" width="17" height="121" rx="1" fill="#D8C398" stroke="#173750" stroke-width="3"/><rect x="306" y="389" width="17" height="57" rx="1" fill="#D8C398" stroke="#173750" stroke-width="3"/><rect x="306" y="460" width="17" height="50" rx="1" fill="#D8C398" stroke="#173750" stroke-width="3"/><text x="151" y="412" font-size="21" text-anchor="start">通し柱</text><text x="237" y="493" font-size="21" text-anchor="start">管柱</text><path d="M468 444 L590 386 L711 444" fill="none" stroke="#173750" stroke-width="7"/><rect x="583" y="384" width="14" height="20" rx="1" fill="#E8D6AE" stroke="#173750" stroke-width="3"/><rect x="511" y="418" width="14" height="20" rx="1" fill="#E8D6AE" stroke="#173750" stroke-width="3"/><rect x="655" y="418" width="14" height="20" rx="1" fill="#E8D6AE" stroke="#173750" stroke-width="3"/><path d="M590,405 L590,478" fill="none" stroke="#B38432" stroke-width="9" stroke-linecap="round"/><path d="M479,482 L700,482" fill="none" stroke="#173750" stroke-width="8" stroke-linecap="round"/><text x="590" y="521" font-size="21" text-anchor="middle">垂木・母屋・小屋束</text><path d="M847,396 L847,518" fill="none" stroke="#173750" stroke-width="8" stroke-linecap="round"/><path d="M1093,396 L1093,518" fill="none" stroke="#173750" stroke-width="8" stroke-linecap="round"/><path d="M847,396 L1093,396" fill="none" stroke="#173750" stroke-width="8" stroke-linecap="round"/><path d="M847,518 L1093,518" fill="none" stroke="#173750" stroke-width="8" stroke-linecap="round"/><path d="M847,518 L1093,396" fill="none" stroke="#B38432" stroke-width="5" stroke-linecap="round"/><rect x="839" y="482" width="16" height="35" rx="1" fill="#DDE5EA" stroke="#22766D" stroke-width="3"/><text x="971" y="549" font-size="20" text-anchor="middle">部分図・接合設計ではない</text><text x="55" y="615" font-size="23" text-anchor="start">役割を比べる概念図・操作手順ではありません</text></g></svg>
